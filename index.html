<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>WORLD DEFENSE</title><style>*{box-sizing:border-box}body{margin:0;background:#12251f;color:#f8edcc;font-family:system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:clamp(21px,5vw,32px);margin:8px 0}button{border:2px solid #b99c60;background:#254338;color:#fff0c9;border-radius:12px;padding:10px;font-weight:700;cursor:pointer}button.active{background:#9b682b}button:disabled{opacity:.4}.stats,.tools{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0}.stats span{padding:8px;background:#244034;border:1px solid #b99c60;border-radius:10px}canvas{display:block;width:100%;height:auto;aspect-ratio: 16 / 10;border:5px solid #9e8551;border-radius:15px;touch-action:manipulation;background:#81a85c}.tools button{flex:1;min-width:75px}#msg{min-height:48px;line-height:1.5}small{color:#d5c6a4}</style></head><body><main class="wrap"><header><h1>⚔️ WORLD DEFENSE</h1><div class="stats"><span id="hp">❤️ 20</span><span id="gold">🪙 500G</span><span id="wave">WAVE 0/20</span></div></header><canvas id="game" width="960" height="600" aria-label="ゲームマップ"></canvas><div class="tools"><button data-t="arrow">🏹 弓 100G</button><button data-t="cannon">💣 大砲 180G</button><button data-t="magic">🔮 魔法 220G</button><button data-t="ice">❄️ 氷 150G</button></div><div class="tools"><button id="start">▶ ウェーブ開始</button><button id="speed">⏩ x1</button><button id="pause">⏸ 停止</button><button id="upgrade">⬆ 強化</button><button id="sell">🪙 売却</button><button id="reset">↻ 最初から</button></div><p id="msg">塔を選び、草地をタップして建設しよう。上下に分かれる道を守ろう！</p><small>GitHub Pages / Safari対応・単体HTML試作版</small></main><script>
(()=>{'use strict';const C=document.getElementById('game'),ctx=C.getContext('2d');const $=id=>document.getElementById(id);const W=960,H=600;const types={arrow:{cost:100,range:155,damage:18,rate:.45,col:'#a56b35',icon:'🏹'},cannon:{cost:180,range:130,damage:48,rate:1.6,col:'#56616d',icon:'💣'},magic:{cost:220,range:170,damage:32,rate:.8,col:'#8a57b5',icon:'🔮'},ice:{cost:150,range:145,damage:9,rate:.95,col:'#65b9d6',icon:'❄️'}};const upper=[[0,300],[140,300],[235,165],[450,165],[560,300],[760,300],[960,300]],lower=[[0,300],[140,300],[235,440],[450,440],[560,300],[760,300],[960,300]];let gold=500,hp=20,wave=0,selectedType='arrow',selectedTower=null,towers=[],enemies=[],shots=[],playing=false,paused=false,speed=1,spawned=0,spawnClock=0,spawnTotal=0,last=0,over=false;const rand=(a,b)=>a+Math.random()*(b-a);const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);function updateUI(){ $('hp').textContent='❤️ '+hp;$('gold').textContent='🪙 '+Math.floor(gold)+'G';$('wave').textContent='WAVE '+wave+'/20';$('start').disabled=playing||over;$('upgrade').disabled=!selectedTower||gold<Math.round(types[selectedTower.type].cost*(.7+selectedTower.level*.55))||selectedTower.level>=5;$('sell').disabled=!selectedTower;document.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('active',b.dataset.t===selectedType));}function msg(s){$('msg').textContent=s;}function pathAt(path,d){for(let i=1;i<path.length;i++){const a=path[i-1],b=path[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=l)return{x:a[0]+(b[0]-a[0])*d/l,y:a[1]+(b[1]-a[1])*d/l};d-=l;}return{x:960,y:300,done:true};}function roadDistance(x,y,path){let best=1e9;for(let i=1;i<path.length;i++){let [ax,ay]=path[i-1],[bx,by]=path[i],dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy)));best=Math.min(best,Math.hypot(x-(ax+dx*t),y-(ay+dy*t)));}return best;}function createEnemy(){const branch=Math.random()<(.3+.4*(wave%3)/2)?upper:lower;let kind='goblin';if(wave>3&&Math.random()<.22)kind='wolf';if(wave>6&&Math.random()<.18)kind='knight';if(wave>9&&Math.random()<.12)kind='slime';if(wave>12&&Math.random()<.1)kind='dragon';if(wave%5===0&&spawned===spawnTotal-1)kind='boss';const conf={goblin:[45,65,10,'#b65e3e',12],wolf:[35,110,12,'#9c8466',10],knight:[145,42,22,'#677b9b',15],slime:[65,50,16,'#82c869',13],dragon:[135,85,27,'#a95b9b',16],boss:[650,32,150,'#754359',27]}[kind];const max=conf[0]*(1+(wave-1)*.19);enemies.push({path:branch,d:0,x:0,y:300,kind,hp:max,max,speed:conf[1],reward:conf[2],color:conf[3],r:conf[4],slow:0});}function fire(t,e){const p=types[t.type];shots.push({x:t.x,y:t.y,tx:e.x,ty:e.y,life:.2,col:p.col});let damage=p.damage*(1+.55*(t.level-1));if(t.type==='cannon'){enemies.forEach(a=>{if(dist(a,e)<65)a.hp-=damage;});}else{e.hp-=damage;if(t.type==='ice')e.slow=1.7;} }function tick(dt){if(!playing||paused||over)return;dt=Math.min(dt,.05)*speed;spawnClock-=dt;while(spawned<spawnTotal&&spawnClock<=0){createEnemy();spawned++;spawnClock+=Math.max(.35,.95-wave*.015);}for(const e of enemies){e.slow=Math.max(0,e.slow-dt);e.d+=e.speed*(e.slow>0?.48:1)*dt;Object.assign(e,pathAt(e.path,e.d));if(e.x>=960){hp--;e.hp=-999;}}for(const t of towers){t.cd-=dt;if(t.cd<=0){const targets=enemies.filter(e=>e.hp>0&&dist(t,e)<types[t.type].range).sort((a,b)=>b.d-a.d);if(targets.length){fire(t,targets[0]);t.cd=types[t.type].rate;}}}for(const e of enemies){if(e.hp<=0&&e.hp!==-999){gold+=e.reward;e.hp=-999;}}enemies=enemies.filter(e=>e.hp!==-999);shots.forEach(s=>s.life-=dt);shots=shots.filter(s=>s.life>0);if(hp<=0){hp=0;over=true;playing=false;msg('ゲームオーバー！ 最初から挑戦しよう。');}else if(spawned>=spawnTotal&&enemies.length===0){playing=false;gold+=50+wave*8;msg(wave===20?'🎉 20ウェーブクリア！ 勝利！':'ウェーブ '+wave+' クリア！ 次の準備をしよう。');if(wave===20)over=true;}updateUI();}function polygon(points,color,width){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.stroke();}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#7ea75d';ctx.fillRect(0,0,W,H);for(let i=0;i<180;i++){let x=(i*173+37)%960,y=(i*119+61)%600;ctx.fillStyle=i%3===0?'#719a53':'#91b66d';ctx.beginPath();ctx.arc(x,y,2+i%5,0,Math.PI*2);ctx.fill();}for(let i=0;i<26;i++){let x=(i*211+50)%960,y=(i*157+30)%600;if(roadDistance(x,y,upper)<53||roadDistance(x,y,lower)<53)continue;ctx.fillStyle='#426f40';ctx.beginPath();ctx.arc(x,y,20,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5b8a48';ctx.beginPath();ctx.arc(x-6,y-6,16,0,Math.PI*2);ctx.fill();}for(const path of [upper,lower]){polygon(path,'#8e7650',62);polygon(path,'#d8bd84',49);polygon(path,'#e2c995',3);}ctx.fillStyle='#536b75';ctx.fillRect(865,242,75,112);ctx.fillStyle='#9daeb0';ctx.fillRect(875,225,55,28);ctx.fillStyle='#b4bec1';for(let x=870;x<940;x+=24)ctx.fillRect(x,214,14,20);ctx.fillStyle='#533f38';ctx.fillRect(894,306,25,48);ctx.fillStyle='#fff1c3';ctx.font='bold 20px system-ui';ctx.fillText('🏰 城',858,202);for(const t of towers){const p=types[t.type];if(t===selectedTower){ctx.strokeStyle='#fff4b2';ctx.lineWidth=2;ctx.beginPath();ctx.arc(t.x,t.y,p.range,0,Math.PI*2);ctx.stroke();}ctx.fillStyle='#564532';ctx.fillRect(t.x-22,t.y-10,44,45);ctx.fillStyle=p.col;ctx.beginPath();ctx.moveTo(t.x-29,t.y-10);ctx.lineTo(t.x,t.y-45);ctx.lineTo(t.x+29,t.y-10);ctx.closePath();ctx.fill();ctx.font='30px system-ui';ctx.textAlign='center';ctx.fillText(p.icon,t.x,t.y+13);ctx.font='bold 14px system-ui';ctx.fillStyle='#fff';ctx.fillText('Lv'+t.level,t.x,t.y+49);}for(const e of enemies){ctx.fillStyle='#392e2b';ctx.beginPath();ctx.ellipse(e.x,e.y+e.r*.6,e.r*1.1,e.r*.45,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(e.x-5,e.y-4,4,4);ctx.fillRect(e.x+3,e.y-4,4,4);ctx.fillStyle='#2c332b';ctx.fillRect(e.x-e.r,e.y-e.r-12,e.r*2,5);ctx.fillStyle='#e6554b';ctx.fillRect(e.x-e.r,e.y-e.r-12,e.r*2*Math.max(0,e.hp/e.max),5);}for(const s of shots){ctx.strokeStyle=s.col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.tx,s.ty);ctx.stroke();}ctx.textAlign='left';ctx.font='bold 18px system-ui';ctx.fillStyle='#294b2f';ctx.fillText('入口 →',12,270);ctx.fillText('上ルート',330,119);ctx.fillText('下ルート',330,505);}C.addEventListener('click',ev=>{const r=C.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height;const old=towers.find(t=>Math.hypot(t.x-x,t.y-y)<38);if(old){selectedTower=old;msg('塔 Lv'+old.level+'：強化または売却できます。');updateUI();return;}selectedTower=null;const p=types[selectedType];if(gold<p.cost){msg('資金が足りません。');}else if(x<38||x>825||y<45||y>555||roadDistance(x,y,upper)<58||roadDistance(x,y,lower)<58||towers.some(t=>Math.hypot(t.x-x,t.y-y)<65)){msg('そこには建設できません。草地の広い場所を選んでね。');}else{gold-=p.cost;towers.push({x,y,type:selectedType,level:1,cd:0,spent:p.cost});msg(p.icon+' 塔を建設した！');}updateUI();});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{selectedType=b.dataset.t;selectedTower=null;msg(types[selectedType].icon+' を選択。草地をタップして建設しよう。');updateUI();});$('start').onclick=()=>{if(playing||over)return;wave++;spawned=0;spawnTotal=8+wave*3;spawnClock=.5;playing=true;paused=false;msg('ウェーブ '+wave+' 開始！ 敵が分岐ルートを進んできます。');updateUI();};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶ 再開':'⏸ 停止';};$('speed').onclick=()=>{speed=speed===1?2:1;$('speed').textContent='⏩ x'+speed;};$('upgrade').onclick=()=>{if(!selectedTower||selectedTower.level>=5)return;const price=Math.round(types[selectedTower.type].cost*(.7+selectedTower.level*.55));if(gold<price)return;gold-=price;selectedTower.spent+=price;selectedTower.level++;msg('塔をレベル'+selectedTower.level+'に強化！');updateUI();};$('sell').onclick=()=>{if(!selectedTower)return;gold+=Math.floor(selectedTower.spent*.7);towers=towers.filter(t=>t!==selectedTower);selectedTower=null;msg('塔を売却した。');updateUI();};$('reset').onclick=()=>{if(!confirm('最初からやり直しますか？'))return;gold=500;hp=20;wave=0;selectedTower=null;towers=[];enemies=[];shots=[];playing=false;paused=false;over=false;msg('新しいゲームを開始。塔を建てよう！');updateUI();};function frame(now){const dt=last?(now-last)/1000:0;last=now;tick(dt);draw();requestAnimationFrame(frame);}updateUI();requestAnimationFrame(frame);})();
</script></body></html>
