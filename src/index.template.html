<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>WORLD DEFENSE</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #12251f;
        color: #f8edcc;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        max-width: 960px;
        margin: auto;
        padding: 12px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: clamp(21px, 5vw, 32px);
        margin: 8px 0;
      }
      button {
        border: 2px solid #b99c60;
        background: #254338;
        color: #fff0c9;
        border-radius: 12px;
        padding: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      button.active {
        background: #9b682b;
      }
      button:disabled {
        opacity: 0.4;
      }
      .stats,
      .tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .stats span {
        padding: 8px;
        background: #244034;
        border: 1px solid #b99c60;
        border-radius: 10px;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 10;
        border: 5px solid #9e8551;
        border-radius: 15px;
        touch-action: manipulation;
        background: #81a85c;
      }
      .tools button {
        flex: 1;
        min-width: 75px;
      }
      #msg {
        min-height: 48px;
        line-height: 1.5;
      }
      small {
        color: #d5c6a4;
      }
      body {
        background: radial-gradient(ellipse at top, #285c59, #102e36);
        color: #fff1d0;
      }
      .wrap {
        max-width: 1080px;
        padding: 16px;
      }
      header {
        border-bottom: 1px solid #b8d6b533;
        padding-bottom: 10px;
      }
      h1 {
        letter-spacing: 0.08em;
        text-shadow: 0 3px 0 #102f37;
      }
      .stats span {
        background: #153e44;
        border-color: #719b8f;
        box-shadow: inset 0 1px #ffffff18;
      }
      canvas {
        border-color: #e1bc77;
        box-shadow: 0 14px 36px #051f3766;
        margin: 16px 0;
      }
      button {
        background: linear-gradient(#3b6664, #21494e);
        border-color: #91ac92;
        min-height: 46px;
        box-shadow: 0 3px 0 #102f37;
        touch-action: manipulation;
      }
      button.active {
        background: linear-gradient(#e4b861, #ab7736);
        border-color: #ffe5a6;
        color: #233b3a;
      }
      button:focus-visible {
        outline: 3px solid #ffe7a0;
        outline-offset: 3px;
      }
      #msg {
        background: #143c45;
        border-left: 3px solid #dfbb75;
        padding: 12px;
        border-radius: 4px;
      }
      small {
        color: #b9d4c6;
      }
      @media (max-width: 600px) {
        .wrap {
          padding: 8px;
        }
        .tools {
          gap: 6px;
        }
        .tools button {
          font-size: 12px;
          padding: 9px 5px;
        }
        .unit-tools button {
          font-size: 14px;
        }
        .tower-tools button {
          padding: 6px 3px;
          min-width: 0;
        }
        .tower-tools .t-img {
          width: 26px;
          height: 26px;
        }
        canvas {
          border-width: 3px;
          margin: 10px 0;
        }
        .stats span {
          font-size: 12px;
          padding: 6px;
        }
        h1 {
          font-size: 21px;
        }
      }
      /* ---- 塔パネル・武将配属 ---- */
      [hidden] {
        display: none !important;
      }
      .panel {
        background: #143c45;
        border: 1px solid #719b8f;
        border-radius: 12px;
        padding: 10px 12px;
        margin: -6px 0 10px;
        font-size: 15px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .panel-head strong {
        font-size: 16px;
      }
      .icon-btn {
        font-size: 16px;
        min-width: 46px;
        padding: 6px 10px;
      }
      .tp-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin: 6px 0;
        color: #d8eadf;
      }
      .tp-stats b {
        color: #ffe3a0;
      }
      .tp-stats b.low {
        color: #ff8f80;
      }
      .repair {
        width: 100%;
        margin-top: 6px;
        font-size: 15px;
      }
      .buff {
        color: #9df0b0;
      }
      .tp-hero {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 8px;
        min-height: 40px;
      }
      .tp-hero p {
        margin: 0;
        line-height: 1.4;
      }
      .panel small,
      .sheet small {
        font-size: 14px;
      }
      .panel-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .panel-actions button,
      .skill {
        font-size: 15px;
        padding: 8px 6px;
      }
      .skill {
        width: 100%;
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: stretch;
      }
      .panel,
      .panel *,
      .sheet,
      .sheet * {
        -webkit-tap-highlight-color: transparent;
      }
      .skill:disabled {
        opacity: 0.8;
      }
      .skill.running:disabled {
        opacity: 1;
      }
      .skill.ready {
        background: linear-gradient(#e4b861, #ab7736);
        border-color: #ffe5a6;
        color: #233b3a;
      }
      .skill.running {
        border-color: #9df0b0;
      }
      .bar {
        display: block;
        height: 8px;
        border-radius: 4px;
        background: #0b262c;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #ffd77d;
      }
      .skill.running .bar i {
        background: #9df0b0;
      }
      .avatar {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #ffe0a0;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 19px;
        color: #fff;
        text-shadow: 0 1px 2px #0008;
        background-size: cover;
        background-position: center;
      }
      .avatar.big {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }
      .tower-tools button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px 4px;
        line-height: 1.2;
      }
      .tower-tools .t-img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        flex: none;
      }
      .tower-tools .t-img:not([src]) {
        display: none;
      }
      .tower-tools .t-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 14px;
        white-space: nowrap;
      }
      .tower-tools .t-text small {
        font-size: 14px;
        color: inherit;
      }
      .unit-tools {
        align-items: center;
      }
      .unit-tools .row-label {
        flex: none;
        font-size: 14px;
        padding: 0 4px;
        color: #d8eadf;
      }
      .unit-tools button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 14px;
      }
      .unit-tools button img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        transform: scaleX(-1);
      }
      .panel-actions.four {
        grid-template-columns: repeat(4, 1fr);
      }
      .panel-actions.four button {
        padding: 6px 2px;
        line-height: 1.2;
      }
      .panel-actions small {
        display: block;
        font-size: 14px;
        color: #ffe3a0;
      }
      .panel-actions.two {
        grid-template-columns: repeat(2, 1fr);
      }
      .members {
        display: flex;
        gap: 6px;
        margin: 6px 0;
      }
      .chip {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
      }
      .chip.add {
        justify-content: center;
        align-items: center;
        gap: 0;
        border-style: dashed;
        background: #1c4a46;
      }
      .chip.add .cost {
        font-size: 14px;
        color: #ffe3a0;
      }
      .chip.sel {
        border-color: #ffe5a6;
        background: linear-gradient(#5d7c62, #2d5452);
      }
      .chip .bar {
        width: 100%;
        height: 6px;
      }
      .soldier-info {
        line-height: 1.45;
        margin: 4px 0 8px;
      }
      .soldier-info .title {
        color: #ffe3a0;
      }
      .squad-card {
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
      }
      .squad-card h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .soldier-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        line-height: 1.35;
      }
      .soldier-row button,
      .squad-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
      }
      .muted {
        color: #b9d4c6;
      }
      .rarity {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 800;
      }
      .stars {
        color: #ffd77d;
        font-size: 14px;
      }
      .hero-line {
        line-height: 1.45;
        margin: 2px 0 8px;
      }
      .tickets {
        font-size: 18px;
        font-weight: 800;
        color: #ffe3a0;
        margin: 6px 0;
      }
      .gacha-pull {
        width: 100%;
        font-size: 17px;
        margin: 6px 0 10px;
      }
      .pull-result {
        display: flex;
        gap: 12px;
        padding: 10px;
        border: 2px solid;
        border-radius: 12px;
        margin-bottom: 8px;
      }
      .pull-result h3 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .pull-result p {
        margin: 2px 0;
        line-height: 1.45;
      }
      .warn {
        color: #ffb3a7;
      }
      .hp-line {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
      }
      .hp-line .bar {
        flex: 1;
        height: 12px;
      }
      .bar.hp i {
        background: #ef6a58;
      }
      .retreat {
        width: 100%;
        font-size: 15px;
      }
      .sheet-back {
        position: fixed;
        inset: 0;
        background: #0610147a;
        z-index: 10;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: min(560px, 100%);
        max-height: 72vh;
        overflow-y: auto;
        background: #12343c;
        border: 1px solid #e1bc77;
        border-bottom: 0;
        border-radius: 16px 16px 0 0;
        padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
        font-size: 15px;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 8px 0 2px;
      }
      .tabs button {
        flex: 1;
        min-height: 40px;
        font-size: 15px;
      }
      .tabs.four button {
        padding: 4px 2px;
        line-height: 1.2;
        font-size: 14px;
      }
      .tabs.four small {
        display: block;
        font-size: 13px;
      }
      .saved {
        min-height: 20px;
        margin: 4px 0;
        color: #9fe0a8;
        font-size: 14px;
      }
      .saved.warn {
        color: #ffb3a7;
      }
      .unit-box {
        padding: 8px 10px;
        border: 1px solid #719b8f88;
        border-radius: 10px;
        background: #0f2c33;
      }
      .unit-box h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .unit-box p {
        margin: 2px 0;
        line-height: 1.45;
      }
      .pick-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid #719b8f44;
        line-height: 1.35;
      }
      .pick-row > span {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .pick-row.named b {
        color: #ffd77d;
      }
      .pick-row button {
        flex: none;
        min-width: 72px;
        min-height: 44px;
        font-size: 15px;
        padding: 6px 10px;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0 4px;
      }
      .filters button {
        min-height: 40px;
        padding: 4px 12px;
        font-size: 14px;
      }
      .s-card {
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
        line-height: 1.45;
      }
      .s-card h3 {
        margin: 0 0 2px;
        font-size: 16px;
      }
      .s-card h3 small {
        font-weight: 400;
      }
      .s-card.named h3 {
        color: #ffd77d;
      }
      .s-card.named {
        background: linear-gradient(90deg, #e1bc7722, transparent 70%);
      }
      .s-card p {
        margin: 2px 0;
      }
      .xpbar {
        height: 6px;
        background: #0b2329;
        border-radius: 3px;
        overflow: hidden;
        margin: 3px 0;
      }
      .xpbar i {
        display: block;
        height: 100%;
        background: #e4b861;
      }
      .skill-tag {
        display: inline-block;
        padding: 1px 7px;
        margin: 2px 4px 2px 0;
        border-radius: 8px;
        background: #2d5452;
        border: 1px solid #91ac92;
        font-size: 13px;
      }
      .skill-tag.unique {
        border-color: #ffd77d;
        color: #ffe3a0;
      }
      .s-card .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .s-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
        flex: 1;
      }
      .injured {
        color: #ffb3a7;
      }
      .hero-card {
        display: flex;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
      }
      .hero-card h3 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .hero-card p {
        margin: 2px 0;
        line-height: 1.45;
      }
      .hero-card .where {
        color: #ffe3a0;
      }
      .hero-card .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .hero-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>⚔️ WORLD DEFENSE</h1>
        <div class="stats">
          <span id="hp">❤️ 20</span><span id="gold">🪙 500G</span><span id="wave">WAVE 0/20</span>
        </div>
      </header>
      <canvas id="game" width="960" height="600" aria-label="ゲームマップ"></canvas>
      <section id="towerPanel" class="panel" hidden aria-label="選択中の塔">
        <div class="panel-head">
          <strong id="tpTitle"></strong
          ><button id="tpClose" class="icon-btn" aria-label="塔の選択を解除">✕</button>
        </div>
        <div id="tpStats" class="tp-stats"></div>
        <div id="tpHero" class="tp-hero"></div>
        <div class="panel-actions">
          <button id="upgrade">⬆ 強化</button><button id="sell">🪙 売却</button
          ><button id="assign">👤 武将配属</button>
        </div>
        <button id="repair" class="repair" hidden>🔨 修理</button>
        <button id="skill" class="skill" hidden>
          <span id="skillLabel"></span><span class="bar"><i id="skillBar"></i></span>
        </button>
      </section>
      <div class="tools tower-tools" aria-label="防衛塔">
        <button data-t="arrow">
          <img class="t-img" data-sprite="arrow" alt="" /><span class="t-text"
            >弓<small>100G</small></span
          ></button
        ><button data-t="cannon">
          <img class="t-img" data-sprite="cannon" alt="" /><span class="t-text"
            >大砲<small>180G</small></span
          ></button
        ><button data-t="magic">
          <img class="t-img" data-sprite="magic" alt="" /><span class="t-text"
            >鉄砲<small>220G</small></span
          ></button
        ><button data-t="ice">
          <img class="t-img" data-sprite="ice" alt="" /><span class="t-text">水攻め<small>150G</small></span>
        </button>
      </div>
      <div class="tools unit-tools" id="unitTools" aria-label="兵士部隊（道に配置）">
        <span class="row-label" id="unitCount">部隊 0/4</span><button id="organize">📋 編成</button>
      </div>
      <section id="squadPanel" class="panel" hidden aria-label="選択中の部隊">
        <div class="panel-head">
          <strong id="sqTitle"></strong
          ><button id="sqClose" class="icon-btn" aria-label="部隊の選択を解除">✕</button>
        </div>
        <div id="sqSummary" class="tp-stats"></div>
        <div id="sqHeroLine" class="hero-line"></div>
        <div id="sqMembers" class="members"></div>
        <div id="soldierInfo" class="soldier-info"></div>
        <div class="panel-actions four">
          <button id="retreat">↩ 撤退</button><button id="sqHeal">🩹 治療</button
          ><button id="sqHero">👤 武将</button><button id="sqOrganize">📋 編成</button>
        </div>
        <button id="sqSkill" class="skill" hidden>
          <span id="sqSkillLabel"></span><span class="bar"><i id="sqSkillBar"></i></span>
        </button>
      </section>
      <div class="tools">
        <button id="start">▶ ウェーブ開始</button><button id="speed">⏩ x1</button
        ><button id="pause">⏸ 停止</button><button id="gacha">🎴 ガチャ</button
        ><button id="roster">👥 武将</button><button id="soldiers">🪖 兵士</button
        ><button id="siege">⚔️ 攻城編成</button><button id="reset">↻ 最初から</button>
      </div>
      <p id="msg">塔を選び、草地をタップして建設しよう。上下に分かれる道を守ろう！</p>
      <small>GitHub Pages / Safari対応・ペイント調・個別素材版 v15.1（鉄砲兵・衛生兵の画像）</small>
    </main>
    <div id="squadSheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="squadTitle">
        <div class="panel-head">
          <strong id="squadTitle">部隊編成</strong
          ><button id="squadClose" class="icon-btn" aria-label="閉じる">✕</button>
        </div>
        <p id="squadHint" style="margin: 6px 0"></p>
        <div id="squadList"></div>
      </div>
    </div>
    <div id="soldierSheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="soldierTitle">
        <div class="panel-head">
          <strong id="soldierTitle">兵士名簿</strong
          ><button id="soldierClose" class="icon-btn" aria-label="閉じる">✕</button>
        </div>
        <div class="tabs" role="tablist">
          <button id="tabLive" role="tab">在籍の兵士</button
          ><button id="tabFallen" role="tab">英霊名鑑</button>
        </div>
        <p id="soldierHint" class="muted" style="margin: 6px 0"></p>
        <div id="soldierList"></div>
      </div>
    </div>
    <div id="siegeSheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="siegeTitle">
        <div class="panel-head">
          <strong id="siegeTitle">⚔️ 攻城部隊編成</strong
          ><button id="siegeClose" class="icon-btn" aria-label="閉じる">✕</button>
        </div>
        <div id="siegeTabs" class="tabs four" role="tablist"></div>
        <p id="siegeSaved" class="saved" aria-live="polite"></p>
        <div id="siegeUnit"></div>
        <div id="siegePick"></div>
      </div>
    </div>
    <div id="gachaSheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gachaTitle">
        <div class="panel-head">
          <strong id="gachaTitle">戦国武将ガチャ（無料）</strong
          ><button id="gachaClose" class="icon-btn" aria-label="閉じる">✕</button>
        </div>
        <p id="gachaTickets" class="tickets"></p>
        <p id="gachaRates" class="muted"></p>
        <button id="gachaPull" class="gacha-pull">🎴 1回引く（ガチャ券1枚）</button>
        <div id="gachaResult" aria-live="polite"></div>
      </div>
    </div>
    <div id="heroSheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="panel-head">
          <strong id="sheetTitle">武将配属</strong
          ><button id="sheetClose" class="icon-btn" aria-label="閉じる">✕</button>
        </div>
        <p id="sheetHint" style="margin: 6px 0"></p>
        <div id="heroList"></div>
      </div>
    </div>
    <script>
      (() => {
        "use strict";

            return { error: "城の直前には配置できません。" };
          if (fieldSquads().some((q) => Math.hypot(q.x - p.x, q.y - p.y) < SQUAD_RULES.minSpacing))
            return { error: "ほかの部隊に近すぎます。少し離して配置してください。" };
          if (fieldSquads().length >= SQUAD_RULES.maxDeployed)
            return { error: "道に出せる部隊は " + SQUAD_RULES.maxDeployed + " 部隊までです。" };
          return { point: p };
        }
        function putOnRoad(q, p) {
          q.state = "deployed";
          q.x = p.x;
          q.y = p.y;
          q.face = -1;
          joinWave(q);
        }
        // 新しい部隊を雇用して配置（squadSize 人 × 費用）
        function hireSquad(type, x, y) {
          const c = SOLDIER_TYPES[type];
          if (!c || !c.enabled) return (msg("その兵種はまだ使えません。"), null);
          const cost = c.cost * SQUAD_RULES.squadSize;
          const r = placeCheck(x, y);
          if (r.error) return (msg(r.error), null);
          if (squads.length >= SQUAD_RULES.maxSquads)
            return (msg("保有できる部隊は " + SQUAD_RULES.maxSquads + " 部隊までです。"), null);
          if (gold < cost) return (msg("資金が足りません（" + c.squadName + " " + cost + "G）。"), null);
          gold -= cost;
          const q = newSquad(type);
          for (let i = 0; i < SQUAD_RULES.squadSize; i++) newSoldier(type, q.id);
          putOnRoad(q, r.point);
          msg(squadName(q) + "（" + SQUAD_RULES.squadSize + "人）を雇用して配置した。");
          return q;
        }
        // 待機中の部隊を再配置（費用なし。戦闘中に撤退した部隊はそのウェーブ中は出せない）
        function deployReserve(q, x, y) {
          if (!q || !squads.includes(q) || q.state !== "reserve")
            return (msg("その部隊は配置できません。"), false);
          if (q.locked)
            return (msg(squadName(q) + " は撤退したばかりです。次のウェーブから配置できます。"), false);
          if (!members(q).length) return (msg("その部隊には兵士がいません。"), false);
          const r = placeCheck(x, y);
          if (r.error) return (msg(r.error), false);
          putOnRoad(q, r.point);
          msg(squadName(q) + " を配置した。");
          return true;
        }

        // ===== 兵士部隊：足止め =====
        const blockCap = (q) => {
          if (q.state !== "deployed") return 0;
          const list = members(q),
            extra = list.some((s) => skillSum(s, "block") > 0) ? 1 : 0; // 槍衾（部隊に1回まで）
          return Math.min(SOLDIER_TYPES[q.type].block + extra, list.length);
        };
        const blockCount = (q) => enemies.reduce((n, e) => n + (e.blockedBy === q ? 1 : 0), 0);
        // 足止めの解除。撤退・全滅・リセットのときに必ず呼ぶ
        function releaseBlocks(q) {
          for (const e of enemies)
            if (e.blockedBy === q) {
              e.blockedBy = null;
              e.blockTime = 0;
            }
        }
        function assignBlocks() {
          for (const e of enemies) {
            if (e.gone || e.blockedBy || e.hp <= 0 || e.breakthrough > 0) continue;
            if ((ENEMY_VS_UNIT[e.kind] || {}).unblockable) continue;
            for (const q of squads) {
              if (blockCount(q) >= blockCap(q) || dist(q, e) > SQUAD_RULES.blockRadius) continue;
              e.blockedBy = q;
              e.blockTime = 0;
              break;
            }
          }
        }
        // 足止めの整理：上限時間を超えた敵は突破、人数が減って上限を超えた分・存在しない部隊の分は解除
        function updateBlocks(dt) {
          const held = new Map();
          for (const e of enemies) {
            e.breakthrough = Math.max(0, (e.breakthrough || 0) - dt);
            const q = e.blockedBy;
            if (!q) continue;
            e.blockTime = (e.blockTime || 0) + dt;
            const n = (held.get(q) || 0) + 1;
            if (!squads.includes(q) || n > blockCap(q)) {
              e.blockedBy = null;
              e.blockTime = 0;
            } else if (e.blockTime >= SQUAD_RULES.maxBlockTime) {
              e.blockedBy = null;
              e.blockTime = 0;
              e.breakthrough = SQUAD_RULES.breakthroughTime;
            } else held.set(q, n);
          }
        }

        // ===== 兵士部隊：被弾・戦死・撤退 =====
        function damageSquad(q, raw, ranged) {
          const front = members(q)[0];
          if (!front) return;
          const st = soldierStats(front),
            guard = (1 - skillSum(front, "guard")) * (ranged ? 1 - skillSum(front, "rangedGuard") : 1);
          front.hp -= ((raw * SQUAD_RULES.defenseScale) / (SQUAD_RULES.defenseScale + st.def)) * guard;
          front.hit = 0.2;
          // 不屈：倒れるはずの攻撃を1ウェーブに1回だけ HP1 で耐える
          if (front.hp <= 0 && hasSkill(front, "unyielding") && !front.unyieldUsed) {
            front.unyieldUsed = true;
            front.hp = 1;
            logHistory(front, "不屈で踏みとどまった");
          }
          if (front.hp <= 0) return killSoldier(front, q);
          // 生存本能：HPが減ると撤退を試みる（1ウェーブに1回。失敗すると戦い続ける）
          if (
            hasSkill(front, "instinct") &&
            !front.instinctTried &&
            front.hp < st.maxHp * SQUAD_RULES.instinctHp
          ) {
            front.instinctTried = true;
            if (Math.random() < SQUAD_RULES.instinctChance) withdrawSoldier(front, q);
          }
        }
        // 生存本能による個人の撤退：このウェーブの間は戦場を離れ（攻撃も被弾もしない）、次の戦闘から復帰する
        function withdrawSoldier(s, q) {
          s.out = true;
          logHistory(s, "生存本能で戦場を離脱");
          msg(soldierName(s) + " は生存本能で戦場を離脱した（次の戦闘から復帰）。");
          const off = formationOffset(q, 0);
          unitGhosts.push({
            type: s.type,
            x: q.x + off[0],
            y: q.y + off[1],
            age: 0,
            duration: 0.8,
            scale: SQUAD_SCALE,
            retreat: true,
          });
          if (unitGhosts.length > 16) unitGhosts.shift();
          if (!members(q).length) leaveField(q);
        }
        // 戦っている兵士がいなくなったが、離脱した生存兵が残っている部隊：全滅ではなく待機に戻る
        function leaveField(q) {
          releaseBlocks(q);
          q.state = "reserve";
          q.retreatLeft = 0;
          q.locked = true;
          if (selectedSquad === q) selectedSquad = null;
        }
        function killSoldier(s, q) {
          if (!s.alive) return;
          s.alive = false; // 永久死亡：以後どの処理でも復活・編成・配置の対象にならない
          s.hp = 0;
          s.diedWave = wave;
          s.diedIn = squadName(q);
          logHistory(s, squadName(q) + " で戦死");
          recordDeath(s); // 保存データからすぐ外す（再読み込みしても復活しない）
          q.fallen++;
          const off = formationOffset(q, 0);
          unitGhosts.push({
            type: s.type,
            x: q.x + off[0],
            y: q.y + off[1],
            age: 0,
            duration: UNIT_FRAMES[s.type] && UNIT_FRAMES[s.type].death ? 1.4 : 0.8, // 戦死のコマは少し長く見せる
            scale: SQUAD_SCALE,
            face: q.face || -1,
          });
          if (unitGhosts.length > 16) unitGhosts.shift();
          const alive = members(q);
          if (alive.length === 1 && q.fallen >= SQUAD_RULES.squadSize - 1 && !alive[0].lastSurvivor) {
            alive[0].lastSurvivor = true;
            logHistory(alive[0], squadName(q) + " でただ一人生き残った（最後の生存者）");
            msg(soldierName(alive[0]) + " が " + squadName(q) + " 最後の生存者となった。");
          }
          if (!alive.length) {
            if (roster(q).length) leaveField(q);
            else wipeSquad(q);
          }
        }
        function wipeSquad(q) {
          releaseBlocks(q);
          squads = squads.filter((v) => v !== q);
          if (selectedSquad === q) selectedSquad = null;
          if (placeSquadId === q.id) placeSquadId = null;
          // 配属されていた武将は戦死せず負傷する（しばらく出陣できない）
          const h = heroOnSquad(q);
          if (h) injureHero(h);
          msg(
            squadName(q) +
              " が全滅した…（戦死者は復活しません。新しい兵士は雇用してください）" +
              (h
                ? " 武将 " +
                  WARLORDS[h.id].name +
                  " は負傷して退却（" +
                  HERO_RULES.injuryWaves +
                  "ウェーブ出陣不可）。"
                : ""),
          );
        }
        function orderRetreat(q) {
          if (!q || q.state !== "deployed") return;
          releaseBlocks(q);
          if (!playing) {
            q.state = "reserve";
            msg(squadName(q) + " を待機させた。");
            return;
          }
          // 戦闘中は撤退に時間がかかり、その間も攻撃を受ける（瞬間移動・無敵化しない）
          q.state = "retreating";
          q.retreatLeft = SQUAD_RULES.retreatTime;
          q.locked = true;
          msg(squadName(q) + " が撤退を開始（" + SQUAD_RULES.retreatTime + "秒）。");
        }

        // ===== 兵士部隊：戦闘（共通のゲーム時間で進む） =====
        function tickSquads(dt) {
          for (const q of squads.slice()) {
            if (q.state === "retreating" && (q.retreatLeft -= dt) <= 0) {
              q.state = "reserve";
              q.retreatLeft = 0;
              msg(squadName(q) + " の撤退が完了した。");
            }
          }
          // 兵士の攻撃（1人ずつ。攻撃間隔は余りを持ち越すのでフレームレートに左右されない）
          for (const q of squads) {
            if (q.state !== "deployed") continue;
            for (const s of members(q)) {
              s.cd -= dt;
              if (s.cd > 0) continue;
              if (SOLDIER_TYPES[q.type].heal) {
                healTick(s, q); // 衛生兵は攻撃しない
                continue;
              }
              const st = soldierStats(s),
                alive = enemies.filter((e) => !e.gone && e.hp > 0);
              const target =
                alive.find((e) => e.blockedBy === q) ||
                alive.filter((e) => dist(q, e) <= st.range).sort((a, b) => b.d - a.d)[0];
              if (!target) {
                s.cd = 0;
                continue;
              }
              s.cd += st.rate;
              s.atk = 0.18;
              q.face = target.x < q.x ? -1 : 1;
              // 敵将狙い：大将への攻撃アップ。連続攻撃：一定確率でもう1回
              const hitDmg = st.atk * (target.kind === "boss" ? 1 + skillSum(s, "vsBoss") : 1);
              target.hp -= hitDmg;
              if (skillSum(s, "combo") && Math.random() < skillSum(s, "combo")) {
                target.hp -= hitDmg;
                burst(target.x + 6, target.y - 6, "#ffe3a0", "slash");
              }
              target.hit = 0.18;
              target.lastHitBy = s.id; // 撃破した兵士の記録用（塔の攻撃で上書きされる）
              gainXp(s, SQUAD_RULES.xpPerHit);
              if (SOLDIER_TYPES[q.type].block) burst(target.x, target.y, "#fff1c4", "slash");
              else {
                const musket = SOLDIER_TYPES[q.type].shot === "musket";
                // 鉄砲兵：銃口の閃光と小さな煙（塔の鉄砲と同じ演出）
                if (musket) burst(q.x + q.face * 16, q.y - 22, "#ffe6a0", "gunsmoke");
                if (shots.length >= 160) shots.shift();
                shots.push({
                  x: q.x + (musket ? q.face * 16 : 0),
                  y: q.y - 22,
                  tx: target.x,
                  ty: target.y,
                  type: musket ? "magic" : "arrow",
                  age: 0,
                  duration: musket ? 0.12 : 0.22,
                  col: "#a56b35",
                });
              }
            }
          }
          // 敵の攻撃：足止めしている部隊 → 届く範囲の部隊 → 届く範囲の塔（道の上から。道を外れて塔へは向かわない）
          for (const e of enemies) {
            if (e.gone || e.hp <= 0) continue;
            const a = ENEMY_VS_UNIT[e.kind] || ENEMY_VS_UNIT.goblin;
            e.unitCd = (e.unitCd || 0) - dt;
            if (e.unitCd > 0) continue;
            const reach = a.ranged || SQUAD_RULES.enemyReach;
            let target = e.blockedBy && squads.includes(e.blockedBy) ? e.blockedBy : null,
              tower = null;
            if (!target) {
              let best = reach;
              for (const q of fieldSquads()) {
                const dd = dist(q, e);
                if (dd <= best && members(q).length) {
                  best = dd;
                  target = q;
                }
              }
            }
            if (!target && a.tower) {
              let best = a.tower.reach;
              for (const t of towers) {
                if (t.destroyed) continue;
                const dd = dist(t, e);
                if (dd <= best) {
                  best = dd;
                  tower = t;
                }
              }
            }
            if (!target && !tower) {
              e.unitCd = 0;
              continue;
            }
            e.unitCd += a.rate;
            e.atkAnim = 0.35;
            const tx = target ? target.x : tower.x;
            e.face = tx < e.x ? -1 : 1;
            if (a.ranged) {
              const ty = target ? target.y - 16 : tower.y - 40;
              if (shots.length >= 160) shots.shift();
              shots.push({
                x: e.x,
                y: e.y - 14,
                tx,
                ty,
                type: "arrow",
                age: 0,
                duration: 0.3,
                col: "#a56b35",
              });
            }
            const scale = 1 + (wave - 1) * TOWER_HP.waveScale;
            if (target) damageSquad(target, a.damage * (1 + (wave - 1) * 0.05), !!a.ranged);
            else {
              damageTower(tower, a.tower.damage * scale);
              // 大将は塔の前で立ち止まって攻撃する（1回の進軍で最長 siegeMax 秒。永久には止まらない）
              if (a.tower.siege && !tower.destroyed && !e.siegeDone) e.siege = tower;
            }
          }
        }
        // 衛生兵の回復：範囲内の部隊で、HPの割合が最も低い味方1人（自分は除く。戦死者・離脱者は対象外）
        function healTick(s, q) {
          const st = soldierStats(s);
          let best = null,
            ratio = 1;
          for (const o of fieldSquads()) {
            if (dist(o, q) > st.range) continue;
            members(o).forEach((m, i) => {
              if (m === s) return;
              const r = m.hp / soldierStats(m).maxHp;
              if (r < ratio) {
                ratio = r;
                best = { m, o, i };
              }
            });
          }
          if (!best) {
            s.cd = 0; // 回復する相手がいなければ待機（けが人が出たらすぐ回復）
            return;
          }
          s.cd += st.rate;
          s.atk = 0.18;
          const max = soldierStats(best.m).maxHp,
            amount = Math.min(st.heal, max - best.m.hp);
          best.m.hp += amount; // 最大HPを超えない
          s.heals = (s.heals || 0) + 1;
          gainXp(s, SQUAD_RULES.xpPerHeal);
          const off = formationOffset(best.o, best.i);
          if (effects.length >= 80) effects.shift();
          effects.push({
            x: best.o.x + off[0],
            y: best.o.y + off[1] - 18,
            kind: "heal",
            color: "#7be08a",
            age: 0,
            duration: 0.8,
          });
        }
        function creditKill(e) {
          const s = e.lastHitBy ? soldierById(e.lastHitBy) : null;
          if (!s || !s.alive) return;
          s.kills++;
          gainXp(s, SQUAD_RULES.xpPerKill + Math.round(e.reward / 2));
        }
        function squadsWaveStart() {
          for (const q of squads) joinWave(q);
        }
        // ウェーブ終了：生存者だけが成長する。戦死者は復活しない。HPは一部だけ回復
        // 生存ボーナスはウェーブごとに1回だけ（xpClaim で二重取得を防ぐ）。終了後に兵士を保存する
        function squadsWaveEnd() {
          const claim = runId + ":" + wave;
          for (const s of soldiers) {
            if (!s.alive) continue;
            if (s.inWave && s.xpClaim !== claim) {
              s.xpClaim = claim;
              const before = rankTitle(s);
              s.wavesSurvived++;
              gainXp(s, SQUAD_RULES.xpPerWave, true);
              const after = rankTitle(s);
              if (after !== before) logHistory(s, "称号「" + after.name + "」を得た");
            }
            s.inWave = false;
            s.waveXp = 0;
            s.out = false; // 生存本能で離脱した兵士は次の戦闘から復帰
            s.instinctTried = false;
            s.unyieldUsed = false;
            const max = soldierStats(s).maxHp;
            s.hp = Math.min(max, s.hp + max * SQUAD_RULES.waveEndHeal);
          }
          for (const q of squads) {
            q.locked = false;
            if (q.state === "retreating") {
              q.state = "reserve";
              q.retreatLeft = 0;
            }
          }
          saveRoster();
        }

        // ===== 兵士部隊：再編成（ウェーブ間のみ） =====
        function transferSoldier(soldierId, target) {
          if (playing) return "ウェーブ中は編成できません。";
          const s = soldierById(soldierId);
          if (!s || !s.alive) return "戦死した兵士は編成できません。";
          const from = squadById(s.squadId);
          let to = target === "new" ? null : squadById(target);
          if (target !== "new") {
            if (!to) return "編入先の部隊が見つかりません。";
            if (to === from) return null;
            if (to.type !== s.type) return "同じ兵種の部隊にだけ編入できます。";
            if (roster(to).length >= SQUAD_RULES.squadSize) return squadName(to) + " は満員です。";
          } else if (squads.length >= SQUAD_RULES.maxSquads) return "これ以上部隊を作れません。";
          if (!to) to = newSquad(s.type);
          s.squadId = to.id;
          logHistory(s, squadName(to) + " に編入");
          if (from && !roster(from).length) {
            releaseBlocks(from);
            releaseHeroFromSquad(from);
            squads = squads.filter((q) => q !== from);
            if (selectedSquad === from) selectedSquad = null;
          }
          return null;
        }
        function recruitInto(q) {
          if (playing) return "ウェーブ中は補充できません。";
          if (!q || !squads.includes(q)) return "部隊が見つかりません。";
          const c = SOLDIER_TYPES[q.type];
          if (roster(q).length >= SQUAD_RULES.squadSize) return squadName(q) + " は満員です。";
          if (gold < c.cost) return "資金が足りません（" + c.name + " " + c.cost + "G）。";
          gold -= c.cost;
          newSoldier(q.type, q.id);
          return null;
        }
        // 治療：ウェーブの合間にゴールドで部隊の生存兵を全回復する（戦死者は対象外＝復活しない）
        const healCost = (q) =>
          Math.ceil(
            roster(q).reduce(
              (n, s) =>
                n +
                SOLDIER_TYPES[s.type].cost *
                  SQUAD_RULES.healRate *
                  Math.max(0, 1 - s.hp / soldierStats(s).maxHp),
              0,
            ),
          );
        function healSquad(q) {
          if (playing) return "ウェーブ中は治療できません。";
          if (!q || !squads.includes(q)) return "部隊が見つかりません。";
          const c = healCost(q);
          if (!c) return squadName(q) + " は全員元気です。";
          if (gold < c) return "資金が足りません（治療 " + c + "G）。";
          gold -= c;
          for (const s of roster(q)) s.hp = soldierStats(s).maxHp;
          return null;
        }
        // ===== 兵士の保存（個別の成長・名前・英霊名鑑） =====
        // 兵士はゲームをまたいで残る。保存するのは「ウェーブをクリアした時点の生存兵」と英霊名鑑。
        //   戦死はその場で保存データから外す（再読み込みしても復活しない）。
        //   戦闘中に得た経験値は、そのウェーブをクリアしたときに保存される（負け・やり直しでは残らない）。
        const SOLDIER_SAVE_KEY = "worldDefense.soldiers.v1";
        const SAVED_FIELDS = [
          "id",
          "type",
          "squadId",
          "level",
          "xp",
          "skills",
          "name",
          "battles",
          "kills",
          "wavesSurvived",
          "lastSurvivor",
          "history",
          "heals",
        ];
        let runId = Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
        const intIn = (v, lo, hi, d) => (Number.isFinite(v) ? Math.max(lo, Math.min(hi, Math.floor(v))) : d);
        function cleanSkills(list, type) {
          if (!Array.isArray(list)) return [];
          const out = [];
          for (const id of list)
            if (SOLDIER_SKILLS[id] && SOLDIER_SKILLS[id].types.includes(type) && !out.includes(id))
              out.push(id);
          return out.slice(0, SQUAD_RULES.maxSkills);
        }
        function cleanFallen(f) {
          if (!f || typeof f !== "object" || !SOLDIER_TYPES[f.type]) return null;
          const name = cleanName(f.name);
          if (!name) return null;
          return {
            id: intIn(f.id, 0, 1e9, 0),
            name,
            type: f.type,
            level: intIn(f.level, 1, SQUAD_RULES.maxLevel, 1),
            skills: cleanSkills(f.skills, f.type),
            battles: intIn(f.battles, 0, 1e6, 0),
            kills: intIn(f.kills, 0, 1e6, 0),

            ctx.lineWidth = 4 * (1 - p);
            ctx.beginPath();
            ctx.ellipse(e.x, e.y, 65 * p, 30 * p, 0, 0, 7);
            ctx.stroke();
          } else if (e.kind === "ice") {
            // 水しぶき：足元に広がる波紋
            ctx.strokeStyle = "#a9e2ffcc";
            ctx.lineWidth = 2.5 * (1 - p) + 0.5;
            ctx.beginPath();
            ctx.ellipse(e.x, e.y + 10, 8 + 30 * p, 3 + 10 * p, 0, 0, 7);
            ctx.stroke();
          } else if (e.kind === "magic") {
            // 着弾：土ぼこり
            ellipse(e.x, e.y + 6, 6 + 10 * p, 4 + 6 * p, "#b9a27a88");
          } else if (e.kind === "fire") {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(e.x, e.y, 6 + 28 * p, 0, 7);
            ctx.stroke();
          }
          for (let i = 0; i < n; i++) {
            const a = i * 2.399,
              r = 8 + 35 * p,
              px = e.x + Math.cos(a) * r,
              py = e.y + Math.sin(a) * r - (e.kind === "death" ? p * 15 : 0);
            if (e.kind === "ice") {
              // 水しぶき：上に跳ねて落ちるしずく
              const up = Math.sin(p * Math.PI) * 18;
              ellipse(e.x + Math.cos(a) * 18 * p, e.y - up + Math.sin(a) * 6, 2.2, 3, color);
            } else if (e.kind === "magic") {
              ellipse(px * 0.4 + e.x * 0.6, py * 0.4 + e.y * 0.6, 1.5, 1.5, color);
            } else ellipse(px, py, Math.max(1, (1 - p) * 4), Math.max(1, (1 - p) * 4), color);
          }
          ctx.restore();

          if (!scenery) {

          ctx.clearRect(0, 0, W, H);

          noDeployZones();

            ...fieldSquads().map((q) => ({ y: q.y + UNIT_FOOT, draw: () => drawSquad(q) })),
            ...unitGhosts.map((g) => ({ y: g.y + UNIT_FOOT, draw: () => drawUnitGhost(g) })),
            ...towers.map((t) => ({
              y: t.y,
              draw: () => {
                tower(t);
                if (t.destroyed) return;
                towerDetails(t);
                heroOverlay(t);
                towerHpBar(t);
                if (t.recoil > 0 && t.type !== "magic") {
                  const a = t.aim || 0;
                  bloom(t.x + Math.cos(a) * 23, t.y - 42 + Math.sin(a) * 23, 16, "#ffecab99");
                }
              },
            })),
            ...enemies.map((e) => ({
              y: e.y,
              draw: () => {
                ctx.save();
                if (!drawEnemySprite(e)) {
                  ctx.translate(0, reduced ? 0 : Math.sin(e.d * 0.17) * 2);
                  soldierFallback(e);
                }
                if (e.hit > 0) {
                  ctx.globalAlpha = e.hit * 3;
                  ellipse(e.x, e.y, e.r + 3, e.r + 3, "#fff6d6");
                  ctx.globalAlpha = 1;
                }
                if (e.slow > 0) {
                  // 水攻めで足を取られている：足元のぬかるみと水たまり、はねる泥
                  ellipse(e.x, e.y + e.r + 2, e.r + 10, 6, "#6b4f33aa");
                  ellipse(e.x - 2, e.y + e.r + 1, e.r + 5, 3.5, "#5fa9d6aa");
                  ctx.strokeStyle = "#cfeeffaa";
                  ctx.lineWidth = 1.5;
                  ctx.beginPath();
                  const rip = reduced ? 0.5 : (visualTime * 1.5) % 1;
                  ctx.ellipse(
                    e.x,
                    e.y + e.r + 2,
                    (e.r + 4) * (0.6 + rip * 0.6),
                    3 * (0.6 + rip * 0.6),
                    0,
                    0,
                    7,
                  );
                  ctx.stroke();
                  for (let i = 0; i < 2; i++)
                    ellipse(
                      e.x + (i ? 9 : -9),
                      e.y + e.r - 3 - (reduced ? 0 : Math.abs(Math.sin(visualTime * 6 + i)) * 4),
                      2,
                      2,
                      "#7a5a3acc",
                    );
                }
                ctx.restore();
              },
            })),
          ];
          actors.sort((a, b) => a.y - b.y);
          for (const a of actors) a.draw();
          for (const s of shots) projectile(s);
          for (const e of effects) effect(e);
          drawCutin();

            siegeFilter = d.filter;
            changed = false;
          } else if (d.add) err = siegeAdd(i, +d.add, false);
          else if (d.move) err = siegeAdd(i, +d.move, true);
          else if (d.remove) err = siegeRemove(i, +d.remove);
          else if (d.heroPick !== undefined) {
            siegeHeroPick = true;
            changed = false;
          } else if (d.heroCancel !== undefined) {
            siegeHeroPick = false;
            changed = false;
          } else if (d.heroOff !== undefined) err = siegeSetHero(i, null);
          else if (d.hero || d.heroMove) {
            err = siegeSetHero(i, d.hero || d.heroMove, !!d.heroMove);
            if (!err) siegeHeroPick = false;
          } else changed = false;
          if (err) siegeNote = "⚠ " + err;
          else if (changed)
            siegeNote = siegeSaveOk
              ? "✓ " + SIEGE_RULES.names[i] + " の編成を保存しました"
              : "⚠ 保存できませんでした（この端末では保存が使えません）";
          else siegeNote = "";
          renderSiege();
        });
        // ===== 塔パネル・武将配属画面 =====
        const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1);
        const esc = (s) =>
          String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        function avatarHtml(id, big) {
          const c = WARLORDS[id],
            src = heroImageSrc(id, big ? "portrait" : "icon", big ? "icon" : "portrait");
          return src
            ? '<span class="avatar' +
                (big ? " big" : "") +
                '" style="background-image:url(' +
                src +
                ')"></span>'
            : '<span class="avatar' +
                (big ? " big" : "") +
                '" style="background:' +
                c.color +
                '">' +
                c.short +
                "</span>";
        }
        function setHtml(el, html) {
          if (el.dataset.html !== html) {
            el.innerHTML = html;
            el.dataset.html = html;
          }
        }
        function renderTowerPanel() {
          const t = selectedTower,
            panel = $("towerPanel");
          if (!t || !towers.includes(t)) {
            panel.hidden = true;
            return;
          }
          panel.hidden = false;
          const p = types[t.type],
            st = towerStats(t),
            h = heroOn(t);
          $("tpTitle").textContent = towerLabel(t) + (t.destroyed ? "（破壊）" : "");
          const base = p.damage * (1 + 0.55 * (t.level - 1));
          const mark = (v, b) => (Math.abs(v - b) > 0.01 ? ' class="buff"' : "");
          const thp = towerHp(t),
            tmax = towerMaxHp(t);
          setHtml(
            $("tpStats"),
            '<span>耐久 <b class="' +
              (thp < tmax * 0.35 ? "low" : "") +
              '">' +
              Math.ceil(thp) +
              "/" +
              tmax +
              "</b></span>" +
              "<span>攻撃 <b" +
              mark(st.damage, base) +
              ">" +
              Math.round(st.damage) +
              "</b></span>" +
              "<span>射程 <b" +
              mark(st.range, p.range) +
              ">" +
              Math.round(st.range) +
              "</b></span>" +
              "<span>間隔 <b" +
              mark(st.rate, p.rate) +
              ">" +
              fmt(st.rate) +
              "秒</b></span>" +
              (t.type === "cannon"
                ? "<span>爆発 <b" +
                  mark(st.splash, CANNON_SPLASH) +
                  ">" +
                  Math.round(st.splash) +
                  "</b></span>"
                : "") +
              (st.aura > 0 ? '<span class="buff">武将の支援 +' + Math.round(st.aura * 100) + "%</span>" : ""),
          );
          setHtml(
            $("tpHero"),
            h
              ? avatarHtml(h.id) +
                  "<p>" +
                  rarityTag(h.id) +
                  " <b>" +
                  WARLORDS[h.id].name +
                  "</b>" +
                  starText(h.id) +
                  " 配属中<br><small>" +
                  WARLORDS[h.id].passiveText +
                  "</small></p>"
              : "<p><small>武将なし（「武将配属」から配属できます）</small></p>",
          );
          const maxed = t.level >= 5;
          $("upgrade").textContent = maxed ? "⬆ 最大Lv" : "⬆ 強化 " + upgradePrice(t) + "G";
          if (t.destroyed) {
            $("upgrade").disabled = $("sell").disabled = $("assign").disabled = true;
          } else $("assign").disabled = false;
          const rc = repairCost(t),
            rb = $("repair");
          rb.hidden = t.destroyed || thp >= tmax;
          rb.disabled = playing || gold < rc;
          rb.textContent = playing ? "🔨 修理（ウェーブの合間に）" : "🔨 修理 " + rc + "G（耐久を全回復）";
          $("sell").textContent = "🪙 売却 " + Math.floor(t.spent * 0.7) + "G";
          $("assign").textContent = h ? "👤 武将変更" : "👤 武将配属";
          renderSkillButton($("skill"), $("skillLabel"), $("skillBar"), h);
        }
        // 必殺技ボタン（塔パネル・部隊パネル共通）
        function renderSkillButton(btn, labelEl, barEl, h) {
          btn.hidden = !h;
          if (!h) return;
          const s = WARLORDS[h.id].skill;
          let label, ratio, state;
          if (h.active > 0) {
            label = "✨ " + s.name + " 発動中 残り" + fmt(h.active) + "秒";
            ratio = h.active / s.duration;
            state = "running";
          } else if (h.cd > 0) {
            label =
              "⌛ " +
              s.name +
              " 再使用まで" +
              Math.ceil(h.cd) +
              "秒" +
              (playing && !paused ? "" : "（戦闘中に進行）");
            ratio = 1 - h.cd / s.cooldown;
            state = "";
          } else {
            label =
              "⚡ 必殺技「" +
              s.name +
              "」" +
              (!heroPos(h)
                ? "（部隊が道にいるときに使用可）"
                : playing && !over
                  ? paused
                    ? "（停止中）"
                    : ""
                  : "（ウェーブ中に使用可）");
            ratio = 1;
            state = canUseSkill(h) ? "ready" : "";
          }
          labelEl.textContent = label;
          barEl.style.width = Math.round(ratio * 100) + "%";
          btn.className = "skill " + state;
          btn.disabled = !canUseSkill(h);
          btn.setAttribute("aria-label", label + "。" + WARLORDS[h.id].skillText);
        }
        const rarityTag = (id) =>
          '<span class="rarity" style="background:' +
          RARITY[WARLORDS[id].rarity].color +
          ";color:" +
          RARITY[WARLORDS[id].rarity].text +
          '">' +
          WARLORDS[id].rarity +
          "</span>";
        const starText = (id) => "★".repeat(stars(id));
        function useSkillFrom(h) {
          if (!h) return;
          if (!canUseSkill(h)) {
            msg(playing ? "必殺技はまだ使えません。" : "必殺技はウェーブ中に使えます。");
            return;
          }
          useSkill(h);
          updateUI();
        }

        // ===== 武将一覧・配属画面（配属先は塔または部隊） =====
        let sheetTarget = null;
        const targetValid = (t) => t && (towers.includes(t) || squads.includes(t));
        const targetLabel = (t) => (towers.includes(t) ? towerLabel(t) : squadName(t));
        function renderSheet() {
          const t = targetValid(sheetTarget) ? sheetTarget : null,
            isTower = t && towers.includes(t),
            word = isTower ? "この塔" : "この部隊";
          $("sheetTitle").textContent = t ? "武将配属：" + targetLabel(t) : "武将一覧";
          const ids = ownedIds();
          $("sheetHint").textContent = !ids.length
            ? "まだ武将がいません。ガチャ券で武将ガチャを引いてください。"
            : t
              ? "配属する武将を選んでください。1か所に1人、同じ武将は1か所だけです。"
              : "所持 " +
                ids.length +
                "/" +
                Object.keys(WARLORDS).length +
                " 人。配属は塔または部隊のパネルから。";
          if (heroSave.lastHero) ids.sort((a, b) => (b === heroSave.lastHero) - (a === heroSave.lastHero));
          let html = ids
            .map((id) => {
              const h = heroState[id],
                c = WARLORDS[id],
                here = h.tower === t || h.squad === t;
              const inj = injuryOf(id);
              const where = inj
                ? '<span class="injured">🩹 負傷中：あと' +
                  inj.left +
                  "ウェーブで復帰（配属できません）</span>"
                : h.tower || h.squad
                  ? "配属先：" + esc(postLabel(h))
                  : "未配属";
              const timer =
                h.active > 0
                  ? "（必殺技 発動中）"
                  : h.cd > 0
                    ? "（必殺技 再使用まで" + Math.ceil(h.cd) + "秒）"
                    : "";
              let actions = "";
              if (t && here) actions += "<button disabled>" + word + "に配属中</button>";
              else if (t && inj) actions += "<button disabled>負傷中</button>";
              else if (t)
                actions +=
                  '<button data-assign="' +
                  id +
                  '">' +
                  (h.tower || h.squad ? word + "へ移動" : word + "に配属") +
                  "</button>";
              if (h.tower || h.squad) actions += '<button data-unassign="' + id + '">解除</button>';
              return (
                '<div class="hero-card">' +
                avatarHtml(id, true) +
                "<div><h3>" +
                rarityTag(id) +
                " " +
                c.name +
                ' <span class="stars">' +
                starText(id) +
                "</span></h3><p>常時：" +
                c.passiveText +
                "</p><p>必殺技「" +
                c.skill.name +
                "」：" +
                c.skillText +
                "（再使用 " +
                c.skill.cooldown +
                "秒）</p>" +
                '<p class="where">' +
                where +
                timer +
                "</p>" +
                '<div class="card-actions">' +
                actions +
                "</div></div></div>"
              );
            })
            .join("");
          if (!ids.length)
            html = '<div class="card-actions"><button data-open-gacha>🎴 武将ガチャへ</button></div>';
          $("heroList").innerHTML = html;
        }
        function openSheet(target) {
          closeGacha();
          sheetTarget = target;
          renderSheet();
          $("heroSheet").hidden = false;
          $("sheetClose").focus();
        }
        function closeSheet() {
          sheetTarget = null;
          $("heroSheet").hidden = true;
        }
        $("heroList").addEventListener("click", (ev) => {
          const b = ev.target.closest("button");
          if (!b) return;
          if (b.dataset.openGacha !== undefined) return openGacha();
          if (b.dataset.assign && targetValid(sheetTarget)) {
            assignHero(b.dataset.assign, sheetTarget);
            closeSheet();
          } else if (b.dataset.unassign) {
            unassignHero(b.dataset.unassign);
            renderSheet();
          }
          updateUI();
        });
        $("heroSheet").addEventListener("click", (ev) => {
          if (ev.target === $("heroSheet")) closeSheet();
        });
        $("sheetClose").onclick = closeSheet;
        $("assign").onclick = () => selectedTower && openSheet(selectedTower);
        $("sqHero").onclick = () => selectedSquad && openSheet(selectedSquad);
        $("roster").onclick = () => openSheet(null);
        $("tpClose").onclick = () => {
          selectedTower = null;
          updateUI();
        };
        $("skill").onclick = () => useSkillFrom(selectedTower && heroOn(selectedTower));
        $("sqSkill").onclick = () => useSkillFrom(selectedSquad && heroOnSquad(selectedSquad));

        // ===== 武将ガチャ画面 =====
        let lastPull = null;
        function renderGacha() {
          $("gachaTickets").textContent = "ガチャ券 " + heroSave.tickets + " 枚";
          $("gachaRates").textContent =
            "排出率：" +
            Object.entries(GACHA.rates)
              .map(([k, v]) => k + " " + Math.round(v * 1000) / 10 + "%")
              .join("・") +
            "。券はウェーブクリア（" +
            GACHA.ticketWaveInterval +
            "ウェーブごと）とボス撃破で手に入ります。";
          $("gachaPull").disabled = heroSave.tickets < 1;
          let html = "";
          if (lastPull) {
            const c = WARLORDS[lastPull.id];
            html +=
              '<div class="pull-result" style="border-color:' +
              RARITY[c.rarity].color +
              '">' +
              avatarHtml(lastPull.id, true) +
              "<div><h3>" +
              rarityTag(lastPull.id) +
              " " +
              c.name +
              ' <span class="stars">' +
              (lastPull.isNew ? "NEW!" : "★" + lastPull.stars) +
              "</span></h3><p>常時：" +
              c.passiveText +
              "</p><p>必殺技「" +
              c.skill.name +
              "」：" +
              c.skillText +
              "</p>" +
              (lastPull.saved
                ? ""
                : '<p class="warn">この環境では保存できませんでした（再読み込みで失われます）</p>') +
              "</div></div>";
          }
          // 誰が出るかは見せない（人数と所持数だけ）。引いた履歴は保存データにだけ残す
          html +=
            '<p class="muted">登場する武将は全' +
            Object.keys(WARLORDS).length +
            "人（所持 " +
            ownedIds().length +
            "人）</p>";
          $("gachaResult").innerHTML = html;
        }
        function openGacha() {
          closeSheet();
          lastPull = null;
          renderGacha();
          $("gachaSheet").hidden = false;
          $("gachaClose").focus();
        }
        function closeGacha() {
          $("gachaSheet").hidden = true;
        }
        $("gacha").onclick = openGacha;
        $("gachaClose").onclick = closeGacha;
        $("gachaSheet").addEventListener("click", (ev) => {
          if (ev.target === $("gachaSheet")) closeGacha();
        });
        $("gachaPull").onclick = () => {
          const r = pullGacha();
          if (r.error) msg(r.error);
          else {
            lastPull = r;
            msg(
              "武将ガチャ：" +
                WARLORDS[r.id].rarity +
                " " +
                WARLORDS[r.id].name +
                (r.isNew ? " を獲得！" : "（★" + r.stars + "）"),
            );
          }
          renderGacha();
          updateUI();
        };
        document.addEventListener("keydown", (ev) => {
          if (ev.key === "Escape" && !$("heroSheet").hidden) closeSheet();
          if (ev.key === "Escape" && !$("squadSheet").hidden) closeSquadSheet();
          if (ev.key === "Escape" && !$("gachaSheet").hidden) closeGacha();
        });
        document.addEventListener("visibilitychange", () => {
          last = 0;
        });
        function frame(now) {
          const dt = last ? (now - last) / 1000 : 0;
          last = now;
          tick(dt);
          animateVisuals(dt);
          draw();
          requestAnimationFrame(frame);
        }
        // 動作確認用（URLに ?debug を付けたときだけ公開。通常プレイには影響しない）
        if (/[?&]debug\b/.test(location.search)) {
          window.WD_DEBUG = {
            state: () => ({
              gold,
              hp,
              wave,
              playing,
              paused,
              over,
              speed,
              towers,
              enemies,
              heroState,
              selectedTower,
              squads,
              soldiers,
              selectedSquad,
              selectedSoldierId,
              selectedUnitType,
              placeSquadId,
            }),
            squadApi: {
              members,
              soldierStats,
              rankTitle,
              titleText,
              transferSoldier,
              recruitInto,
              deployReserve,
              orderRetreat,
              hireSquad,
              blockCount,
              gainXp,
              roster,
              nameSoldier,
              healSquad,
              healCost,
              siege: () => siegeUnits,
              siegeAdd,
              siegeRemove,
              siegeSetHero,
              siegeSummary,
              siegeEligible,
              refreshSiege,
              SIEGE_RULES,
              learnSkill,
              damageSquad,
              withdrawSoldier,
              squadsWaveEnd,
              saveRoster,
              restoreRoster,
              soldierSave: () => soldierSave,
              setSkillRng: (f) => (skillRng = f || Math.random),
              SOLDIER_SKILLS,
              RANKS,
            },
            projectToRoad,
            // 演出の種類（テスト用）
            fx: () => ({ effects: effects.map((e) => e.kind), shots: shots.map((x) => x.type) }),
            // 指定した敵を追加（テスト用）。d は道に沿った距離
            addEnemy: (o) => {
              const e = Object.assign(
                {
                  path: upper,
                  d: 0,
                  kind: "goblin",
                  hp: 50,
                  max: 50,
                  speed: 60,
                  reward: 10,
                  color: "#b65e3e",
                  r: 12,
                  slow: 0,
                },
                o,
              );
              if (o.path === "lower") e.path = lower;
              if (o.path === "upper" || !o.path) e.path = upper;
              e.max = Math.max(e.max, e.hp);
              Object.assign(e, pathAt(e.path, e.d));
              enemies.push(e);
              return e;
            },
            stopSpawning: () => {
              spawned = spawnTotal;
            },
            unitConfig: { SOLDIER_TYPES, SQUAD_RULES, TITLES, ENEMY_VS_UNIT, UNIT_FRAMES },
            towerApi: { towerHp, towerMaxHp, damageTower, repairCost, TOWER_HP },
            towerStats,
            setGold: (g) => {
              gold = g;
              updateUI();
            },
            // sec 秒ぶんを h 秒刻みで進める（フレームレートの違いの確認用）
            step: (sec, h = 0.05) => {
              for (let i = 0; i < Math.round(sec / h); i++) {
                tick(h);
                animateVisuals(h);
              }
            },
            config: { WARLORDS, HERO_RULES, GACHA },
            heroApi: {
              save: () => heroSave,
              heroState: () => heroState,
              pullGacha,
              rollWarlord,
              grantTickets,
              assignHero,
              unassignHero,
              heroOn,
              heroOnSquad,
              useSkill,
              canUseSkill,
              squadHeroMods,
              injureHero,
              healInjuries,
              injuryOf,
            },
          };
        }
        updateUI();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
