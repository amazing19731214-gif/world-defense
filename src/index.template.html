<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>WORLD DEFENSE</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #12251f;
        color: #f8edcc;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        max-width: 960px;
        margin: auto;
        padding: 12px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: clamp(21px, 5vw, 32px);
        margin: 8px 0;
      }
      button {
        border: 2px solid #b99c60;
        background: #254338;
        color: #fff0c9;
        border-radius: 12px;
        padding: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      button.active {
        background: #9b682b;
      }
      button:disabled {
        opacity: 0.4;
      }
      .stats,
      .tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .stats span {
        padding: 8px;
        background: #244034;
        border: 1px solid #b99c60;
        border-radius: 10px;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 10;
        border: 5px solid #9e8551;
        border-radius: 15px;
        touch-action: manipulation;
        background: #81a85c;
      }
      .tools button {
        flex: 1;
        min-width: 75px;
      }
      #msg {
        min-height: 48px;
        line-height: 1.5;
      }
      small {
        color: #d5c6a4;
      }
      body {
        background: radial-gradient(ellipse at top, #285c59, #102e36);
        color: #fff1d0;
      }
      .wrap {
        max-width: 1080px;
        padding: 16px;
      }
      header {
        border-bottom: 1px solid #b8d6b533;
        padding-bottom: 10px;
      }
      h1 {
        letter-spacing: 0.08em;
        text-shadow: 0 3px 0 #102f37;
      }
      .stats span {
        background: #153e44;
        border-color: #719b8f;
        box-shadow: inset 0 1px #ffffff18;
      }
      canvas {
        border-color: #e1bc77;
        box-shadow: 0 14px 36px #051f3766;
        margin: 16px 0;
      }
      button {
        background: linear-gradient(#3b6664, #21494e);
        border-color: #91ac92;
        min-height: 46px;
        box-shadow: 0 3px 0 #102f37;
        touch-action: manipulation;
      }
      button.active {
        background: linear-gradient(#e4b861, #ab7736);
        border-color: #ffe5a6;
        color: #233b3a;
      }
      button:focus-visible {
        outline: 3px solid #ffe7a0;
        outline-offset: 3px;
      }
      #msg {
        background: #143c45;
        border-left: 3px solid #dfbb75;
        padding: 12px;
        border-radius: 4px;
      }
      small {
        color: #b9d4c6;
      }
      @media (max-width: 600px) {
        .wrap {
          padding: 8px;
        }
        .tools {
          gap: 6px;
        }
        .tools button {
          font-size: 12px;
          padding: 9px 5px;
        }
        .unit-tools button {
          font-size: 14px;
        }
        canvas {
          border-width: 3px;
          margin: 10px 0;
        }
        .stats span {
          font-size: 12px;
          padding: 6px;
        }
        h1 {
          font-size: 21px;
        }
      }
      /* ---- 塔パネル・武将配属 ---- */
      [hidden] {
        display: none !important;
      }
      .panel {
        background: #143c45;
        border: 1px solid #719b8f;
        border-radius: 12px;
        padding: 10px 12px;
        margin: -6px 0 10px;
        font-size: 15px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .panel-head strong {
        font-size: 16px;
      }
      .icon-btn {
        font-size: 16px;
        min-width: 46px;
        padding: 6px 10px;
      }
      .tp-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin: 6px 0;
        color: #d8eadf;
      }
      .tp-stats b {
        color: #ffe3a0;
      }
      .buff {
        color: #9df0b0;
      }
      .tp-hero {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 8px;
        min-height: 40px;
      }
      .tp-hero p {
        margin: 0;
        line-height: 1.4;
      }
      .panel small,
      .sheet small {
        font-size: 14px;
      }
      .panel-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .panel-actions button,
      .skill {
        font-size: 15px;
        padding: 8px 6px;
      }
      .skill {
        width: 100%;
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: stretch;
      }
      .panel,
      .panel *,
      .sheet,
      .sheet * {
        -webkit-tap-highlight-color: transparent;
      }
      .skill:disabled {
        opacity: 0.8;
      }
      .skill.running:disabled {
        opacity: 1;
      }
      .skill.ready {
        background: linear-gradient(#e4b861, #ab7736);
        border-color: #ffe5a6;
        color: #233b3a;
      }
      .skill.running {
        border-color: #9df0b0;
      }
      .bar {
        display: block;
        height: 8px;
        border-radius: 4px;
        background: #0b262c;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #ffd77d;
      }
      .skill.running .bar i {
        background: #9df0b0;
      }
      .avatar {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #ffe0a0;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 19px;
        color: #fff;
        text-shadow: 0 1px 2px #0008;
        background-size: cover;
        background-position: center;
      }
      .avatar.big {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }
      .unit-tools {
        align-items: center;
      }
      .unit-tools .row-label {
        flex: none;
        font-size: 14px;
        padding: 0 4px;
        color: #d8eadf;
      }
      .unit-tools button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 14px;
      }
      .unit-tools button img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        transform: scaleX(-1);
      }
      .panel-actions.two {
        grid-template-columns: repeat(2, 1fr);
      }
      .members {
        display: flex;
        gap: 6px;
        margin: 6px 0;
      }
      .chip {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
      }
      .chip.sel {
        border-color: #ffe5a6;
        background: linear-gradient(#5d7c62, #2d5452);
      }
      .chip .bar {
        width: 100%;
        height: 6px;
      }
      .soldier-info {
        line-height: 1.45;
        margin: 4px 0 8px;
      }
      .soldier-info .title {
        color: #ffe3a0;
      }
      .squad-card {
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
      }
      .squad-card h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .soldier-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        line-height: 1.35;
      }
      .soldier-row button,
      .squad-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
      }
      .muted {
        color: #b9d4c6;
      }
      .hp-line {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
      }
      .hp-line .bar {
        flex: 1;
        height: 12px;
      }
      .bar.hp i {
        background: #ef6a58;
      }
      .retreat {
        width: 100%;
        font-size: 15px;
      }
      .sheet-back {
        position: fixed;
        inset: 0;
        background: #0610147a;
        z-index: 10;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: min(560px, 100%);
        max-height: 72vh;
        overflow-y: auto;
        background: #12343c;
        border: 1px solid #e1bc77;
        border-bottom: 0;
        border-radius: 16px 16px 0 0;
        padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
        font-size: 15px;
      }
      .hero-card {
        display: flex;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
      }
      .hero-card h3 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .hero-card p {
        margin: 2px 0;
        line-height: 1.45;
      }
      .hero-card .where {
        color: #ffe3a0;
      }
      .hero-card .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .hero-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>⚔️ WORLD DEFENSE</h1>
        <div class="stats">
          <span id="hp">❤️ 20</span><span id="gold">🪙 500G</span><span id="wave">WAVE 0/20</span>
        </div>
      </header>
      <canvas id="game" width="960" height="600" aria-label="ゲームマップ"></canvas>
      <section id="towerPanel" class="panel" hidden aria-label="選択中の塔">
        <div class="panel-head">
          <strong id="tpTitle"></strong
          ><button id="tpClose" class="icon-btn" aria-label="塔の選択を解除">✕</button>
        </div>
        <div id="tpStats" class="tp-stats"></div>
        <div id="tpHero" class="tp-hero"></div>
        <div class="panel-actions">
          <button id="upgrade">⬆ 強化</button><button id="sell">🪙 売却</button
          ><button id="assign">👤 武将配属</button>
        </div>
        <button id="skill" class="skill" hidden>
          <span id="skillLabel"></span><span class="bar"><i id="skillBar"></i></span>
        </button>
      </section>
      <div class="tools">
        <button data-t="arrow">🏹 弓 100G</button><button data-t="cannon">💣 大砲 180G</button
        ><button data-t="magic">🔮 魔法 220G</button><button data-t="ice">❄️ 氷 150G</button>
      </div>
      <div class="tools unit-tools" id="unitTools" aria-label="兵士部隊（道に配置）">
        <span class="row-label" id="unitCount">部隊 0/4</span><button id="organize">📋 編成</button>
      </div>
      <section id="squadPanel" class="panel" hidden aria-label="選択中の部隊">
        <div class="panel-head">
          <strong id="sqTitle"></strong
          ><button id="sqClose" class="icon-btn" aria-label="部隊の選択を解除">✕</button>
        </div>
        <div id="sqSummary" class="tp-stats"></div>
        <div id="sqMembers" class="members"></div>
        <div id="soldierInfo" class="soldier-info"></div>
        <div class="panel-actions two">
          <button id="retreat">↩ 撤退</button><button id="sqOrganize">📋 編成</button>
        </div>
      </section>
      <div class="tools">
        <button id="start">▶ ウェーブ開始</button><button id="speed">⏩ x1</button
        ><button id="pause">⏸ 停止</button><button id="roster">👥 武将</button
        ><button id="reset">↻ 最初から</button>
      </div>
      <p id="msg">塔を選び、草地をタップして建設しよう。上下に分かれる道を守ろう！</p>
      <small>GitHub Pages / Safari対応・ペイント調・個別素材版 v8（武将配属・兵士部隊）</small>
    </main>
    <div id="squadSheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="squadTitle">
        <div class="panel-head">
          <strong id="squadTitle">部隊編成</strong
          ><button id="squadClose" class="icon-btn" aria-label="閉じる">✕</button>
        </div>
        <p id="squadHint" style="margin: 6px 0"></p>
        <div id="squadList"></div>
      </div>
    </div>
    <div id="heroSheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="panel-head">
          <strong id="sheetTitle">武将配属</strong
          ><button id="sheetClose" class="icon-btn" aria-label="閉じる">✕</button>
        </div>
        <p id="sheetHint" style="margin: 6px 0"></p>
        <div id="heroList"></div>
      </div>
    </div>
    <script>
      (() => {
        "use strict";
        const C = document.getElementById("game"),
          ctx = C.getContext("2d");
        const $ = (id) => document.getElementById(id);
        const W = 960,
          H = 600;
        const types = {
          arrow: { cost: 100, range: 155, damage: 18, rate: 0.45, col: "#a56b35", icon: "🏹" },
          cannon: { cost: 180, range: 130, damage: 48, rate: 1.6, col: "#56616d", icon: "💣" },
          magic: { cost: 220, range: 170, damage: 32, rate: 0.8, col: "#8a57b5", icon: "🔮" },
          ice: { cost: 150, range: 145, damage: 9, rate: 0.95, col: "#65b9d6", icon: "❄️" },
        };
        const TOWER_NAMES = { arrow: "弓の塔", cannon: "大砲の塔", magic: "魔法の塔", ice: "氷の塔" };
        const CANNON_SPLASH = 65;

        // ===== 武将の調整用設定 =====
        // 数値はすべてここで調整する。能力は毎回「元の塔の数値」から計算するため、
        // 配属・解除・強化を繰り返しても効果が積み上がることはない。
        //   rangeMul / damageMul / cannonSplashMul … 配属した塔への倍率
        //   aura: 配属した塔の周囲の塔の攻撃速度を上げる（attackSpeed 0.2 = +20%）
        //   skill.duration … 効果時間（秒・戦闘中のみ進行） skill.cooldown … 発動からの再使用待ち（秒）
        const HERO_RULES = {
          maxAttackSpeedMul: 2.5, // 攻撃速度アップの合計上限（倍）
          auraIncludesSelf: false, // 軍師の支援を配属先の塔自身にも掛けるか
        };
        const HERO_CONFIG = {
          archer: {
            name: "弓の名手",
            short: "弓",
            color: "#c8743c",
            passive: { rangeMul: 1.2 },
            passiveText: "配属した塔の射程 +20%",
            skill: { name: "疾風連射", duration: 8, cooldown: 40, attackSpeedMul: 1.8 },
            skillText: "8秒間、配属した塔の攻撃速度 ×1.8",
          },
          gunner: {
            name: "砲術家",
            short: "砲",
            color: "#5d6878",
            passive: { damageMul: 1.3, cannonSplashMul: 1.4 },
            passiveText: "配属した塔の攻撃力 +30%（大砲なら爆発範囲 +40%）",
            skill: { name: "一斉砲撃", duration: 1.5, cooldown: 35, volleys: 3, blastDamageMul: 1.5 },
            skillText: "射程内の敵全員に3回の範囲砲撃（1回 = 攻撃力×1.5）",
          },
          strategist: {
            name: "軍師",
            short: "軍",
            color: "#3f8a6d",
            passive: { aura: { radius: 170, attackSpeed: 0.2 } },
            passiveText: "近く（半径170）の他の塔の攻撃速度 +20%",
            skill: {
              name: "天啓の采配",
              duration: 10,
              cooldown: 45,
              aura: { radiusMul: 1.25, attackSpeed: 0.45 },
            },
            skillText: "10秒間、支援が +45%・範囲 ×1.25 に強化",
          },
        };
        const STARTER_HEROES = ["archer", "gunner", "strategist"];
        // 武将画像は tools/build.mjs が assets/manifest.json をもとに埋め込む。
        // 画像がない項目は仮アイコン（色付きの円＋一文字）で描画する。
        const HERO_ASSETS = /*@@HERO_ASSETS@@*/ {};
        const SAVE_KEY = "worldDefense.heroes.v1";

        // ===== 兵士部隊：調整用設定 =====
        // 塔に配属する「武将」とは別のシステム。兵士は1人ずつ個別に管理し、HPが0になると永久に死亡する。
        // 能力・経験値・称号の数値はすべてここで調整する。
        const SQUAD_RULES = {
          squadSize: 5, // 1部隊の上限人数（新規雇用時の人数）
          maxDeployed: 4, // 道に同時に出せる部隊数
          maxSquads: 8, // 保有できる部隊数（配置中＋待機中）
          snapDistance: 46, // タップ位置から道の中心線までの許容距離
          minSpacing: 60, // 部隊どうしの最小間隔
          noDeployFromEntry: 170, // 入口からこの距離までは配置不可
          noDeployBeforeCastle: 150, // 城の手前この距離は配置不可
          blockRadius: 30, // 部隊の中心から足止めが始まる距離
          maxBlockTime: 6, // 1体の敵を足止めできる最長時間（秒）。超えると突破される
          breakthroughTime: 3, // 突破した敵がしばらく足止めされない時間（秒）
          enemyReach: 34, // 近接の敵が部隊を攻撃できる距離
          retreatTime: 3, // 戦闘中の撤退にかかる時間。この間も攻撃を受け、足止め・攻撃はしない
          waveEndHeal: 0.2, // ウェーブ終了時に生存兵が回復する割合（最大HPに対して）。全回復はしない
          defenseScale: 30, // 被ダメージ = 攻撃 × scale / (scale + 防御)
          xpPerHit: 1, // 攻撃1回
          xpPerKill: 6, // 撃破（＋敵の報酬の半分）
          xpPerWave: 8, // 出撃してウェーブを生き延びた
          xpToLevel: (lv) => 15 + lv * 15, // 次のレベルまでに必要な経験値
          maxLevel: 10,
          lastSurvivor: { atk: 0.08, def: 0.08 }, // 「最後の生存者」の士気ボーナス
        };
        // grow … レベルが1上がるごとの上昇量（最大HPは上がるが、現在HPは回復しない）
        const SOLDIER_TYPES = {
          ashigaru: {
            enabled: true,
            name: "足軽",
            squadName: "足軽隊",
            icon: "🗡",
            mark: "足",
            color: "#3d63a8",
            cost: 15, // 1人あたりの雇用費用
            hp: 70,
            atk: 7,
            def: 4,
            rate: 0.9,
            range: 40,
            block: 2, // 部隊として同時に足止めできる敵の数（生存者数が上限）
            grow: { hp: 8, atk: 1.2, def: 1 },
            displayBox: [44, 52],
            text: "安価な近接部隊。敵2体まで足止め",
          },
          spearman: {
            enabled: true,
            name: "槍兵",
            squadName: "槍兵隊",
            icon: "🔱",
            mark: "槍",
            color: "#b8352e",
            cost: 24,
            hp: 95,
            atk: 8,
            def: 12,
            rate: 1.1,
            range: 48,
            block: 3,
            grow: { hp: 11, atk: 1.2, def: 2 },
            displayBox: [48, 60],
            text: "防御が高く、敵3体まで足止め",
          },
          archer: {
            enabled: true,
            name: "弓兵",
            squadName: "弓兵隊",
            icon: "🏹",
            mark: "弓",
            color: "#4f7f35",
            cost: 18,
            hp: 45,
            atk: 9,
            def: 1,
            rate: 1.2,
            range: 150,
            block: 0,
            grow: { hp: 5, atk: 1.6, def: 0.5 },
            displayBox: [48, 52],
            text: "後方から射撃。近接戦に弱く足止めしない",
          },
          // 以下は画像のみ用意済み・未実装（選択画面に出さない）
          gunner: { enabled: false, name: "鉄砲隊", mark: "鉄", color: "#27375f", displayBox: [56, 52] },
          cavalry: { enabled: false, name: "騎馬兵", mark: "騎", color: "#2f5ca8", displayBox: [68, 64] },
        };
        // 称号：上から順に条件を満たした最も高いものになる。atk / def は能力への倍率ボーナス
        const TITLES = [
          { id: "recruit", name: "新兵", waves: 0, kills: 0, atk: 0, def: 0 },
          { id: "skilled", name: "熟練兵", waves: 3, kills: 0, atk: 0.04, def: 0.04 },
          { id: "veteran", name: "歴戦の兵", waves: 7, kills: 0, atk: 0.08, def: 0.08 },
          { id: "seasoned", name: "百戦錬磨", waves: 15, kills: 0, atk: 0.12, def: 0.12 },

          soldiers = [];
          squadSeq = 0;
          soldierSeq = 0;
          unitGhosts.length = 0;
          selectedSquad = null;
          selectedSoldierId = null;
          selectedUnitType = null;
          placeSquadId = null;
          closeSquadSheet();
          resetHeroes();
          cutin = null;
          closeSheet();
          playing = false;
          paused = false;
          over = false;
          $("pause").textContent = "⏸ 停止";
          msg("新しいゲームを開始。塔を建てよう！");
          updateUI();
        };
        // ===== 兵士部隊：雇用ボタン・部隊パネル・編成画面 =====
        // 有効な兵種だけボタンを作る（未実装の兵種は表示しない）
        for (const type of enabledUnitTypes()) {
          const c = SOLDIER_TYPES[type],
            b = document.createElement("button");
          b.dataset.u = type;
          b.innerHTML =
            (UNIT_ASSETS[type] ? '<img alt="" src="' + UNIT_ASSETS[type] + '">' : c.icon + " ") +
            '<span class="u-label">' +
            c.name +
            " " +
            c.cost * SQUAD_RULES.squadSize +
            "G</span>";
          b.onclick = () => {
            selectedUnitType = type;
            placeSquadId = null;
            selectedTower = null;
            selectedSquad = null;
            msg(
              c.squadName +
                "（" +
                SQUAD_RULES.squadSize +
                "人・" +
                c.cost * SQUAD_RULES.squadSize +
                "G）：" +
                c.text +
                "。道をタップして配置しよう。",
            );
            updateUI();
          };
          $("unitTools").insertBefore(b, $("organize"));
        }
        function renderSquadUI() {
          $("unitCount").textContent = "部隊 " + fieldSquads().length + "/" + SQUAD_RULES.maxDeployed;
          document
            .querySelectorAll("[data-u]")
            .forEach((b) => b.classList.toggle("active", b.dataset.u === selectedUnitType));
          document
            .querySelectorAll("[data-t]")
            .forEach((b) =>
              b.classList.toggle(
                "active",
                !selectedUnitType && !placeSquadId && b.dataset.t === selectedType,
              ),
            );
          const q = selectedSquad,
            panel = $("squadPanel");
          if (!q || !squads.includes(q) || !onField(q)) {
            selectedSquad = null;
            panel.hidden = true;
            return;
          }
          panel.hidden = false;
          const list = members(q);
          if (!list.some((s) => s.id === selectedSoldierId)) selectedSoldierId = list[0] ? list[0].id : null;
          const avg = list.reduce((n, s) => n + s.level, 0) / Math.max(1, list.length);
          $("sqTitle").textContent =
            SOLDIER_TYPES[q.type].icon + " " + squadName(q) + (q.state === "retreating" ? "（撤退中）" : "");
          setHtml(
            $("sqSummary"),
            "<span>生存 <b>" +
              list.length +
              "</b>人</span><span>戦死 <b>" +
              q.fallen +
              "</b>人</span><span>平均 <b>Lv" +
              fmt(avg) +
              "</b></span>" +
              (SOLDIER_TYPES[q.type].block
                ? "<span>足止め <b>" + blockCount(q) + "/" + blockCap(q) + "</b></span>"
                : "<span>足止めなし</span>"),
          );
          setHtml(
            $("sqMembers"),
            list
              .map((s) => {
                const r = Math.max(0, s.hp / soldierStats(s).maxHp);
                return (
                  '<button class="chip' +
                  (s.id === selectedSoldierId ? " sel" : "") +
                  '" data-soldier="' +
                  s.id +
                  '" aria-label="' +
                  soldierName(s) +
                  '"><span>Lv' +
                  s.level +
                  (s.lastSurvivor ? "★" : "") +
                  '</span><span class="bar hp"><i style="width:' +
                  Math.round(r * 100) +
                  '%"></i></span></button>'
                );
              })
              .join(""),
          );
          const s = soldierById(selectedSoldierId);
          if (s) {
            const st = soldierStats(s),
              need = SQUAD_RULES.xpToLevel(s.level);
            setHtml(
              $("soldierInfo"),
              "<b>" +
                soldierName(s) +
                "</b> Lv" +
                s.level +
                (s.level < SQUAD_RULES.maxLevel
                  ? "（経験 " + Math.floor(s.xp) + "/" + need + "）"
                  : "（最大）") +
                ' <span class="title">' +
                titleText(s) +
                "</span><br>HP " +
                Math.ceil(s.hp) +
                "/" +
                st.maxHp +
                "・攻" +
                fmt(st.atk) +
                "・防" +
                fmt(st.def) +
                "・撃破 " +
                s.kills +
                "・生存 " +
                s.wavesSurvived +
                "W・戦闘 " +
                s.battles +
                "<br><small>所属 " +
                squadName(q) +
                (s.history.length ? "／" + esc(s.history[s.history.length - 1]) : "") +
                "</small>",
            );
          }
          $("retreat").disabled = q.state !== "deployed";
          $("retreat").textContent = playing ? "↩ 撤退（" + SQUAD_RULES.retreatTime + "秒）" : "↩ 待機へ";
        }
        $("sqMembers").addEventListener("click", (ev) => {
          const b = ev.target.closest("[data-soldier]");
          if (!b) return;
          selectedSoldierId = +b.dataset.soldier;
          updateUI();
        });
        $("sqClose").onclick = () => {
          selectedSquad = null;
          updateUI();
        };
        $("retreat").onclick = () => {
          if (selectedSquad) orderRetreat(selectedSquad);
          if (selectedSquad && selectedSquad.state === "reserve") selectedSquad = null;
          updateUI();
        };
        // 編成画面（部隊一覧・配置・補充・移籍・戦没者）
        let movingSoldierId = null;
        function squadStateText(q) {
          return q.state === "deployed"
            ? "配置中"
            : q.state === "retreating"
              ? "撤退中"
              : q.locked
                ? "待機中（次のウェーブから配置可）"
                : "待機中";
        }
        function renderSquadSheet() {
          const moving = soldierById(movingSoldierId);
          if (moving && !moving.alive) movingSoldierId = null;
          $("squadHint").textContent = movingSoldierId
            ? soldierName(moving) + " の編入先を選んでください。"
            : playing
              ? "ウェーブ中は配置・撤退のみ。補充と移籍はウェーブの合間にできます。"
              : "補充（雇用）と移籍ができます。1部隊" + SQUAD_RULES.squadSize + "人まで。";
          let html = "";
          if (movingSoldierId)
            html +=
              '<div class="card-actions"><button data-move-to="new">新しい部隊へ</button><button data-cancel-move>取消</button></div>';
          if (!squads.length)
            html += '<p class="muted">部隊がありません。兵種を選んで道をタップすると雇用できます。</p>';
          for (const q of squads) {
            const list = members(q),
              c = SOLDIER_TYPES[q.type];
            let acts = "";
            if (moving) {
              if (q.type === moving.type && q.id !== moving.squadId && list.length < SQUAD_RULES.squadSize)
                acts += '<button data-move-to="' + q.id + '">ここへ編入</button>';
            } else {
              if (q.state === "reserve" && !q.locked)
                acts += '<button data-place="' + q.id + '">配置する</button>';
              if (q.state === "deployed") acts += '<button data-retreat="' + q.id + '">撤退</button>';
              if (!playing && list.length < SQUAD_RULES.squadSize)
                acts += '<button data-recruit="' + q.id + '">新兵補充 ' + c.cost + "G</button>";
            }
            html +=
              '<div class="squad-card"><h3>' +
              c.icon +
              " " +
              squadName(q) +
              " <small>" +
              squadStateText(q) +
              "・生存" +
              list.length +
              "・戦死" +
              q.fallen +
              "</small></h3>" +
              list
                .map(
                  (s) =>
                    '<div class="soldier-row"><span>' +
                    soldierName(s) +
                    " Lv" +
                    s.level +
                    " " +
                    titleText(s) +
                    "<br><small>HP " +
                    Math.ceil(s.hp) +
                    "/" +
                    soldierStats(s).maxHp +
                    "・撃破" +
                    s.kills +
                    "・生存" +
                    s.wavesSurvived +
                    "W</small></span>" +
                    (!playing && !moving ? '<button data-move="' + s.id + '">移籍</button>' : "") +
                    "</div>",
                )
                .join("") +
              (acts ? '<div class="card-actions">' + acts + "</div>" : "") +
              "</div>";
          }
          const fallen = soldiers.filter((s) => !s.alive);
          if (fallen.length)
            html +=
              '<div class="squad-card"><h3>戦没者 ' +
              fallen.length +
              "名 <small>（復活しません）</small></h3>" +
              fallen
                .slice(-8)
                .reverse()
                .map(
                  (s) =>
                    '<div class="soldier-row"><small>' +
                    soldierName(s) +
                    " Lv" +
                    s.level +
                    " " +
                    titleText(s) +
                    "・撃破" +
                    s.kills +
                    "・W" +
                    s.diedWave +
                    " " +
                    esc(s.diedIn || "") +
                    "で戦死</small></div>",
                )
                .join("") +
              "</div>";
          $("squadList").innerHTML = html;
        }
        function openSquadSheet() {
          movingSoldierId = null;
          renderSquadSheet();
          $("squadSheet").hidden = false;
          $("squadClose").focus();
        }
        function closeSquadSheet() {
          movingSoldierId = null;
          $("squadSheet").hidden = true;
        }
        $("organize").onclick = openSquadSheet;
        $("sqOrganize").onclick = openSquadSheet;
        $("squadClose").onclick = closeSquadSheet;
        $("squadSheet").addEventListener("click", (ev) => {
          if (ev.target === $("squadSheet")) return closeSquadSheet();
          const b = ev.target.closest("button");
          if (!b || b.id === "squadClose") return;
          const d = b.dataset;
          let err = null;
          if (d.move) movingSoldierId = +d.move;
          else if (d.cancelMove !== undefined) movingSoldierId = null;
          else if (d.moveTo) {
            err = transferSoldier(movingSoldierId, d.moveTo === "new" ? "new" : +d.moveTo);
            if (!err) msg(soldierName(soldierById(movingSoldierId)) + " を編入した。");
            movingSoldierId = null;
          } else if (d.recruit) {
            err = recruitInto(squadById(+d.recruit));
            if (!err) msg("新兵を補充した。");
          } else if (d.retreat) orderRetreat(squadById(+d.retreat));
          else if (d.place) {
            placeSquadId = +d.place;
            selectedUnitType = null;
            selectedTower = null;
            selectedSquad = null;
            closeSquadSheet();
            msg(squadName(squadById(placeSquadId)) + "：道をタップして配置しよう。");
          }
          if (err) msg(err);
          if (!$("squadSheet").hidden) renderSquadSheet();
          updateUI();
        });
        // ===== 塔パネル・武将配属画面 =====
        const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1);
        const esc = (s) =>
          String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        function avatarHtml(id, big) {
          const c = HERO_CONFIG[id],
            src = heroImageSrc(id, big ? "portrait" : "icon", big ? "icon" : "portrait");
          return src
            ? '<span class="avatar' +
                (big ? " big" : "") +
                '" style="background-image:url(' +
                src +
                ')"></span>'
            : '<span class="avatar' +
                (big ? " big" : "") +
                '" style="background:' +
                c.color +
                '">' +
                c.short +
                "</span>";
        }
        function setHtml(el, html) {
          if (el.dataset.html !== html) {
            el.innerHTML = html;
            el.dataset.html = html;
          }
        }
        function renderTowerPanel() {
          const t = selectedTower,
            panel = $("towerPanel");
          if (!t || !towers.includes(t)) {
            panel.hidden = true;
            return;
          }
          panel.hidden = false;
          const p = types[t.type],
            st = towerStats(t),
            h = heroOn(t);
          $("tpTitle").textContent = towerLabel(t);
          const base = p.damage * (1 + 0.55 * (t.level - 1));
          const mark = (v, b) => (Math.abs(v - b) > 0.01 ? ' class="buff"' : "");
          setHtml(
            $("tpStats"),
            "<span>攻撃 <b" +
              mark(st.damage, base) +
              ">" +
              Math.round(st.damage) +
              "</b></span>" +
              "<span>射程 <b" +
              mark(st.range, p.range) +
              ">" +
              Math.round(st.range) +
              "</b></span>" +
              "<span>間隔 <b" +
              mark(st.rate, p.rate) +
              ">" +
              fmt(st.rate) +
              "秒</b></span>" +
              (t.type === "cannon"
                ? "<span>爆発 <b" +
                  mark(st.splash, CANNON_SPLASH) +
                  ">" +
                  Math.round(st.splash) +
                  "</b></span>"
                : "") +
              (st.aura > 0 ? '<span class="buff">軍師の支援 +' + Math.round(st.aura * 100) + "%</span>" : ""),
          );
          setHtml(
            $("tpHero"),
            h
              ? avatarHtml(h.id) +
                  "<p><b>" +
                  HERO_CONFIG[h.id].name +
                  "</b> 配属中<br><small>" +
                  HERO_CONFIG[h.id].passiveText +
                  "</small></p>"
              : "<p><small>武将なし（「武将配属」から配属できます）</small></p>",
          );
          const maxed = t.level >= 5;
          $("upgrade").textContent = maxed ? "⬆ 最大Lv" : "⬆ 強化 " + upgradePrice(t) + "G";
          $("sell").textContent = "🪙 売却 " + Math.floor(t.spent * 0.7) + "G";
          $("assign").textContent = h ? "👤 武将変更" : "👤 武将配属";
          const btn = $("skill");
          btn.hidden = !h;
          if (!h) return;
          const s = HERO_CONFIG[h.id].skill;
          let label, ratio, state;
          if (h.active > 0) {
            label = "✨ " + s.name + " 発動中 残り" + fmt(h.active) + "秒";
            ratio = h.active / s.duration;
            state = "running";
          } else if (h.cd > 0) {
            label =
              "⌛ " +
              s.name +
              " 再使用まで" +
              Math.ceil(h.cd) +
              "秒" +
              (playing && !paused ? "" : "（戦闘中に進行）");
            ratio = 1 - h.cd / s.cooldown;
            state = "";
          } else {
            label =
              "⚡ 必殺技「" +
              s.name +
              "」" +
              (playing && !over ? (paused ? "（停止中）" : "") : "（ウェーブ中に使用可）");
            ratio = 1;
            state = canUseSkill(h) ? "ready" : "";
          }
          $("skillLabel").textContent = label;
          $("skillBar").style.width = Math.round(ratio * 100) + "%";
          btn.className = "skill " + state;
          btn.disabled = !canUseSkill(h);
          btn.setAttribute("aria-label", label + "。" + HERO_CONFIG[h.id].skillText);
        }
        let sheetTower = null;
        function renderSheet() {
          const t = sheetTower && towers.includes(sheetTower) ? sheetTower : null;
          $("sheetTitle").textContent = t ? "武将配属：" + towerLabel(t) : "武将一覧";
          $("sheetHint").textContent = t
            ? "配属する武将を選んでください。1基に1人、同じ武将は1か所だけです。"
            : "配属先の確認と解除ができます。配属は塔をタップして「武将配属」から。";
          const ids = heroSave.owned.slice();
          if (heroSave.lastHero) ids.sort((a, b) => (b === heroSave.lastHero) - (a === heroSave.lastHero));
          $("heroList").innerHTML = ids
            .map((id) => {
              const h = heroState[id],
                c = HERO_CONFIG[id];
              const where = h.tower ? "配属先：" + esc(towerLabel(h.tower)) : "未配属";
              const timer =
                h.active > 0
                  ? "（必殺技 発動中）"
                  : h.cd > 0
                    ? "（必殺技 再使用まで" + Math.ceil(h.cd) + "秒）"
                    : "";
              let actions = "";
              if (t && h.tower === t) actions += "<button disabled>この塔に配属中</button>";
              else if (t)
                actions +=
                  '<button data-assign="' +
                  id +
                  '">' +
                  (h.tower ? "この塔へ移動" : "この塔に配属") +
                  "</button>";
              if (h.tower) actions += '<button data-unassign="' + id + '">解除</button>';
              return (
                '<div class="hero-card">' +
                avatarHtml(id, true) +
                "<div><h3>" +
                c.name +
                "</h3>" +
                "<p>常時：" +
                c.passiveText +
                "</p><p>必殺技「" +
                c.skill.name +
                "」：" +
                c.skillText +
                "（再使用 " +
                c.skill.cooldown +
                "秒）</p>" +
                '<p class="where">' +
                where +
                timer +
                "</p>" +
                '<div class="card-actions">' +
                actions +
                "</div></div></div>"
              );
            })
            .join("");
        }
        function openSheet(t) {
          sheetTower = t;
          renderSheet();
          $("heroSheet").hidden = false;
          $("sheetClose").focus();
        }
        function closeSheet() {
          sheetTower = null;
          $("heroSheet").hidden = true;
        }
        $("heroList").addEventListener("click", (ev) => {
          const b = ev.target.closest("button");
          if (!b) return;
          if (b.dataset.assign && sheetTower) {
            assignHero(b.dataset.assign, sheetTower);
            closeSheet();
          } else if (b.dataset.unassign) {
            unassignHero(b.dataset.unassign);
            renderSheet();
          }
          updateUI();
        });
        $("heroSheet").addEventListener("click", (ev) => {
          if (ev.target === $("heroSheet")) closeSheet();
        });
        $("sheetClose").onclick = closeSheet;
        $("assign").onclick = () => selectedTower && openSheet(selectedTower);
        $("roster").onclick = () => openSheet(null);
        $("tpClose").onclick = () => {
          selectedTower = null;
          updateUI();
        };
        $("skill").onclick = () => {
          const h = selectedTower && heroOn(selectedTower);
          if (!h) return;
          if (!canUseSkill(h)) {
            msg(playing ? "必殺技はまだ使えません。" : "必殺技はウェーブ中に使えます。");
            return;
          }
          useSkill(h);
          updateUI();
        };
        document.addEventListener("keydown", (ev) => {
          if (ev.key === "Escape" && !$("heroSheet").hidden) closeSheet();
          if (ev.key === "Escape" && !$("squadSheet").hidden) closeSquadSheet();
        });
        document.addEventListener("visibilitychange", () => {
          last = 0;
        });
        function frame(now) {
          const dt = last ? (now - last) / 1000 : 0;
          last = now;
          tick(dt);
          animateVisuals(dt);
          draw();
          requestAnimationFrame(frame);
        }
        // 動作確認用（URLに ?debug を付けたときだけ公開。通常プレイには影響しない）
        if (/[?&]debug\b/.test(location.search)) {
          window.WD_DEBUG = {
            state: () => ({
              gold,
              hp,
              wave,
              playing,
              paused,
              over,
              speed,
              towers,
              enemies,
              heroState,
              selectedTower,
              squads,
              soldiers,
              selectedSquad,
              selectedSoldierId,
              selectedUnitType,
              placeSquadId,
            }),
            squadApi: {
              members,
              soldierStats,
              rankTitle,
              titleText,
              transferSoldier,
              recruitInto,
              deployReserve,
              orderRetreat,
              hireSquad,
              blockCount,
              gainXp,
            },
            projectToRoad,
            // 指定した敵を追加（テスト用）。d は道に沿った距離
            addEnemy: (o) => {
              const e = Object.assign(
                {
                  path: upper,
                  d: 0,
                  kind: "goblin",
                  hp: 50,
                  max: 50,
                  speed: 60,
                  reward: 10,
                  color: "#b65e3e",
                  r: 12,
                  slow: 0,
                },
                o,
              );
              if (o.path === "lower") e.path = lower;
              if (o.path === "upper" || !o.path) e.path = upper;
              e.max = Math.max(e.max, e.hp);
              Object.assign(e, pathAt(e.path, e.d));
              enemies.push(e);
              return e;
            },
            stopSpawning: () => {
              spawned = spawnTotal;
            },
            unitConfig: { SOLDIER_TYPES, SQUAD_RULES, TITLES, ENEMY_VS_UNIT },
            towerStats,
            setGold: (g) => {
              gold = g;
              updateUI();
            },
            // sec 秒ぶんを h 秒刻みで進める（フレームレートの違いの確認用）
            step: (sec, h = 0.05) => {
              for (let i = 0; i < Math.round(sec / h); i++) {
                tick(h);
                animateVisuals(h);
              }
            },
            config: { HERO_CONFIG, HERO_RULES },
          };
        }
        updateUI();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
