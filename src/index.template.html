<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>WORLD DEFENSE</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #12251f;
        color: #f8edcc;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        max-width: 960px;
        margin: auto;
        padding: 12px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: clamp(21px, 5vw, 32px);
        margin: 8px 0;
      }
      button {
        border: 2px solid #b99c60;
        background: #254338;
        color: #fff0c9;
        border-radius: 12px;
        padding: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      button.active {
        background: #9b682b;
      }
      button:disabled {
        opacity: 0.4;
      }
      .stats,
      .tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .stats span {
        padding: 8px;
        background: #244034;
        border: 1px solid #b99c60;
        border-radius: 10px;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 10;
        border: 5px solid #9e8551;
        border-radius: 15px;
        touch-action: manipulation;
        background: #81a85c;
      }
      .tools button {
        flex: 1;
        min-width: 75px;
      }
      #msg {
        min-height: 48px;
        line-height: 1.5;
      }
      small {
        color: #d5c6a4;
      }
      body {
        background: radial-gradient(ellipse at top, #285c59, #102e36);
        color: #fff1d0;
      }
      .wrap {
        max-width: 1080px;
        padding: 16px;
      }
      header {
        border-bottom: 1px solid #b8d6b533;
        padding-bottom: 10px;
      }
      h1 {
        letter-spacing: 0.08em;
        text-shadow: 0 3px 0 #102f37;
      }
      .stats span {
        background: #153e44;
        border-color: #719b8f;
        box-shadow: inset 0 1px #ffffff18;
      }
      canvas {
        border-color: #e1bc77;
        box-shadow: 0 14px 36px #051f3766;
        margin: 16px 0;
      }
      button {
        background: linear-gradient(#3b6664, #21494e);
        border-color: #91ac92;
        min-height: 46px;
        box-shadow: 0 3px 0 #102f37;
        touch-action: manipulation;
      }
      button.active {
        background: linear-gradient(#e4b861, #ab7736);
        border-color: #ffe5a6;
        color: #233b3a;
      }
      button:focus-visible {
        outline: 3px solid #ffe7a0;
        outline-offset: 3px;
      }
      #msg {
        background: #143c45;
        border-left: 3px solid #dfbb75;
        padding: 12px;
        border-radius: 4px;
      }
      small {
        color: #b9d4c6;
      }
      @media (max-width: 600px) {
        .wrap {
          padding: 8px;
        }
        .tools {
          gap: 6px;
        }
        .tools button {
          font-size: 12px;
          padding: 9px 5px;
        }
        .unit-tools button {
          font-size: 14px;
        }
        .tower-tools button {
          padding: 6px 3px;
          min-width: 0;
        }
        .tower-tools .t-img {
          width: 26px;
          height: 26px;
        }
        canvas {
          border-width: 3px;
          margin: 10px 0;
        }
        .stats span {
          font-size: 12px;
          padding: 6px;
        }
        h1 {
          font-size: 21px;
        }
      }
      /* ---- 塔パネル・武将配属 ---- */
      [hidden] {
        display: none !important;
      }
      .panel {
        background: #143c45;
        border: 1px solid #719b8f;
        border-radius: 12px;
        padding: 10px 12px;
        margin: -6px 0 10px;
        font-size: 15px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .panel-head strong {
        font-size: 16px;
      }
      .icon-btn {
        font-size: 16px;
        min-width: 46px;
        padding: 6px 10px;
      }
      .tp-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin: 6px 0;
        color: #d8eadf;
      }
      .tp-stats b {
        color: #ffe3a0;
      }
      .tp-stats b.low {
        color: #ff8f80;
      }
      .repair {
        width: 100%;
        margin-top: 6px;
        font-size: 15px;
      }
      .buff {
        color: #9df0b0;
      }
      .tp-hero {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 8px;
        min-height: 40px;
      }
      .tp-hero p {
        margin: 0;
        line-height: 1.4;
      }
      .panel small,
      .sheet small {
        font-size: 14px;
      }
      .panel-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .panel-actions button,
      .skill {
        font-size: 15px;
        padding: 8px 6px;
      }
      .skill {
        width: 100%;
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: stretch;
      }
      .panel,
      .panel *,
      .sheet,
      .sheet * {
        -webkit-tap-highlight-color: transparent;
      }
      .skill:disabled {
        opacity: 0.8;
      }
      .skill.running:disabled {
        opacity: 1;
      }
      .skill.ready {
        background: linear-gradient(#e4b861, #ab7736);
        border-color: #ffe5a6;
        color: #233b3a;
      }
      .skill.running {
        border-color: #9df0b0;
      }
      .bar {
        display: block;
        height: 8px;
        border-radius: 4px;
        background: #0b262c;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #ffd77d;
      }
      .skill.running .bar i {
        background: #9df0b0;
      }
      .avatar {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #ffe0a0;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 19px;
        color: #fff;
        text-shadow: 0 1px 2px #0008;
        background-size: cover;
        background-position: center;
      }
      .avatar.big {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }
      .tower-tools button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        padding: 6px 4px;
        line-height: 1.2;
      }
      .tower-tools .t-img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        flex: none;
      }
      .tower-tools .t-img:not([src]) {
        display: none;
      }
      .tower-tools .t-text {
        display: flex;
        flex-direction: column;
        align-items: center;
        font-size: 14px;
        white-space: nowrap;
      }
      .tower-tools .t-text small {
        font-size: 14px;
        color: inherit;
      }
      .unit-tools {
        align-items: center;
      }
      /* あまり使わない画面切り替えは下にまとめる */
      .tools.menu-tools {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .tools.menu-tools button {
        min-width: 0;
        font-size: 14px;
        white-space: nowrap;
      }
      /* いちばん使う「ウェーブ開始」はマップのすぐ下の左に大きく */
      .tools.play-tools {
        display: grid;
        grid-template-columns: 2fr 1fr 1fr;
        margin-top: 0;
      }
      .tools.play-tools #start {
        min-height: 56px;
        font-size: 18px;
        font-weight: 800;
        color: #fff8e8;
        background: linear-gradient(#d9542f, #a8331b);
        border-color: #ffd28a;
      }
      .tools.play-tools #start:disabled {
        background: #3a4a44;
        border-color: #6f7f78;
        color: #c9d3cc;
      }
      /* 1行目：部隊数・「雇う」・「編成」、2行目以降：保有している部隊のチップ（4列）、雇用ボタン（3列・畳める） */
      .tools.unit-tools {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
      }
      .unit-head {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr);
        gap: 6px;
        align-items: center;
      }
      .squad-chips {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
      }
      .squad-chips:empty {
        display: none;
      }
      .hire-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }
      .hire-row[hidden] {
        display: none;
      }
      .tools.unit-tools .squad-chip {
        flex-direction: column;
        gap: 0;
        padding: 4px 2px;
        min-height: 52px;
        line-height: 1.2;
      }
      .squad-chip .chip-top {
        display: flex;
        align-items: center;
        gap: 2px;
        white-space: nowrap;
      }
      .tools.unit-tools .squad-chip img {
        width: 24px;
        height: 24px;
      }
      .squad-chip .chip-sub {
        font-size: 14px;
        white-space: nowrap;
      }
      /* 出陣中の部隊は緑の枠、配置できない部隊（撤退直後・撤退中・兵士なし）は薄く */
      .squad-chip.out {
        border-color: #7fd18b;
        background: #24412f;
      }
      .squad-chip.wait {
        opacity: 0.55;
      }
      .unit-tools .row-label {
        text-align: center;
      }
      .unit-tools button {
        min-width: 0;
        padding: 6px 4px;
      }
      .unit-tools .u-label {
        line-height: 1.25;
        white-space: nowrap;
      }
      .unit-tools .u-label span {
        display: block; /* 兵種名と費用を2行に */
      }
      .tools.unit-tools button {
        gap: 2px;
      }
      .tools.unit-tools button img {
        width: 26px;
        height: 26px;
      }
      .unit-tools .row-label {
        flex: none;
        font-size: 14px;
        padding: 0 4px;
        color: #d8eadf;
      }
      .unit-tools button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 14px;
      }
      .unit-tools button img {
        width: 30px;
        height: 30px;
        object-fit: contain;
        transform: scaleX(-1);
      }
      .panel-actions.four {
        grid-template-columns: repeat(4, 1fr);
      }
      .panel-actions.four button {
        padding: 6px 2px;
        line-height: 1.2;
      }
      .panel-actions small {
        display: block;
        font-size: 14px;
        color: #ffe3a0;
      }
      .panel-actions.two {
        grid-template-columns: repeat(2, 1fr);
      }
      .members {
        display: flex;
        gap: 6px;
        margin: 6px 0;
      }
      .chip {
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 4px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 14px;
      }
      .chip.add {
        justify-content: center;
        align-items: center;
        gap: 0;
        border-style: dashed;
        background: #1c4a46;
      }
      .chip.add .cost {
        font-size: 14px;
        color: #ffe3a0;
      }
      .chip.sel {
        border-color: #ffe5a6;
        background: linear-gradient(#5d7c62, #2d5452);
      }
      .chip .bar {
        width: 100%;
        height: 6px;
      }
      .soldier-info {
        line-height: 1.45;
        margin: 4px 0 8px;
      }
      .soldier-info .title {
        color: #ffe3a0;
      }
      .squad-card {
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
      }
      .squad-card h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .soldier-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 4px 0;
        line-height: 1.35;
      }
      .soldier-row button,
      .squad-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
      }
      .muted {
        color: #b9d4c6;
      }
      .rarity {
        display: inline-block;
        padding: 1px 6px;
        border-radius: 6px;
        font-size: 14px;
        font-weight: 800;
      }
      .stars {
        color: #ffd77d;
        font-size: 14px;
      }
      .hero-line {
        line-height: 1.45;
        margin: 2px 0 8px;
      }
      .tickets {
        font-size: 18px;
        font-weight: 800;
        color: #ffe3a0;
        margin: 6px 0;
      }
      .gacha-pull {
        width: 100%;
        font-size: 17px;
        margin: 6px 0 10px;
      }
      .pull-result {
        display: flex;
        gap: 12px;
        padding: 10px;
        border: 2px solid;
        border-radius: 12px;
        margin-bottom: 8px;
      }
      .pull-result h3 {
        margin: 0 0 4px;
        font-size: 18px;
      }
      .pull-result p {
        margin: 2px 0;
        line-height: 1.45;
      }
      .warn {
        color: #ffb3a7;
      }
      .hp-line {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
      }
      .hp-line .bar {
        flex: 1;
        height: 12px;
      }
      .bar.hp i {
        background: #ef6a58;
      }
      .retreat {
        width: 100%;
        font-size: 15px;
      }
      .sheet-back {
        position: fixed;
        inset: 0;
        background: #0610147a;
        z-index: 10;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: min(560px, 100%);
        max-height: 72vh;
        overflow-y: auto;
        background: #12343c;
        border: 1px solid #e1bc77;
        border-bottom: 0;
        border-radius: 16px 16px 0 0;
        padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
        font-size: 15px;
      }
      .counter-banner {
        margin: 8px 0 0;
        padding: 8px 12px;
        border: 1px solid #ef6a58;
        border-radius: 10px;
        background: #5a1f1acc;
        color: #ffe3d8;
        line-height: 1.45;
      }
      .target-card {
        margin: 8px 0 2px;
        padding: 8px 10px;
        border: 1px solid #b8322b99;
        border-radius: 10px;
        background: linear-gradient(90deg, #b8322b33, transparent 80%);
        line-height: 1.45;
      }
      .target-card.done {
        border-color: #e1bc77;
        background: linear-gradient(90deg, #e1bc7733, transparent 80%);
      }
      .capture {
        font-size: 17px;
        font-weight: 800;
        color: #ffe3a0;
      }
      .battle-skills {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin: 8px 0;
      }
      .battle-skills:empty {
        display: none;
      }
      .battle-skills button {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        min-height: 52px;
        padding: 4px 6px;
        text-align: left;
        font-size: 14px;
        line-height: 1.25;
      }
      .battle-skills button > span:last-child {
        min-width: 0;
        overflow: hidden;
      }
      .battle-skills button b,
      .battle-skills button small {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 14px;
      }
      .battle-skills button.ready {
        background: linear-gradient(#d9542f, #a8331b);
        border-color: #ffd28a;
        color: #fff8e8;
      }
      .battle-skills button.ready small {
        color: #fff1c4;
      }
      .battle-info {
        line-height: 1.5;
        margin-bottom: 8px;
      }
      .toast {
        position: fixed;
        left: 50%;
        top: calc(10px + env(safe-area-inset-top));
        transform: translateX(-50%);
        width: min(92vw, 520px);
        z-index: 20;
        padding: 10px 14px;
        border-radius: 12px;
        background: #143c45f2;
        border: 1px solid #e1bc77;
        box-shadow: 0 6px 18px #0008;
        font-size: 15px;
        line-height: 1.45;
        pointer-events: none;
      }
      .unit-tools .row-label small {
        display: block;
        font-size: 14px;
        color: #b9d4c6;
      }
      .tabs {
        display: flex;
        gap: 6px;
        margin: 8px 0 2px;
      }
      .tabs button {
        flex: 1;
        min-height: 40px;
        font-size: 15px;
      }
      .tabs.four button {
        padding: 4px 2px;
        line-height: 1.2;
        font-size: 14px;
      }
      .tabs.four small {
        display: block;
        font-size: 13px;
      }
      .saved {
        min-height: 20px;
        margin: 4px 0;
        color: #9fe0a8;
        font-size: 14px;
      }
      .saved.warn {
        color: #ffb3a7;
      }
      .unit-box {
        padding: 8px 10px;
        border: 1px solid #719b8f88;
        border-radius: 10px;
        background: #0f2c33;
      }
      .unit-box h3 {
        margin: 0 0 4px;
        font-size: 16px;
      }
      .unit-box p {
        margin: 2px 0;
        line-height: 1.45;
      }
      .pick-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 0;
        border-top: 1px solid #719b8f44;
        line-height: 1.35;
      }
      .pick-row > span {
        flex: 1;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .pick-row.named b {
        color: #ffd77d;
      }
      .pick-row button {
        flex: none;
        min-width: 72px;
        min-height: 44px;
        font-size: 15px;
        padding: 6px 10px;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 8px 0 4px;
      }
      .filters button {
        min-height: 40px;
        padding: 4px 12px;
        font-size: 14px;
      }
      .s-card {
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
        line-height: 1.45;
      }
      .s-card h3 {
        margin: 0 0 2px;
        font-size: 16px;
      }
      .s-card h3 small {
        font-weight: 400;
      }
      .s-card.named h3 {
        color: #ffd77d;
      }
      .s-card.named {
        background: linear-gradient(90deg, #e1bc7722, transparent 70%);
      }
      .s-card p {
        margin: 2px 0;
      }
      .xpbar {
        height: 6px;
        background: #0b2329;
        border-radius: 3px;
        overflow: hidden;
        margin: 3px 0;
      }
      .xpbar i {
        display: block;
        height: 100%;
        background: #e4b861;
      }
      .skill-tag {
        display: inline-block;
        padding: 1px 7px;
        margin: 2px 4px 2px 0;
        border-radius: 8px;
        background: #2d5452;
        border: 1px solid #91ac92;
        font-size: 13px;
      }
      .skill-tag.unique {
        border-color: #ffd77d;
        color: #ffe3a0;
      }
      .s-card .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .s-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
        flex: 1;
      }
      .injured {
        color: #ffb3a7;
      }
      .hero-card {
        display: flex;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
      }
      .hero-card h3 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .hero-card p {
        margin: 2px 0;
        line-height: 1.45;
      }
      .hero-card .where {
        color: #ffe3a0;
      }
      .hero-card .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .hero-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
        flex: 1;
      }
      /* スキル図鑑：WAVEの隣から開く、戦闘を離れない説明画面 */
      .stats {
        align-items: center;
      }
      .wave-guide-controls {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      #skillGuideOpen {
        min-height: 44px;
        padding: 7px 9px;
        font-size: 12px;
        white-space: nowrap;
      }
      #skillGuideSheet {
        z-index: 100;
      }
      #skillGuideSheet .sheet {
        max-height: 88vh;
        max-height: 88dvh;
        padding-top: 0;
      }
      .guide-toolbar {
        position: sticky;
        top: 0;
        z-index: 1;
        background: #143c45;
        padding: 12px 0 10px;
      }
      .guide-tabs {
        display: flex;
        gap: 8px;
        margin: 12px 0;
      }
      .guide-tabs button {
        flex: 1;
        font-size: 15px;
      }
      .guide-tabs [aria-selected="true"] {
        background: #d8b46b;
        color: #173b3d;

        let skillRng = Math.random; // スキル習得の乱数（テストで差し替え可能）
        // 兵種に合うスキルから、まだ持っていないものをランダムに1つ習得する（最大 maxSkills）
        function learnSkill(s, unique) {
          if (s.skills.length >= SQUAD_RULES.maxSkills) return null;
          const pool = Object.keys(SOLDIER_SKILLS).filter((id) => {
            const k = SOLDIER_SKILLS[id];
            return !k.future && !!k.unique === !!unique && k.types.includes(s.type) && !hasSkill(s, id);
          });
          if (!pool.length) return null;
          const id = pool[Math.min(pool.length - 1, Math.floor(skillRng() * pool.length))];
          s.skills.push(id);
          logHistory(s, (unique ? "固有スキル" : "スキル") + "「" + SOLDIER_SKILLS[id].name + "」を習得");
          return id;
        }
        function onLevelUp(s) {
          let note = "";
          if (SQUAD_RULES.skillLevels.includes(s.level)) {
            const id = learnSkill(s, false);
            if (id) note = "スキル「" + SOLDIER_SKILLS[id].name + "」を習得！";
          }
          if (s.level === SQUAD_RULES.uniqueLevel && skillRng() < SQUAD_RULES.uniqueChance) {
            const id = learnSkill(s, true);
            if (id) note = "固有スキル「" + SOLDIER_SKILLS[id].name + "」を習得！";
          }
          if (s.level === SQUAD_RULES.eliteLevel) {
            logHistory(s, "精鋭兵に昇格");
            note = "精鋭兵に昇格！" + note;
          }
          if (s.level === SQUAD_RULES.nameLevel && !s.name)
            note = "名前を付けられるようになった（兵士名簿から）。" + note;
          if (note) msg(soldierName(s) + " Lv" + s.level + "：" + note);
        }
        // 名前を付ける・変える（Lv nameLevel 以上の生存兵）。空にすると名前を外す
        function cleanName(v) {
          const t = Array.from(
            String(v == null ? "" : v)
              .replace(/[\u0000-\u001f\u007f<>]/g, "")
              .trim(),
          );
          return t.slice(0, SQUAD_RULES.nameMax).join("");
        }
        function nameSoldier(id, value) {
          const s = soldierById(id);
          if (!s || !s.alive) return "戦死した兵士には名前を付けられません。";
          if (s.level < SQUAD_RULES.nameLevel)
            return "Lv" + SQUAD_RULES.nameLevel + "から名前を付けられます。";
          const name = cleanName(value);
          const before = s.name;
          s.name = name || null;
          if (s.name !== before) logHistory(s, s.name ? "「" + s.name + "」と名付けられた" : "名前を外した");
          patchSavedSoldier(s, { name: s.name });
          return null;
        }
        // 兵士が部隊としてウェーブに参加した時点で戦闘数を数える
        function joinWave(q) {
          if (!playing || q.state !== "deployed") return;
          for (const s of members(q))
            if (!s.inWave) {
              s.inWave = true;
              s.battles++;
            }
        }

        // ===== 兵士部隊：配置 =====
        const pathLength = (path) =>
          path.slice(1).reduce((s, b, i) => s + Math.hypot(b[0] - path[i][0], b[1] - path[i][1]), 0);
        // タップ位置を道の中心線へ投影する（上下どちらの道でも最も近い点）
        function projectToRoad(x, y) {
          let best = null;
          for (const path of [upper, lower]) {
            let along = 0;
            for (let i = 1; i < path.length; i++) {
              const [ax, ay] = path[i - 1],
                [bx, by] = path[i],
                dx = bx - ax,
                dy = by - ay,
                len = Math.hypot(dx, dy),
                t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (len * len))),
                px = ax + dx * t,
                py = ay + dy * t,
                off = Math.hypot(x - px, y - py);
              if (!best || off < best.off)
                best = { x: px, y: py, off, d: along + len * t, total: pathLength(path), path };
              along += len;
            }
          }
          return best;
        }
        function placeCheck(x, y) {
          if (x < 0 || x > W || y < 0 || y > H) return { error: "マップの外には配置できません。" };
          const p = projectToRoad(x, y);
          if (!p || p.off > SQUAD_RULES.snapDistance)
            return { error: "部隊は道の上をタップして配置します。" };
          if (p.d < SQUAD_RULES.noDeployFromEntry) return { error: "入口の近くには配置できません。" };
          if (p.total - p.d < SQUAD_RULES.noDeployBeforeCastle)
            return { error: "城の直前には配置できません。" };
          if (fieldSquads().some((q) => Math.hypot(q.x - p.x, q.y - p.y) < SQUAD_RULES.minSpacing))
            return { error: "ほかの部隊に近すぎます。少し離して配置してください。" };
          if (fieldSquads().length >= SQUAD_RULES.maxDeployed)
            return { error: "道に出せる部隊は " + SQUAD_RULES.maxDeployed + " 部隊までです。" };
          return { point: p };
        }
        function putOnRoad(q, p) {
          q.state = "deployed";
          q.x = p.x;
          q.y = p.y;
          q.face = -1;
          joinWave(q);
        }
        // 兵士1人の雇用費（領土の効果「山国の兵」で安くなる）。部隊の雇用費は × squadSize
        const unitCost = (type) => Math.round(SOLDIER_TYPES[type].cost * (1 - territoryBonus("hire")));
        // 新しい部隊を雇用して配置（squadSize 人 × 費用）
        function hireSquad(type, x, y) {
          const c = SOLDIER_TYPES[type];
          if (!c || !c.enabled) return (msg("その兵種はまだ使えません。"), null);
          const cost = unitCost(type) * SQUAD_RULES.squadSize;
          const r = placeCheck(x, y);
          if (r.error) return (msg(r.error), null);
          if (squads.length >= SQUAD_RULES.maxSquads)
            return (
              msg(
                "保有できる部隊は " +
                  SQUAD_RULES.maxSquads +
                  " 部隊までです。「編成」から待機中の部隊を配置するか、解散して枠を空けてください。",
              ),
              null
            );
          if (gold < cost) return (msg("資金が足りません（" + c.squadName + " " + cost + "G）。"), null);
          gold -= cost;
          const q = newSquad(type);
          for (let i = 0; i < SQUAD_RULES.squadSize; i++) newSoldier(type, q.id);
          putOnRoad(q, r.point);
          msg(squadName(q) + "（" + SQUAD_RULES.squadSize + "人）を雇用して配置した。");
          return q;
        }
        // 待機中の部隊を再配置（費用なし。戦闘中に撤退した部隊はそのウェーブ中は出せない）
        function deployReserve(q, x, y) {
          if (!q || !squads.includes(q) || q.state !== "reserve")
            return (msg("その部隊は配置できません。"), false);
          if (q.locked)
            return (msg(squadName(q) + " は撤退したばかりです。次のウェーブから配置できます。"), false);
          if (!members(q).length) return (msg("その部隊には兵士がいません。"), false);
          const r = placeCheck(x, y);
          if (r.error) return (msg(r.error), false);
          putOnRoad(q, r.point);
          msg(squadName(q) + " を配置した。");
          return true;
        }

        // ===== 兵士部隊：足止め =====
        const blockCap = (q) => {
          if (q.state !== "deployed") return 0;
          const list = members(q),
            extra = list.some((s) => skillSum(s, "block") > 0) ? 1 : 0; // 槍衾（部隊に1回まで）
          const boost = SOLDIER_TYPES[q.type].block > 0 ? squadPassive(q).extraBlock || 0 : 0;
          return Math.min(SOLDIER_TYPES[q.type].block + extra + boost, list.length);
        };
        const blockCount = (q) => enemies.reduce((n, e) => n + (e.blockedBy === q ? 1 : 0), 0);
        // 足止めの解除。撤退・全滅・リセットのときに必ず呼ぶ
        function releaseBlocks(q) {
          for (const e of enemies)
            if (e.blockedBy === q) {
              e.blockedBy = null;
              e.blockTime = 0;
            }
        }
        function assignBlocks() {
          for (const e of enemies) {
            if (e.gone || e.blockedBy || e.hp <= 0 || e.breakthrough > 0) continue;
            const fast = (ENEMY_VS_UNIT[e.kind] || {}).unblockable; // 敵の騎兵は騎兵でしか止められない
            for (const q of squads) {
              if (fast && !SOLDIER_TYPES[q.type].blocksCavalry) continue;
              if (blockCount(q) >= blockCap(q) || dist(q, e) > SQUAD_RULES.blockRadius) continue;
              e.blockedBy = q;
              e.blockTime = 0;
              break;
            }
          }
        }
        // 足止めの整理：上限時間を超えた敵は突破、人数が減って上限を超えた分・存在しない部隊の分は解除
        function updateBlocks(dt) {
          const held = new Map();
          for (const e of enemies) {
            e.breakthrough = Math.max(0, (e.breakthrough || 0) - dt);
            const q = e.blockedBy;
            if (!q) continue;
            e.blockTime = (e.blockTime || 0) + dt;
            const n = (held.get(q) || 0) + 1;
            if (!squads.includes(q) || n > blockCap(q)) {
              e.blockedBy = null;
              e.blockTime = 0;
            } else if (e.blockTime >= SQUAD_RULES.maxBlockTime) {
              e.blockedBy = null;
              e.blockTime = 0;
              e.recentBreak = 3;
              e.breakthrough = heroHas(heroOnSquad(q), "haruhisa") ? 1.5 : SQUAD_RULES.breakthroughTime;
            } else held.set(q, n);
          }
        }

        // ===== 兵士部隊：被弾・戦死・撤退 =====
        function damageSquad(q, raw, ranged, kind, enemy = null) {
          const front = members(q)[0];
          if (!front) return;
          const st = soldierStats(front),
            weak = SOLDIER_TYPES[front.type].spearWeak,
            // 騎兵は敵の槍兵（内部ID knight）に弱い。人馬一体で追加分を減らす
            spear = weak && kind === "knight" ? 1 + (weak - 1) * (1 - skillSum(front, "spearGuard")) : 1,
            guard =
              (1 - skillSum(front, "guard")) * (ranged ? 1 - skillSum(front, "rangedGuard") : 1) * spear;
          const dmg = ((raw * SQUAD_RULES.defenseScale) / (SQUAD_RULES.defenseScale + st.def)) * guard * heroGuard(front, ranged, enemy || (kind ? { kind } : null));
          front.hp -= absorbShield(front, dmg, ranged);
          if (front.hp <= 0) consumeWard(front);
          front.hit = 0.2;
          // 不屈：倒れるはずの攻撃を1ウェーブに1回だけ HP1 で耐える
          if (front.hp <= 0 && hasSkill(front, "unyielding") && !front.unyieldUsed) {
            front.unyieldUsed = true;
            front.hp = 1;
            logHistory(front, "不屈で踏みとどまった");
          }
          if (front.hp <= 0) return killSoldier(front, q);
          // 生存本能：HPが減ると撤退を試みる（1ウェーブに1回。失敗すると戦い続ける）
          if (
            hasSkill(front, "instinct") &&
            !front.instinctTried &&
            front.hp < st.maxHp * SQUAD_RULES.instinctHp
          ) {
            front.instinctTried = true;
            if (Math.random() < SQUAD_RULES.instinctChance) withdrawSoldier(front, q);
          }
        }
        // 生存本能による個人の撤退：このウェーブの間は戦場を離れ（攻撃も被弾もしない）、次の戦闘から復帰する
        function withdrawSoldier(s, q) {
          s.out = true;
          logHistory(s, "生存本能で戦場を離脱");
          msg(soldierName(s) + " は生存本能で戦場を離脱した（次の戦闘から復帰）。");
          const off = formationOffset(q, 0);
          unitGhosts.push({
            type: s.type,
            x: q.x + off[0],
            y: q.y + off[1],
            age: 0,
            duration: 0.8,
            scale: SQUAD_SCALE,
            retreat: true,
          });
          if (unitGhosts.length > 16) unitGhosts.shift();
          if (!members(q).length) leaveField(q);
        }
        // 戦っている兵士がいなくなったが、離脱した生存兵が残っている部隊：全滅ではなく待機に戻る
        function leaveField(q) {
          releaseBlocks(q);
          q.state = "reserve";
          q.retreatLeft = 0;
          q.locked = true;
          if (selectedSquad === q) selectedSquad = null;
        }
        function killSoldier(s, q) {
          if (!s.alive) return;
          s.alive = false; // 永久死亡：以後どの処理でも復活・編成・配置の対象にならない
          s.hp = 0;
          s.diedWave = wave;
          s.diedIn = squadName(q);
          logHistory(s, squadName(q) + " で戦死");
          recordDeath(s); // 保存データからすぐ外す（再読み込みしても復活しない）
          q.fallen++;
          const off = formationOffset(q, 0);
          unitGhosts.push({
            type: s.type,
            x: q.x + off[0],
            y: q.y + off[1],
            age: 0,
            duration: UNIT_FRAMES[s.type] && UNIT_FRAMES[s.type].death ? 1.4 : 0.8, // 戦死のコマは少し長く見せる
            scale: SQUAD_SCALE,
            face: q.face || -1,
          });
          if (unitGhosts.length > 16) unitGhosts.shift();
          const alive = members(q);
          if (alive.length === 1 && q.fallen >= SQUAD_RULES.squadSize - 1 && !alive[0].lastSurvivor) {
            alive[0].lastSurvivor = true;
            logHistory(alive[0], squadName(q) + " でただ一人生き残った（最後の生存者）");
            msg(soldierName(alive[0]) + " が " + squadName(q) + " 最後の生存者となった。");
          }
          if (!alive.length) {
            if (roster(q).length) leaveField(q);
            else wipeSquad(q);
          }
        }
        function wipeSquad(q) {
          releaseBlocks(q);
          squads = squads.filter((v) => v !== q);
          if (selectedSquad === q) selectedSquad = null;
          if (placeSquadId === q.id) placeSquadId = null;
          // 配属されていた武将は戦死せず負傷する（しばらく出陣できない）
          const h = heroOnSquad(q);
          if (h) injureHero(h);
          msg(
            squadName(q) +
              " が全滅した…（戦死者は復活しません。新しい兵士は雇用してください）" +
              (h
                ? " 武将 " +
                  WARLORDS[h.id].name +
                  " は負傷して退却（" +
                  HERO_RULES.injuryWaves +
                  "ウェーブ出陣不可）。"
                : ""),
          );
        }
        const retreatTimeOf = (q) => SOLDIER_TYPES[q.type].retreatTime || SQUAD_RULES.retreatTime;
        function orderRetreat(q) {
          if (!q || q.state !== "deployed") return;
          releaseBlocks(q);
          if (!playing) {
            q.state = "reserve";
            msg(squadName(q) + " を待機させた。");
            return;
          }
          // 戦闘中は撤退に時間がかかり、その間も攻撃を受ける（瞬間移動・無敵化しない）
          q.state = "retreating";
          q.retreatLeft = retreatTimeOf(q);
          q.locked = true;
          msg(squadName(q) + " が撤退を開始（" + retreatTimeOf(q) + "秒）。");
        }

        // ===== 兵士部隊：戦闘（共通のゲーム時間で進む） =====
        function tickSquads(dt) {
          for (const q of squads.slice()) {
            if (q.state === "retreating" && (q.retreatLeft -= dt) <= 0) {
              q.state = "reserve";
              q.retreatLeft = 0;
              msg(squadName(q) + " の撤退が完了した。");
            }
          }
          // 兵士の攻撃（1人ずつ。攻撃間隔は余りを持ち越すのでフレームレートに左右されない）
          for (const q of squads) {
            if (q.state !== "deployed" || activeKind(heroOnSquad(q), "rest")) continue;
            for (const s of members(q)) {
              s.cd -= dt;
              if (s.cd > 0) continue;
              if (SOLDIER_TYPES[q.type].heal) {
                healTick(s, q); // 衛生兵は攻撃しない
                continue;
              }
              const st = soldierStats(s),
                alive = enemies.filter((e) => !e.gone && e.hp > 0);
              const marked = ownedHeroes().find((h) => activeKind(h, "focus") && h.skillTarget && alive.includes(h.skillTarget) && dist(q, h.skillTarget) <= st.range);
              const target = (marked && marked.skillTarget) || alive.find((e) => e.blockedBy === q) || targetPriority(q, st.range, heroOnSquad(q));
              if (!target) {
                s.cd = 0;
                continue;
              }
              s.cd += st.rate;
              s.atk = 0.18;
              q.face = target.x < q.x ? -1 : 1;
              // 敵将狙い：大将への攻撃アップ。連続攻撃：一定確率でもう1回
              const hitDmg = st.atk * (target.kind === "boss" ? 1 + skillSum(s, "vsBoss") : 1),
                charge = SOLDIER_TYPES[q.type].charge;
              // 突撃（騎兵）：新しい敵への最初の一撃だけ強い
              if (charge && s.chargeTarget !== target) {
                s.chargeTarget = target;
                dealEnemyDamage(target, hitDmg * (charge + skillSum(s, "chargeAdd")), { s, q, h: heroOnSquad(q) });
                burst(target.x - 6, target.y - 8, "#ffd9a0", "slash");
              } else dealEnemyDamage(target, hitDmg, { s, q, h: heroOnSquad(q) });
              if (skillSum(s, "combo") && Math.random() < skillSum(s, "combo")) {
                dealEnemyDamage(target, hitDmg, { s, q, h: heroOnSquad(q) });
                burst(target.x + 6, target.y - 6, "#ffe3a0", "slash");
              }
              target.hit = 0.18;
              touchHero(q);
              gainXp(s, SQUAD_RULES.xpPerHit);
              if (SOLDIER_TYPES[q.type].block) burst(target.x, target.y, "#fff1c4", "slash");
              else {
                const musket = SOLDIER_TYPES[q.type].shot === "musket";
                // 鉄砲兵：銃口の閃光と小さな煙（塔の鉄砲と同じ演出）
                if (musket) burst(q.x + q.face * 16, q.y - 22, "#ffe6a0", "gunsmoke");
                if (shots.length >= 160) shots.shift();
                shots.push({
                  x: q.x + (musket ? q.face * 16 : 0),
                  y: q.y - 22,
                  tx: target.x,
                  ty: target.y,
                  type: musket ? "magic" : "arrow",
                  age: 0,
                  duration: musket ? 0.12 : 0.22,
                  col: "#a56b35",
                });
              }
            }
          }
          // 敵の攻撃：足止めしている部隊 → 届く範囲の部隊 → 届く範囲の塔（道の上から。道を外れて塔へは向かわない）
          for (const e of enemies) {
            if (e.gone || e.hp <= 0 || e.stun > 0 || e.silence > 0) continue;
            const a = ENEMY_VS_UNIT[e.kind] || ENEMY_VS_UNIT.goblin;
            e.unitCd = (e.unitCd || 0) - dt;
            if (e.unitCd > 0) continue;
            const reach = a.ranged || SQUAD_RULES.enemyReach;
            let target = e.blockedBy && squads.includes(e.blockedBy) ? e.blockedBy : null,
              tower = null;
            if (!target) {
              let best = reach;
              for (const q of fieldSquads()) {
                const dd = dist(q, e);
                if (dd <= best && members(q).length) {
                  best = dd;
                  target = q;
                }
              }
            }
            if (!target && a.tower) {
              let best = a.tower.reach;
              for (const t of towers) {
                if (t.destroyed) continue;
                const dd = dist(t, e);
                if (dd <= best) {
                  best = dd;
                  tower = t;
                }
              }
            }
            if (!e.blockedBy && e.taunt && activeKind(e.taunt, "taunt")) {
              const h = e.taunt, pos = heroPos(h);
              if (h.squad && h.squad.state === "deployed" && pos && dist(pos, e) <= reach) { target = h.squad; tower = null; }
              else if (h.tower && !h.tower.destroyed && a.tower && dist(h.tower, e) <= a.tower.reach) { target = null; tower = h.tower; }
            }
            if (!target && !tower) {
              e.unitCd = 0;
              continue;
            }
            e.unitCd += a.rate * (e.attackSlowLeft > 0 ? e.attackSlow : 1);
            e.atkAnim = 0.35;
            const tx = target ? target.x : tower.x;
            e.face = tx < e.x ? -1 : 1;
            if (a.ranged) {
              const ty = target ? target.y - 16 : tower.y - 40;
              if (shots.length >= 160) shots.shift();
              shots.push({
                x: e.x,
                y: e.y - 14,
                tx,
                ty,
                type: "arrow",
                age: 0,
                duration: 0.3,
                col: "#a56b35",
              });
            }
            const scale = 1 + (wave - 1) * TOWER_HP.waveScale;
            if (target) damageSquad(target, a.damage * (1 + (wave - 1) * 0.05), !!a.ranged, e.kind, e);
            else {
              damageTower(tower, a.tower.damage * scale, !!a.ranged, e);
              // 大将は塔の前で立ち止まって攻撃する（1回の進軍で最長 siegeMax 秒。永久には止まらない）
              if (a.tower.siege && !tower.destroyed && !e.siegeDone) e.siege = tower;
            }
          }
        }
        // 衛生兵の回復：範囲内の部隊で、HPの割合が最も低い味方1人（自分は除く。戦死者・離脱者は対象外）
        function healTick(s, q) {
          const st = soldierStats(s);
          let best = null,
            ratio = 1;
          for (const o of fieldSquads()) {
            if (dist(o, q) > st.range) continue;
            members(o).forEach((m, i) => {
              if (m === s) return;
              const r = m.hp / soldierStats(m).maxHp;
              if (r < ratio) {
                ratio = r;
                best = { m, o, i };
              }
            });
          }
          if (!best) {
            s.cd = 0; // 回復する相手がいなければ待機（けが人が出たらすぐ回復）
            return;
          }
          s.cd += st.rate;
          s.atk = 0.18;
          const max = soldierStats(best.m).maxHp,
            amount = Math.min(st.heal, max - best.m.hp);
          healTarget(best.m, amount, q); // 最大HPを超えず、救護系パッシブを反映
          touchHero(q);
          s.heals = (s.heals || 0) + 1;
          gainXp(s, SQUAD_RULES.xpPerHeal);
          const off = formationOffset(best.o, best.i);
          if (effects.length >= 80) effects.shift();
          effects.push({
            x: best.o.x + off[0],
            y: best.o.y + off[1] - 18,
            kind: "heal",
            color: "#7be08a",
            age: 0,
            duration: 0.8,
          });
        }
        function creditKill(e) {
          const s = e.lastHitBy ? soldierById(e.lastHitBy) : null;
          if (!s || !s.alive) return;
          s.kills++;
          gainXp(s, SQUAD_RULES.xpPerKill + Math.round(e.reward / 2));
        }
        function squadsWaveStart() {
          for (const h of ownedHeroes()) { h.seen.clear(); h.economyGold = 0; if (h.couponWave < wave) h.couponWave = -1; }
          for (const q of squads) joinWave(q);
        }
        // ウェーブ終了：生存者だけが成長する。戦死者は復活しない。HPは一部だけ回復
        // 生存ボーナスはウェーブごとに1回だけ（xpClaim で二重取得を防ぐ）。終了後に兵士を保存する
        function squadsWaveEnd() {
          const claim = runId + ":" + wave;
          for (const s of soldiers) {
            if (!s.alive) continue;
            if (s.inWave && s.xpClaim !== claim) {
              s.xpClaim = claim;
              const before = rankTitle(s);
              s.wavesSurvived++;
              gainXp(s, SQUAD_RULES.xpPerWave, true);
              const after = rankTitle(s);
              if (after !== before) logHistory(s, "称号「" + after.name + "」を得た");
            }
            s.inWave = false;
            s.waveXp = 0;
            s.out = false; // 生存本能で離脱した兵士は次の戦闘から復帰
            s.instinctTried = false;
            s.unyieldUsed = false;
            const max = soldierStats(s).maxHp;
            const q = squadById(s.squadId), extra = q && heroHas(heroOnSquad(q), "terumoto") ? 0.15 : 0;
            s.hp = Math.min(max, s.hp + max * (SQUAD_RULES.waveEndHeal + extra));
            s.heroShield = s.heroRegen = null;
          }
          for (const q of squads) {
            q.locked = false;
            if (q.state === "retreating") {
              q.state = "reserve";
              q.retreatLeft = 0;
            }
          }
          saveRoster();
        }

        // ===== 兵士部隊：再編成（ウェーブ間のみ） =====
        function transferSoldier(soldierId, target) {
          if (battle) return "攻城戦の最中はできません。";
          if (playing) return "ウェーブ中は編成できません。";
          const s = soldierById(soldierId);
          if (!s || !s.alive) return "戦死した兵士は編成できません。";
          const from = squadById(s.squadId);
          let to = target === "new" ? null : squadById(target);
          if (target !== "new") {
            if (!to) return "編入先の部隊が見つかりません。";
            if (to === from) return null;
            if (to.type !== s.type) return "同じ兵種の部隊にだけ編入できます。";
            if (roster(to).length >= SQUAD_RULES.squadSize) return squadName(to) + " は満員です。";
          } else if (squads.length >= SQUAD_RULES.maxSquads) return "これ以上部隊を作れません。";
          if (!to) to = newSquad(s.type);
          s.squadId = to.id;
          logHistory(s, squadName(to) + " に編入");
          if (from && !roster(from).length) {
            releaseBlocks(from);
            releaseHeroFromSquad(from);
            squads = squads.filter((q) => q !== from);
            if (selectedSquad === from) selectedSquad = null;
          }
          return null;
        }
        // 解散：待機中の部隊の兵士を除隊させる（戦死ではないので英霊名鑑には残らない。保存データからも外す）
        function disbandSquad(q) {
          if (battle) return "攻城戦の最中はできません。";
          if (playing) return "ウェーブ中は解散できません。";
          if (!q || !squads.includes(q)) return "部隊が見つかりません。";
          if (q.state !== "reserve") return "道に出ている部隊は解散できません。先に撤退させてください。";
          const ids = new Set(roster(q).map((s) => s.id));
          releaseHeroFromSquad(q);
          soldiers = soldiers.filter((s) => !ids.has(s.id));
          squads = squads.filter((x) => x !== q);
          if (selectedSquad === q) selectedSquad = null;
          if (placeSquadId === q.id) placeSquadId = null;
          soldierSave.soldiers = soldierSave.soldiers.filter((v) => !ids.has(v.id));
          soldierSave.squads = soldierSave.squads.filter((v) => v.id !== q.id);
          writeSoldierSave();
          refreshSiege();
          return null;
        }
        function recruitInto(q) {
          if (battle) return "攻城戦の最中はできません。";
          if (playing) return "ウェーブ中は補充できません。";
          if (!q || !squads.includes(q)) return "部隊が見つかりません。";
          const c = SOLDIER_TYPES[q.type];
          if (roster(q).length >= SQUAD_RULES.squadSize) return squadName(q) + " は満員です。";
          const price = recruitCost(q);
          if (gold < price) return "資金が足りません（" + c.name + " " + price + "G）。";
          gold -= price;
          newSoldier(q.type, q.id);
          return null;
        }
        // 治療：ウェーブの合間にゴールドで部隊の生存兵を全回復する（戦死者は対象外＝復活しない）
        const healCost = (q) =>
          Math.ceil(
            serviceFactor("heal", q) * roster(q).reduce(
              (n, s) =>
                n +
                SOLDIER_TYPES[s.type].cost *
                  SQUAD_RULES.healRate *
                  Math.max(0, 1 - s.hp / soldierStats(s).maxHp),
              0,
            ),
          );
        function healSquad(q) {
          if (battle) return "攻城戦の最中はできません。";
          if (playing) return "ウェーブ中は治療できません。";
          if (!q || !squads.includes(q)) return "部隊が見つかりません。";
          const c = healCost(q);
          if (!c) return squadName(q) + " は全員元気です。";
          if (gold < c) return "資金が足りません（治療 " + c + "G）。";
          gold -= c;
          consumeCoupon();
          for (const s of roster(q)) s.hp = soldierStats(s).maxHp;
          return null;
        }
        // ===== 兵士の保存（個別の成長・名前・英霊名鑑） =====
        // 兵士はゲームをまたいで残る。保存するのは「ウェーブをクリアした時点の生存兵」と英霊名鑑。
        //   戦死はその場で保存データから外す（再読み込みしても復活しない）。
        //   戦闘中に得た経験値は、そのウェーブをクリアしたときに保存される（負け・やり直しでは残らない）。
        const SOLDIER_SAVE_KEY = "worldDefense.soldiers.v1";
        const SAVED_FIELDS = [
          "id",
          "type",
          "squadId",
          "level",
          "xp",
          "skills",
          "name",
          "battles",
          "kills",
          "wavesSurvived",
          "lastSurvivor",
          "history",
          "heals",
        ];
        let runId = Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
        const intIn = (v, lo, hi, d) => (Number.isFinite(v) ? Math.max(lo, Math.min(hi, Math.floor(v))) : d);
        function cleanSkills(list, type) {
          if (!Array.isArray(list)) return [];
          const out = [];
          for (const id of list)
            if (SOLDIER_SKILLS[id] && SOLDIER_SKILLS[id].types.includes(type) && !out.includes(id))
              out.push(id);
          return out.slice(0, SQUAD_RULES.maxSkills);
        }
        function cleanFallen(f) {
          if (!f || typeof f !== "object" || !SOLDIER_TYPES[f.type]) return null;
          const name = cleanName(f.name);
          if (!name) return null;
          return {
            id: intIn(f.id, 0, 1e9, 0),
            name,
            type: f.type,
            level: intIn(f.level, 1, SQUAD_RULES.maxLevel, 1),
            skills: cleanSkills(f.skills, f.type),
            battles: intIn(f.battles, 0, 1e6, 0),
            kills: intIn(f.kills, 0, 1e6, 0),
            wave: intIn(f.wave, 0, 999, 0),
          };
        }
        function loadSoldierSave() {
          const fresh = { seq: 0, squadSeq: 0, squads: [], soldiers: [], fallen: [] };
          let raw = null;
          try {
            raw = localStorage.getItem(SOLDIER_SAVE_KEY);
          } catch (err) {
            return fresh;
          }
          if (!raw) return fresh;
          try {
            const d = JSON.parse(raw);
            if (!d || typeof d !== "object") throw new Error("not an object");
            const squadsIn = (Array.isArray(d.squads) ? d.squads : [])
              .filter((q) => q && SOLDIER_TYPES[q.type] && SOLDIER_TYPES[q.type].enabled)
              .map((q) => ({ id: intIn(q.id, 1, 1e9, 0), type: q.type }))
              .filter((q, i, a) => q.id && a.findIndex((x) => x.id === q.id) === i)
              .slice(0, SQUAD_RULES.maxSquads);
            const ids = new Set(),
              count = {},
              list = [];
            for (const v of Array.isArray(d.soldiers) ? d.soldiers : []) {
              if (!v || typeof v !== "object") continue;
              const q = squadsIn.find((x) => x.id === v.squadId);
              const id = intIn(v.id, 1, 1e9, 0);
              // 所属部隊が無い・兵種が違う・満員・ID重複の兵士は読み込まない
              if (!q || q.type !== v.type || !id || ids.has(id)) continue;
              if ((count[q.id] || 0) >= SQUAD_RULES.squadSize) continue;
              ids.add(id);
              count[q.id] = (count[q.id] || 0) + 1;
              const level = intIn(v.level, 1, SQUAD_RULES.maxLevel, 1);
              list.push({
                id,
                type: v.type,
                squadId: q.id,
                level,
                xp: level >= SQUAD_RULES.maxLevel ? 0 : intIn(v.xp, 0, SQUAD_RULES.xpToLevel(level) - 1, 0),
                skills: cleanSkills(v.skills, v.type),
                name: level >= SQUAD_RULES.nameLevel ? cleanName(v.name) || null : null,
                battles: intIn(v.battles, 0, 1e6, 0),
                kills: intIn(v.kills, 0, 1e6, 0),
                wavesSurvived: intIn(v.wavesSurvived, 0, 1e6, 0),
                lastSurvivor: v.lastSurvivor === true,
                heals: intIn(v.heals, 0, 1e6, 0),
                history: (Array.isArray(v.history) ? v.history : [])
                  .filter((h) => typeof h === "string")
                  .map((h) => h.slice(0, 80))
                  .slice(-10),
              });
            }
            const fallen = (Array.isArray(d.fallen) ? d.fallen : [])
              .map(cleanFallen)
              .filter(Boolean)
              .slice(0, SQUAD_RULES.fallenMax);
            const maxId = Math.max(0, ...list.map((v) => v.id), ...fallen.map((f) => f.id));
            return {
              seq: Math.max(intIn(d.seq, 0, 1e9, 0), maxId),
              squadSeq: Math.max(intIn(d.squadSeq, 0, 1e9, 0), ...squadsIn.map((q) => q.id), 0),
              squads: squadsIn.filter((q) => count[q.id]),
              soldiers: list,
              fallen,
            };
          } catch (err) {
            console.warn("兵士の保存データを読み込めないため初期化します", err);
            return fresh;
          }
        }
        const soldierSave = loadSoldierSave();
        let soldierSaveOk = true;
        function writeSoldierSave() {
          try {
            localStorage.setItem(
              SOLDIER_SAVE_KEY,
              JSON.stringify(Object.assign({ version: 1 }, soldierSave)),
            );
            soldierSaveOk = true;
          } catch (err) {
            soldierSaveOk = false; // 保存できない環境でも遊べるようにする
          }
          return soldierSaveOk;
        }
        const pickSaved = (s) => {
          const o = {};
          for (const k of SAVED_FIELDS) o[k] = Array.isArray(s[k]) ? s[k].slice() : s[k];
          return o;
        };
        // ウェーブクリア時：部隊に所属する生存兵をすべて保存する
        function saveRoster() {
          const live = squads.filter((q) => roster(q).length);
          soldierSave.squads = live.map((q) => ({ id: q.id, type: q.type }));
          soldierSave.soldiers = soldiers
            .filter((s) => s.alive && live.some((q) => q.id === s.squadId))
            .map(pickSaved);
          soldierSave.seq = Math.max(soldierSave.seq, soldierSeq);
          soldierSave.squadSeq = Math.max(soldierSave.squadSeq, squadSeq);
          writeSoldierSave();
        }
        // 保存済みの兵士だけを書き換える（名前など。戦闘中の経験値はここでは保存しない）
        function patchSavedSoldier(s, fields) {
          const v = soldierSave.soldiers.find((x) => x.id === s.id);
          if (!v) return;
          Object.assign(v, fields);
          writeSoldierSave();
        }
        // 戦死：保存データから外し、名前付きの兵士は英霊名鑑に記録する
        function recordDeath(s) {
          soldierSave.soldiers = soldierSave.soldiers.filter((x) => x.id !== s.id);
          refreshSiege(); // 攻城編成からも外す
          if (s.name) {
            soldierSave.fallen.unshift({
              id: s.id,
              name: s.name,
              type: s.type,
              level: s.level,
              skills: s.skills.slice(),
              battles: s.battles,
              kills: s.kills,
              wave: wave,
            });
            soldierSave.fallen.length = Math.min(soldierSave.fallen.length, SQUAD_RULES.fallenMax);
          }
          writeSoldierSave();
        }
        // 保存した兵士で部隊を作り直す（ゲーム開始・最初から）。全員待機中・HP満タンで始まる
        function restoreRoster() {
          for (const q of squads) releaseBlocks(q);
          squads = [];
          soldiers = [];
          squadSeq = soldierSave.squadSeq;
          soldierSeq = soldierSave.seq;
          for (const sq of soldierSave.squads) {
            const q = newSquad(sq.type);
            q.id = sq.id;
          }
          squadSeq = Math.max(squadSeq, soldierSave.squadSeq);
          for (const v of soldierSave.soldiers) {
            const s = Object.assign(
              {
                alive: true,
                hp: 0,
                inWave: false,
                cd: 0,
                atk: 0,
                hit: 0,
                waveXp: 0,
                xpClaim: null,
              },
              pickSaved(v),
            );
            s.hp = soldierStats(s).maxHp;
            soldiers.push(s);
          }
          return soldiers.length;
        }
        restoreRoster();
        // ===== 防衛塔の耐久 =====
        const towerMaxHp = (t) => Math.round(baseTowerMax(t) * (towerPassive(t).hpMul || (heroHas(heroOn(t), "kiyomasa") ? 1.15 : 1)));
        function towerHp(t) {
          if (t.hp == null) t.hp = towerMaxHp(t);
          return t.hp;
        }
        const repairCost = (t) =>
          t.destroyed
            ? 0
            : Math.ceil(types[t.type].cost * TOWER_HP.repairRate * (1 - territoryBonus("repair")) * (1 - towerHp(t) / towerMaxHp(t)) * serviceFactor("repair", t));
        function damageTower(t, dmg, ranged = false, enemy = null) {
          if (t.destroyed) return;
          t.hp = towerHp(t) - absorbShield(t, dmg * heroGuard(t, ranged, enemy), ranged);
          if (t.hp <= 0) consumeWard(t);
          t.hitFlash = 0.25;
          burst(t.x + (Math.random() - 0.5) * 30, t.y - 30 - Math.random() * 30, "#c9b38a", "thit");
          if (t.hp <= 0) destroyTower(t);
        }
        // 破壊：攻撃できなくなり、がれきが残る（ウェーブ終了で片付く）。武将は死なず未配属に戻る
        function destroyTower(t) {
          t.hp = 0;
          t.destroyed = true;
          t.cd = 0;
          const h = heroOn(t);
          if (h) injureHero(h); // 武将は戦死せず負傷する
          for (const e of enemies) if (e.siege === t) e.siege = null;
          if (effects.length >= 78) effects.splice(0, 2);
          effects.push({ x: t.x, y: t.y, kind: "collapse", color: "#8a7a66", age: 0, duration: 1.4 });
          msg(
            towerLabel(t) +
              " が破壊された…" +
              (h
                ? " 武将 " +
                  WARLORDS[h.id].name +
                  " は負傷して退却（" +
                  HERO_RULES.injuryWaves +
                  "ウェーブ出陣不可）。"
                : ""),
          );
        }
        function fire(t, e) {
          const p = types[t.type];
          const duration =
            t.type === "cannon" ? 0.52 : t.type === "arrow" ? 0.22 : t.type === "magic" ? 0.12 : 0.38;
          t.aim = Math.atan2(e.y - (t.y - 42), e.x - t.x);
          t.recoil = 0.22;
          if (shots.length >= 160) shots.shift();
          // 弾の出る位置：鉄砲は画像の銃口、水攻めは水桶の上、ほかは塔の上部
          const from =
            t.type === "magic"
              ? { x: t.x + 36, y: t.y - 57 }
              : t.type === "ice"
                ? { x: t.x, y: t.y - 62 }
                : { x: t.x, y: t.y - 42 };
          shots.push({ x: from.x, y: from.y, tx: e.x, ty: e.y, type: t.type, age: 0, duration, col: p.col });
          // 鉄砲：銃口の火花と発砲煙（見た目のみ）
          if (t.type === "magic") burst(from.x + 4, from.y, "#ffe6a0", "gunsmoke");
          const st = towerStats(t);
          let damage = st.damage;
          if (t.type === "cannon") {
            enemies.forEach((a) => {
              if (dist(a, e) < st.splash) {
                dealEnemyDamage(a, damage, { t, h: heroOn(t) });
              }
            });
          } else {
            dealEnemyDamage(e, damage, { t, h: heroOn(t) });
            if (t.type === "ice") e.slow = 1.7;
          }
          touchHero(t);
          afterTowerFire(t, e, damage);
        }
        // 戦闘・演出・武将の時間は必ずこの関数で進める（速度切替を一か所で反映）
        const gameStep = (dt) => Math.min(dt, 0.05) * speed;
        function tick(dt) {
          if (battle) {
            if (!paused && !document.hidden) tickBattle(gameStep(dt)); // 攻城戦中は防衛戦を進めない
            return;
          }
          if (!playing || paused || over) return;
          dt = gameStep(dt);
          spawnClock -= dt;
          while (spawned < spawnTotal && spawnClock <= 0) {
            createEnemy();
            spawned++;
            spawnClock += Math.max(0.35, 0.95 - wave * 0.015);
          }
          assignBlocks();
          updateBlocks(dt);
          for (const e of enemies) {
            e.slow = Math.max(0, e.slow - dt);
            if (e.hp <= 0 || e.stun > 0) continue;
            if (e.blockedBy) continue; // 足止め中は移動しない（上限時間・解除は updateBlocks / releaseBlocks）
            if (e.siege) {
              e.siegeTime = (e.siegeTime || 0) + dt;
              if (!e.siege.destroyed && towers.includes(e.siege) && e.siegeTime < TOWER_HP.siegeMax) continue;
              e.siege = null;
              e.siegeDone = true;
            }
            e.d += e.speed * Math.min(e.slow > 0 ? 0.48 : 1, e.heroSlowLeft > 0 ? e.heroSlow : 1) * dt;
            Object.assign(e, pathAt(e.path, e.d));
            if (e.x >= 960 && !e.gone) {
              hp--;
              e.gone = true;
              e.hp = -999;
            }
          }
          tickHeroes(dt);
          tickSquads(dt);
          for (const t of towers) {
            if (t.destroyed || activeKind(heroOn(t), "rest")) continue; // 破壊・休息中は攻撃しない
            t.cd -= dt;
            if (t.cd <= 0) {
              const st = towerStats(t);
              const targets = enemies
                .filter((e) => !e.gone && e.hp > 0 && dist(t, e) < st.range)
                .sort((a, b) => b.d - a.d);
              // 攻撃間隔の余りを持ち越し、フレームレートで攻撃回数が変わらないようにする
              if (targets.length) {
                fire(t, targetPriority(t, st.range, heroOn(t)) || targets[0]);
                t.cd += st.rate * (t.nextRateMul || 1);
                t.nextRateMul = 1;
              } else t.cd = 0;
            }
          }
          // 撃破処理は e.gone で一度だけ（塔・兵士・必殺技が同時に倒しても報酬は1回）
          for (const e of enemies) {
            if (!e.gone && e.hp <= 0) {
              e.gone = true;
              gold += e.reward;
              const rewardHero = e.lastTowerHero && heroState[e.lastTowerHero];
              if (heroHas(rewardHero, "terumoto") && rewardHero.economyGold < WARLORD_RULES.maxExtraGold && Math.random() < WARLORD_RULES.extraGoldChance) { gold++; rewardHero.economyGold++; }
              creditKill(e);
              if (e.kind === "boss") grantTickets(GACHA.ticketsPerBoss, "ボス撃破");
              if (enemySet(e)) {
                if (effects.length >= 80) effects.shift();
                effects.push({
                  x: e.x,
                  y: e.y,
                  kind: "edeath",
                  ekind: e.kind,
                  face: e.face || 1,
                  age: 0,
                  duration: 0.9,
                });
              } else burst(e.x, e.y, e.color, e.kind === "goblin" ? "death" : "vanish");
            }
          }
          enemies = enemies.filter((e) => !e.gone);
          for (const e of enemies) if (e.blockedBy && !squads.includes(e.blockedBy)) e.blockedBy = null;
          if (hp <= 0) {
            hp = 0;

        const siegeSkillType = (id) => SIEGE_SKILL_OF[WARLORDS[id].skill.kind] || "rally";

        // 必殺技を使う。使えないときは理由を返す（再使用の時間は減らない）
        function useSiegeSkill(idx) {
          const B = battle,
            g = B && !B.result && B.groups[idx];
          if (!g || !g.hero) return "武将のいない部隊です。";
          if (!groupActive(g)) return g.state === "wait" ? g.name + " はまだ出撃していません。" : g.name + " は戦えません。";
          if (g.skillCd > 0) return "あと " + Math.ceil(g.skillCd) + " 秒で使えます。";
          const type = siegeSkillType(g.hero),
            S = SIEGE_SKILL[type],
            c = WARLORDS[g.hero],
            near = (o, r) => Math.hypot(o.x - g.x, o.y - g.y) <= r;

            const dmg = groupPower(g) * S.mul;

            if (e || t) burst((e || t).x, (e || t).y - (t ? 30 : 0), "#ffd36a", "cannon");

            const dmg = groupPower(g) * S.mul,

              ts = B.towers.filter((t) => !t.destroyed && near(t, S.radius));

        // 守備兵・NPCの塔へのダメージ（兵士の攻撃と必殺技で共通）

        function battleHitTower(t, dmg) {

          t.destroyed = true;

          effects.push({ x: t.x, y: t.y, kind: "collapse", color: "#8a7a66", age: 0, duration: 1.4 });

        // 部隊の中の兵士の位置（先頭が右＝城の側。最大10人を3列で）

        function battleHurt(g, raw, ranged, kind) {
          const alive = groupAlive(g),
            s = alive[0];
          if (!s) return;
          const st = battleStats(g, s),
            weak = SOLDIER_TYPES[s.type].spearWeak,
            spear = weak && kind === "knight" ? 1 + (weak - 1) * (1 - skillSum(s, "spearGuard")) : 1;
          s.hp -=
            ((raw * SQUAD_RULES.defenseScale) / (SQUAD_RULES.defenseScale + st.def)) *
            (g.guard > 0 ? SIEGE_SKILL.guard.hurt : 1) *
            (1 - skillSum(s, "guard")) *
            (ranged ? 1 - skillSum(s, "rangedGuard") : 1) *
            spear;
          s.hit = 0.2;
          if (s.hp <= 0 && hasSkill(s, "unyielding") && !s.unyieldUsed) {
            s.unyieldUsed = true;
            s.hp = 1;

          if (s.hp <= 0) {
            s.alive = false; // 永久死亡（防衛戦と同じ）
            s.hp = 0;
            s.diedWave = wave;
            s.diedIn = g.name + "（攻城戦）";
            logHistory(s, g.name + "（攻城戦）で戦死");

              age: 0,

          }

          if (hasSkill(s, "instinct") && !s.instinctTried && s.hp < st.maxHp * SQUAD_RULES.instinctHp) {
            s.instinctTried = true;

        // 部隊が全滅（または全員離脱）した。武将は戦死せず負傷する
        function groupLost(g, withdrew) {
          g.state = "lost";

          if (h && !withdrew) injureHero(h);

            g.name +
              (withdrew ? " は全員が戦場を離れた。" : " が全滅した…") +

        // 前方で足止めしてくる守備隊（同じ道、合流後はどちらの道でも）

        const castleDist = (g) => Math.hypot(SIEGE_BATTLE.castle.x - g.x, SIEGE_BATTLE.castle.y - g.y);
        function tickBattle(dt) {
          const B = battle;
          if (!B || B.result) return;

          while (B.nextUnit < B.groups.length && B.t >= B.nextUnit * SIEGE_BATTLE.interval) {

          for (const e of B.garrison) e.atkAnim = Math.max(0, e.atkAnim - dt);
          for (const g of B.groups) {
            if (groupActive(g)) g.skillCd = Math.max(0, g.skillCd - dt); // 出撃してから進む

          for (const g of B.groups) {

                x: e.x,
                y: e.y - 14,
                tx: tg.x,

                age: 0,

                tg = g;

              x: t.x,
              y: t.y - 42,
              tx: tg.x,
              ty: tg.y - 14,

              age: 0,
              duration: t.type === "cannon" ? 0.5 : 0.25,

        function endBattle(result) {

        function showBattleResult(B) {

                ? "↩ 全軍撤退"
                : B.result === "timeup"

            (B.captured

                "（" +

                (C.reward && C.reward.tickets ? " 🎴 ガチャ券 +" + C.reward.tickets : "") +

            (B.unified

            (B.counter

          if (heroes) {
            const order = Object.fromEntries(Object.keys(RARITY).map((id, i) => [id, i]));
            cards = Object.entries(WARLORDS)
              .sort(([, a], [, b]) => order[a.rarity] - order[b.rarity])
              .filter(([, c]) => [c.name, c.rarity, c.passiveText, c.skill.name, c.skillText].join(" ").toLocaleLowerCase().includes(query))
              .map(([id, c]) => '<article class="guide-card" data-guide-hero="' + id + '"><div class="guide-card-head">' + avatarHtml(id) + '<h3>' + rarityTag(id) + ' ' + esc(c.name) + '</h3></div><p class="guide-meta">' + esc(c.role) + (c.favorite ? '／得意：' + esc(SOLDIER_TYPES[c.favorite].name) : '／全兵種') + '</p><p><b>常時効果：</b>' + '部隊：' + esc(c.squadText) + '<br>塔：' + esc(c.towerText) + '</p><p><b>必殺技「' + esc(c.skill.name) + '」</b><br>' + esc(c.skillText) + '</p><p><b>攻城戦：</b>' + esc(c.siegePassive.text.replace(/（.*）$/, '')) + '<br>必殺技は' + esc(SIEGE_SKILL[siegeSkillType(id)].name + '：' + SIEGE_SKILL[siegeSkillType(id)].text) + '</p><p class="guide-meta">再使用まで ' + c.skill.cooldown + '秒（戦闘中のみ進行）</p></article>');
          } else {
            cards = Object.entries(SOLDIER_SKILLS)
              .filter(([, c]) =>
                [
                  c.name,
                  c.text,
                  c.unique ? "固有" : c.future ? "未実装" : "通常",
                  ...c.types.map((id) => SOLDIER_TYPES[id].name),
                ]
                  .join(" ")
                  .toLocaleLowerCase()
                  .includes(query),
              )
              .map(
                ([id, c]) =>
                  '<article class="guide-card" data-guide-soldier="' +
                  id +
                  '"><h3>' +
                  esc(c.name) +
                  " <small>［" +
                  (c.future ? "未実装・習得不可" : c.unique ? "固有" : "通常") +
                  "］</small></h3><p>" +
                  esc(c.text) +
                  '</p><p class="guide-meta">対象：' +
                  c.types.map((id) => esc(SOLDIER_TYPES[id].name)).join("・") +
                  "</p></article>",
              );
          }
          $("skillGuideCount").textContent = cards.length + (heroes ? "人の武将" : "件のスキル");
          $("skillGuidePanel").innerHTML =
            cards.join("") ||
            '<p class="guide-note">該当するスキルがありません。検索語を変えてください。</p>';
        }
        function openSkillGuide() {
          if (guideReturn) return;
          const main = document.querySelector("main");
          guideReturn = { paused, y: window.scrollY, style: document.body.style.cssText, inert: main.inert, focus: document.activeElement };
          $("skillGuideStatus").textContent = (playing || battle) && !over
            ? paused ? "ゲームは停止中です。閉じても停止を維持します。" : "読んでいる間は一時停止します。閉じると再開します。"
            : "一覧を閉じると、そのままゲームに戻れます。";
          paused = true;
          $("pause").textContent = "▶ 再開";
          $("skillGuideSearch").value = "";
          renderSkillGuide();
          $("skillGuideSheet").hidden = false;
          $("skillGuideOpen").setAttribute("aria-expanded", "true");
          main.inert = true;
          document.body.style.position = "fixed";
          document.body.style.top = -guideReturn.y + "px";
          document.body.style.width = "100%";
          document.body.style.overflow = "hidden";
          $("skillGuideClose").focus({ preventScroll: true });
          updateUI();
        }
        function closeSkillGuide() {
          if (!guideReturn) return;
          const prev = guideReturn;
          guideReturn = null;
          $("skillGuideSheet").hidden = true;
          $("skillGuideOpen").setAttribute("aria-expanded", "false");
          document.querySelector("main").inert = prev.inert;
          document.body.style.cssText = prev.style;
          paused = prev.paused;
          $("pause").textContent = paused ? "▶ 再開" : "⏸ 停止";
          last = 0; // 閲覧時間ぶんを戦闘に加算しない
          window.scrollTo(0, prev.y);
          if (prev.focus && prev.focus.isConnected) prev.focus.focus({ preventScroll: true });
          updateUI();
        }
        function selectGuideKind(kind) {
          guideKind = kind;
          $("skillGuideSearch").value = "";
          renderSkillGuide();
          document.querySelector("#skillGuideSheet .sheet").scrollTop = 0;
        }
        $("skillGuideOpen").onclick = openSkillGuide;
        $("skillGuideClose").onclick = closeSkillGuide;
        $("skillGuideHeroes").onclick = () => selectGuideKind("heroes");
        $("skillGuideSoldiers").onclick = () => selectGuideKind("soldiers");
        $("skillGuideSearch").oninput = renderSkillGuide;
        $("skillGuideSheet").onclick = (ev) => { if (ev.target === $("skillGuideSheet")) closeSkillGuide(); };
        document.addEventListener("keydown", (ev) => {
          if (!guideReturn) return;
          if (ev.key === "Escape") {
            ev.preventDefault();
            ev.stopImmediatePropagation();
            closeSkillGuide();
          } else if (
            ["ArrowLeft", "ArrowRight", "Home", "End"].includes(ev.key) &&
            ev.target.matches(".guide-tabs button")
          ) {
            ev.preventDefault();
            selectGuideKind(
              ev.key === "Home"
                ? "heroes"
                : ev.key === "End"
                  ? "soldiers"
                  : guideKind === "heroes"
                    ? "soldiers"
                    : "heroes",
            );
            $(guideKind === "heroes" ? "skillGuideHeroes" : "skillGuideSoldiers").focus();
          } else if (ev.key === "Tab") {
            const nodes = [...$("skillGuideSheet").querySelectorAll('button, input, [tabindex="0"]')].filter(
              (el) => el.tabIndex >= 0 && el.getClientRects().length,
            );
            const first = nodes[0],
              end = nodes[nodes.length - 1];
            if (
              ev.shiftKey &&
              (document.activeElement === first || !$("skillGuideSheet").contains(document.activeElement))
            ) {
              ev.preventDefault();
              end.focus();
            } else if (
              !ev.shiftKey &&
              (document.activeElement === end || !$("skillGuideSheet").contains(document.activeElement))
            ) {
              ev.preventDefault();
              first.focus();
            }
          }
        });
        document.addEventListener("keydown", (ev) => {
          if (ev.key === "Escape" && !$("heroSheet").hidden) closeSheet();
          if (ev.key === "Escape" && !$("squadSheet").hidden) closeSquadSheet();
          if (ev.key === "Escape" && !$("gachaSheet").hidden) closeGacha();
        });
        document.addEventListener("visibilitychange", () => {
          last = 0;
        });
        let squadSig = "";
        function frame(now) {
          const dt = last ? (now - last) / 1000 : 0;
          last = now;
          tick(dt);
          animateVisuals(dt);
          draw();
          // 部隊の状態（出陣・撤退・人数・Lv）が戦闘中に変わったら、部隊チップを描き直す
          const sig = squads
            .map((q) => q.id + q.state + (q.locked ? 1 : 0) + members(q).reduce((n, s) => n + "." + s.level, ""))
            .join();
          if (sig !== squadSig) {
            squadSig = sig;
            renderSquadUI();
          }
          requestAnimationFrame(frame);
        }
        // 動作確認用（URLに ?debug を付けたときだけ公開。通常プレイには影響しない）
        if (/[?&]debug\b/.test(location.search)) {
          window.WD_DEBUG = {
            state: () => ({
              gold,
              hp,
              wave,
              playing,
              paused,
              over,
              speed,
              towers,
              enemies,
              heroState,
              selectedTower,
              squads,
              soldiers,
              selectedSquad,
              selectedSoldierId,
              selectedUnitType,
              placeSquadId,
            }),
            squadApi: {
              members,
              soldierStats,
              rankTitle,
              titleText,
              transferSoldier,
              recruitInto,
              deployReserve,
              orderRetreat,
              hireSquad,
              blockCount,
              gainXp,
              roster,
              nameSoldier,
              healSquad,
              healCost,
              disbandSquad,
              battle: () => battle,
              startBattle,
              useSiegeSkill,
              siegeSkillType,
              SIEGE_SKILL,
              endBattle,
              retreatBattle,
              SIEGE_BATTLE,
              NPC_CASTLES,
              conquest: () => conquest,
              conquestMeta: () => conquestMeta,
              PROVINCES,
              setTarget,
              targetCastleId,
              ownsProvince,
              canAttackProvince,
              activeCounter,
              maybeCounter,
              borderProvinces,
              setCounterRng: (f) => (counterRng = f || Math.random),
              COUNTER,
              territoryBonus,
              startGold,
              unitCost,
              repairCost,
              siege: () => siegeUnits,
              siegeAdd,
              siegeRemove,
              siegeSetHero,
              siegeSummary,
              siegeEligible,
              refreshSiege,
              SIEGE_RULES,
              learnSkill,
              damageSquad,
              withdrawSoldier,
              squadsWaveEnd,
              saveRoster,
              restoreRoster,
              soldierSave: () => soldierSave,
              setSkillRng: (f) => (skillRng = f || Math.random),
              SOLDIER_SKILLS,
              RANKS,
            },
            projectToRoad,
            // 演出の種類（テスト用）
            fx: () => ({ effects: effects.map((e) => e.kind), shots: shots.map((x) => x.type) }),
            // 指定した敵を追加（テスト用）。d は道に沿った距離
            addEnemy: (o) => {
              const e = Object.assign(
                {
                  path: upper,
                  d: 0,
                  kind: "goblin",
                  hp: 50,
                  max: 50,
                  speed: 60,
                  reward: 10,
                  color: "#b65e3e",
                  r: 12,
                  slow: 0,
                },
                o,
              );
              if (o.path === "lower") e.path = lower;
              if (o.path === "upper" || !o.path) e.path = upper;
              e.max = Math.max(e.max, e.hp);
              Object.assign(e, pathAt(e.path, e.d));
              enemies.push(e);
              return e;
            },
            stopSpawning: () => {
              spawned = spawnTotal;
            },
            unitConfig: { SOLDIER_TYPES, SQUAD_RULES, TITLES, ENEMY_VS_UNIT, UNIT_FRAMES },
            towerApi: { towerHp, towerMaxHp, damageTower, repairCost, TOWER_HP },
            towerStats,
            setGold: (g) => {
              gold = g;
              updateUI();
            },
            // sec 秒ぶんを h 秒刻みで進める（フレームレートの違いの確認用）
            step: (sec, h = 0.05) => {
              for (let i = 0; i < Math.round(sec / h); i++) {
                tick(h);
                animateVisuals(h);
              }
            },
            config: { WARLORDS, HERO_RULES, GACHA },
            heroApi: {
              save: () => heroSave,
              heroState: () => heroState,
              pullGacha,
              rollWarlord,
              grantTickets,
              assignHero,
              unassignHero,
              heroOn,
              heroOnSquad,
              useSkill,
              canUseSkill,
              squadHeroMods,
              dealEnemyDamage, heroGuard, healTarget, tickHeroes, resolveSkillTarget, absorbShield,
              autoSkillInput, useSkillFrom, recruitCost, serviceFactor, consumeCoupon,
              weaponPower, moveSquadBySkill, endSkill, WARLORD_RULES, targetPriority, afterTowerFire, drawWarlordFields,
              draw: () => draw(), clock: () => combatClock,
              injureHero,
              healInjuries,
              injuryOf,
            },
          };
        }
        updateUI();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
