<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>WORLD DEFENSE</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #12251f;
        color: #f8edcc;
        font-family: system-ui, sans-serif;
      }
      .wrap {
        max-width: 960px;
        margin: auto;
        padding: 12px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: clamp(21px, 5vw, 32px);
        margin: 8px 0;
      }
      button {
        border: 2px solid #b99c60;
        background: #254338;
        color: #fff0c9;
        border-radius: 12px;
        padding: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      button.active {
        background: #9b682b;
      }
      button:disabled {
        opacity: 0.4;
      }
      .stats,
      .tools {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 9px 0;
      }
      .stats span {
        padding: 8px;
        background: #244034;
        border: 1px solid #b99c60;
        border-radius: 10px;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        aspect-ratio: 16 / 10;
        border: 5px solid #9e8551;
        border-radius: 15px;
        touch-action: manipulation;
        background: #81a85c;
      }
      .tools button {
        flex: 1;
        min-width: 75px;
      }
      #msg {
        min-height: 48px;
        line-height: 1.5;
      }
      small {
        color: #d5c6a4;
      }
      body {
        background: radial-gradient(ellipse at top, #285c59, #102e36);
        color: #fff1d0;
      }
      .wrap {
        max-width: 1080px;
        padding: 16px;
      }
      header {
        border-bottom: 1px solid #b8d6b533;
        padding-bottom: 10px;
      }
      h1 {
        letter-spacing: 0.08em;
        text-shadow: 0 3px 0 #102f37;
      }
      .stats span {
        background: #153e44;
        border-color: #719b8f;
        box-shadow: inset 0 1px #ffffff18;
      }
      canvas {
        border-color: #e1bc77;
        box-shadow: 0 14px 36px #051f3766;
        margin: 16px 0;
      }
      button {
        background: linear-gradient(#3b6664, #21494e);
        border-color: #91ac92;
        min-height: 46px;
        box-shadow: 0 3px 0 #102f37;
        touch-action: manipulation;
      }
      button.active {
        background: linear-gradient(#e4b861, #ab7736);
        border-color: #ffe5a6;
        color: #233b3a;
      }
      button:focus-visible {
        outline: 3px solid #ffe7a0;
        outline-offset: 3px;
      }
      #msg {
        background: #143c45;
        border-left: 3px solid #dfbb75;
        padding: 12px;
        border-radius: 4px;
      }
      small {
        color: #b9d4c6;
      }
      @media (max-width: 600px) {
        .wrap {
          padding: 8px;
        }
        .tools {
          gap: 6px;
        }
        .tools button {
          font-size: 12px;
          padding: 9px 5px;
        }
        canvas {
          border-width: 3px;
          margin: 10px 0;
        }
        .stats span {
          font-size: 12px;
          padding: 6px;
        }
        h1 {
          font-size: 21px;
        }
      }
      /* ---- 塔パネル・武将配属 ---- */
      [hidden] {
        display: none !important;
      }
      .panel {
        background: #143c45;
        border: 1px solid #719b8f;
        border-radius: 12px;
        padding: 10px 12px;
        margin: -6px 0 10px;
        font-size: 15px;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .panel-head strong {
        font-size: 16px;
      }
      .icon-btn {
        font-size: 16px;
        min-width: 46px;
        padding: 6px 10px;
      }
      .tp-stats {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        margin: 6px 0;
        color: #d8eadf;
      }
      .tp-stats b {
        color: #ffe3a0;
      }
      .buff {
        color: #9df0b0;
      }
      .tp-hero {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 4px 0 8px;
        min-height: 40px;
      }
      .tp-hero p {
        margin: 0;
        line-height: 1.4;
      }
      .panel small,
      .sheet small {
        font-size: 14px;
      }
      .panel-actions {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }
      .panel-actions button,
      .skill {
        font-size: 15px;
        padding: 8px 6px;
      }
      .skill {
        width: 100%;
        margin-top: 6px;
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: stretch;
      }
      .panel button,
      .sheet button {
        -webkit-tap-highlight-color: transparent;
      }
      .skill:disabled {
        opacity: 0.8;
      }
      .skill.running:disabled {
        opacity: 1;
      }
      .skill.ready {
        background: linear-gradient(#e4b861, #ab7736);
        border-color: #ffe5a6;
        color: #233b3a;
      }
      .skill.running {
        border-color: #9df0b0;
      }
      .bar {
        display: block;
        height: 8px;
        border-radius: 4px;
        background: #0b262c;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #ffd77d;
      }
      .skill.running .bar i {
        background: #9df0b0;
      }
      .avatar {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #ffe0a0;
        display: grid;
        place-items: center;
        font-weight: 800;
        font-size: 19px;
        color: #fff;
        text-shadow: 0 1px 2px #0008;
        background-size: cover;
        background-position: center;
      }
      .avatar.big {
        width: 64px;
        height: 64px;
        font-size: 28px;
      }
      .sheet-back {
        position: fixed;
        inset: 0;
        background: #0610147a;
        z-index: 10;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .sheet {
        width: min(560px, 100%);
        max-height: 72vh;
        overflow-y: auto;
        background: #12343c;
        border: 1px solid #e1bc77;
        border-bottom: 0;
        border-radius: 16px 16px 0 0;
        padding: 12px 14px calc(14px + env(safe-area-inset-bottom));
        font-size: 15px;
      }
      .hero-card {
        display: flex;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid #719b8f55;
      }
      .hero-card h3 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .hero-card p {
        margin: 2px 0;
        line-height: 1.45;
      }
      .hero-card .where {
        color: #ffe3a0;
      }
      .hero-card .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      .hero-card .card-actions button {
        font-size: 15px;
        padding: 8px 12px;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <h1>⚔️ WORLD DEFENSE</h1>
        <div class="stats">
          <span id="hp">❤️ 20</span><span id="gold">🪙 500G</span><span id="wave">WAVE 0/20</span>
        </div>
      </header>
      <canvas id="game" width="960" height="600" aria-label="ゲームマップ"></canvas>
      <section id="towerPanel" class="panel" hidden aria-label="選択中の塔">
        <div class="panel-head">
          <strong id="tpTitle"></strong
          ><button id="tpClose" class="icon-btn" aria-label="塔の選択を解除">✕</button>
        </div>
        <div id="tpStats" class="tp-stats"></div>
        <div id="tpHero" class="tp-hero"></div>
        <div class="panel-actions">
          <button id="upgrade">⬆ 強化</button><button id="sell">🪙 売却</button
          ><button id="assign">👤 武将配属</button>
        </div>
        <button id="skill" class="skill" hidden>
          <span id="skillLabel"></span><span class="bar"><i id="skillBar"></i></span>
        </button>
      </section>
      <div class="tools">
        <button data-t="arrow">🏹 弓 100G</button><button data-t="cannon">💣 大砲 180G</button
        ><button data-t="magic">🔮 魔法 220G</button><button data-t="ice">❄️ 氷 150G</button>
      </div>
      <div class="tools">
        <button id="start">▶ ウェーブ開始</button><button id="speed">⏩ x1</button
        ><button id="pause">⏸ 停止</button><button id="roster">👥 武将</button
        ><button id="reset">↻ 最初から</button>
      </div>
      <p id="msg">塔を選び、草地をタップして建設しよう。上下に分かれる道を守ろう！</p>
      <small>GitHub Pages / Safari対応・ペイント調・個別素材版 v6（武将配属）</small>
    </main>
    <div id="heroSheet" class="sheet-back" hidden>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="panel-head">
          <strong id="sheetTitle">武将配属</strong
          ><button id="sheetClose" class="icon-btn" aria-label="閉じる">✕</button>
        </div>
        <p id="sheetHint" style="margin: 6px 0"></p>
        <div id="heroList"></div>
      </div>
    </div>
    <script>
      (() => {
        "use strict";
        const C = document.getElementById("game"),
          ctx = C.getContext("2d");
        const $ = (id) => document.getElementById(id);
        const W = 960,
          H = 600;
        const types = {
          arrow: { cost: 100, range: 155, damage: 18, rate: 0.45, col: "#a56b35", icon: "🏹" },
          cannon: { cost: 180, range: 130, damage: 48, rate: 1.6, col: "#56616d", icon: "💣" },
          magic: { cost: 220, range: 170, damage: 32, rate: 0.8, col: "#8a57b5", icon: "🔮" },
          ice: { cost: 150, range: 145, damage: 9, rate: 0.95, col: "#65b9d6", icon: "❄️" },
        };
        const TOWER_NAMES = { arrow: "弓の塔", cannon: "大砲の塔", magic: "魔法の塔", ice: "氷の塔" };
        const CANNON_SPLASH = 65;

        // ===== 武将の調整用設定 =====
        // 数値はすべてここで調整する。能力は毎回「元の塔の数値」から計算するため、
        // 配属・解除・強化を繰り返しても効果が積み上がることはない。
        //   rangeMul / damageMul / cannonSplashMul … 配属した塔への倍率
        //   aura: 配属した塔の周囲の塔の攻撃速度を上げる（attackSpeed 0.2 = +20%）
        //   skill.duration … 効果時間（秒・戦闘中のみ進行） skill.cooldown … 発動からの再使用待ち（秒）
        const HERO_RULES = {
          maxAttackSpeedMul: 2.5, // 攻撃速度アップの合計上限（倍）
          auraIncludesSelf: false, // 軍師の支援を配属先の塔自身にも掛けるか
        };
        const HERO_CONFIG = {
          archer: {
            name: "弓の名手",
            short: "弓",
            color: "#c8743c",
            passive: { rangeMul: 1.2 },
            passiveText: "配属した塔の射程 +20%",
            skill: { name: "疾風連射", duration: 8, cooldown: 40, attackSpeedMul: 1.8 },
            skillText: "8秒間、配属した塔の攻撃速度 ×1.8",
          },
          gunner: {
            name: "砲術家",
            short: "砲",
            color: "#5d6878",
            passive: { damageMul: 1.3, cannonSplashMul: 1.4 },
            passiveText: "配属した塔の攻撃力 +30%（大砲なら爆発範囲 +40%）",
            skill: { name: "一斉砲撃", duration: 1.5, cooldown: 35, volleys: 3, blastDamageMul: 1.5 },
            skillText: "射程内の敵全員に3回の範囲砲撃（1回 = 攻撃力×1.5）",
          },
          strategist: {
            name: "軍師",
            short: "軍",
            color: "#3f8a6d",
            passive: { aura: { radius: 170, attackSpeed: 0.2 } },
            passiveText: "近く（半径170）の他の塔の攻撃速度 +20%",
            skill: {
              name: "天啓の采配",
              duration: 10,
              cooldown: 45,
              aura: { radiusMul: 1.25, attackSpeed: 0.45 },
            },
            skillText: "10秒間、支援が +45%・範囲 ×1.25 に強化",
          },
        };
        const STARTER_HEROES = ["archer", "gunner", "strategist"];
        // 武将画像は tools/build.mjs が assets/manifest.json をもとに埋め込む。
        // 画像がない項目は仮アイコン（色付きの円＋一文字）で描画する。
        const HERO_ASSETS = /*@@HERO_ASSETS@@*/ {};
        const SAVE_KEY = "worldDefense.heroes.v1";
        const upper = [
            [0, 300],
            [140, 300],
            [235, 165],
            [450, 165],
            [560, 300],
            [760, 300],
            [960, 300],
          ],
          lower = [
            [0, 300],
            [140, 300],
            [235, 440],
            [450, 440],
            [560, 300],
            [760, 300],
            [960, 300],
          ];
        let gold = 500,
          hp = 20,
          wave = 0,
          selectedType = "arrow",
          selectedTower = null,
          towers = [],
          enemies = [],
          shots = [],
          playing = false,
          paused = false,
          speed = 1,
          spawned = 0,
          spawnClock = 0,
          spawnTotal = 0,
          last = 0,
          over = false,
          towerSeq = 0;
        const rand = (a, b) => a + Math.random() * (b - a);
        const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
        function updateUI() {
          $("hp").textContent = "❤️ " + hp;
          $("gold").textContent = "🪙 " + Math.floor(gold) + "G";
          $("wave").textContent = "WAVE " + wave + "/20";
          $("start").disabled = playing || over;
          $("upgrade").disabled =
            !selectedTower || gold < upgradePrice(selectedTower) || selectedTower.level >= 5;
          $("sell").disabled = !selectedTower;
          document
            .querySelectorAll("[data-t]")
            .forEach((b) => b.classList.toggle("active", b.dataset.t === selectedType));
          renderTowerPanel();
        }
        const upgradePrice = (t) => Math.round(types[t.type].cost * (0.7 + t.level * 0.55));
        const towerLabel = (t) =>
          types[t.type].icon + " " + TOWER_NAMES[t.type] + " #" + t.id + " Lv" + t.level;

        // ===== 武将：状態・保存 =====
        // 配属先は heroState[id].tower だけで管理する（塔側には持たせない）ので、二重配属が起きない。
        // cd（再使用待ち）と active（効果残り）は武将に属するため、再配属してもリセットされない。
        const heroState = {};
        let cutin = null; // 必殺技発動時の小さなカットイン（見た目のみ）
        function newHeroState(id) {
          return { id, tower: null, active: 0, cd: 0, volleysLeft: 0, volleyClock: 0 };
        }
        function loadHeroSave() {
          const fallback = { owned: STARTER_HEROES.slice(), lastHero: null };
          try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (!raw) return fallback;
            const data = JSON.parse(raw);
            if (!data || typeof data !== "object") return fallback;
            const owned = Array.isArray(data.owned) ? data.owned.filter((id) => HERO_CONFIG[id]) : [];
            for (const id of STARTER_HEROES) if (!owned.includes(id)) owned.push(id);
            // 戦闘は保存しないため、配属情報（存在しない塔への参照）は読み込まない。
            return {
              owned: [...new Set(owned)],
              lastHero: HERO_CONFIG[data.lastHero] ? data.lastHero : null,
            };
          } catch (err) {
            console.warn("武将の保存データを読み込めないため初期化します", err);
            return fallback;
          }
        }
        const heroSave = loadHeroSave();
        function persistHeroes() {
          try {
            localStorage.setItem(
              SAVE_KEY,
              JSON.stringify({ version: 1, owned: heroSave.owned, lastHero: heroSave.lastHero }),
            );
          } catch (err) {
            // プライベートブラウズ等で保存できなくても遊べるようにする
          }
        }
        function resetHeroes() {
          for (const id of heroSave.owned) heroState[id] = newHeroState(id);
        }
        resetHeroes();
        persistHeroes();
        const heroOn = (t) => Object.values(heroState).find((h) => h.tower === t) || null;
        const ownedHeroes = () => heroSave.owned.map((id) => heroState[id]);

        // ===== 武将：能力計算 =====
        // 毎回 types（元の数値）とレベルから計算し、塔のデータは書き換えない。
        function auraFrom(h) {
          const a = HERO_CONFIG[h.id].passive.aura;
          if (!a || !h.tower) return null;
          const boost = h.active > 0 ? HERO_CONFIG[h.id].skill.aura : null;
          return {
            radius: a.radius * (boost ? boost.radiusMul : 1),
            attackSpeed: boost ? boost.attackSpeed : a.attackSpeed,
          };
        }
        function towerStats(t) {
          const p = types[t.type];
          let range = p.range,
            damage = p.damage * (1 + 0.55 * (t.level - 1)),
            splash = CANNON_SPLASH,
            speedMul = 1,
            aura = 0;
          const h = heroOn(t);
          if (h) {
            const c = HERO_CONFIG[h.id];
            range *= c.passive.rangeMul || 1;
            damage *= c.passive.damageMul || 1;
            if (t.type === "cannon") splash *= c.passive.cannonSplashMul || 1;
            if (h.active > 0 && c.skill.attackSpeedMul) speedMul *= c.skill.attackSpeedMul;
          }
          // 支援は武将ごとに1回だけ適用（同じ武将は1人しか配属できないので重複しない）
          for (const other of ownedHeroes()) {
            const a = auraFrom(other);
            if (!a || (other.tower === t && !HERO_RULES.auraIncludesSelf)) continue;
            if (dist(other.tower, t) <= a.radius) aura += a.attackSpeed;
          }
          speedMul = Math.min(HERO_RULES.maxAttackSpeedMul, speedMul * (1 + aura));
          return { range, damage, splash, rate: p.rate / speedMul, speedMul, aura };
        }

        // ===== 武将：配属・解除・必殺技 =====
        function endSkill(h) {
          h.active = 0;
          h.volleysLeft = 0;
        }
        function assignHero(id, t) {
          const h = heroState[id];
          if (!h || !towers.includes(t)) return;
          if (h.tower === t) return;
          const prev = heroOn(t);
          if (prev) {
            endSkill(prev);
            prev.tower = null;
          }
          endSkill(h); // 移動すると発動中の効果は終わる（再使用待ちはそのまま）
          h.tower = t;
          heroSave.lastHero = id;
          persistHeroes();
          msg(
            HERO_CONFIG[id].name +
              " を " +
              towerLabel(t) +
              " に配属した。" +
              (prev ? "（" + HERO_CONFIG[prev.id].name + " は未配属に戻りました）" : ""),
          );
        }
        function unassignHero(id) {
          const h = heroState[id];
          if (!h || !h.tower) return;
          endSkill(h);
          h.tower = null;
          msg(HERO_CONFIG[id].name + " の配属を解除した。");
        }
        const canUseSkill = (h) => h && h.tower && h.cd <= 0 && h.active <= 0 && playing && !paused && !over;
        function useSkill(h) {
          if (!canUseSkill(h)) return;
          const s = HERO_CONFIG[h.id].skill;
          h.active = s.duration;
          h.cd = s.cooldown;
          if (s.volleys) {
            h.volleysLeft = s.volleys;
            h.volleyClock = 0;
          }
          cutin = { id: h.id, age: 0, duration: 1.3 };
          msg("必殺技「" + s.name + "」発動！ " + HERO_CONFIG[h.id].skillText);
        }
        function heroVolley(h) {
          const t = h.tower,
            st = towerStats(t),
            dmg = st.damage * HERO_CONFIG[h.id].skill.blastDamageMul;
          let n = 0;
          for (const e of enemies) {
            if (e.hp <= 0 || dist(t, e) >= st.range) continue;
            e.hp -= dmg;
            e.hit = 0.18;
            if (n++ < 10) burst(e.x, e.y, "#ffd273", "cannon");
          }
          t.recoil = 0.22;
        }
        // 戦闘の時間で進める（停止中・ウェーブ間は進まない。速度切替は dt に反映済み）
        function tickHeroes(dt) {
          for (const h of ownedHeroes()) {
            if (h.cd > 0) h.cd = Math.max(0, h.cd - dt);
            if (h.active <= 0) continue;
            if (!h.tower) {
              endSkill(h);
              continue;
            }
            if (h.volleysLeft > 0) {
              h.volleyClock -= dt;
              while (h.volleysLeft > 0 && h.volleyClock <= 0) {
                heroVolley(h);
                h.volleysLeft--;
                h.volleyClock += HERO_CONFIG[h.id].skill.duration / HERO_CONFIG[h.id].skill.volleys;
              }
            }
            h.active = Math.max(0, h.active - dt);
            if (h.active <= 0) {
              endSkill(h);
              msg("「" + HERO_CONFIG[h.id].skill.name + "」の効果が終わった。");
            }
          }
        }
        function msg(s) {
          $("msg").textContent = s;
        }
        function pathAt(path, d) {

          drawCutin();
        }
        C.addEventListener("click", (ev) => {
          const r = C.getBoundingClientRect(),
            x = ((ev.clientX - r.left - C.clientLeft) * W) / C.clientWidth,
            y = ((ev.clientY - r.top - C.clientTop) * H) / C.clientHeight;
          const old = towers.find((t) => Math.hypot(t.x - x, t.y - y) < 38);
          if (old) {
            selectedTower = old;
            msg(towerLabel(old) + "：強化・売却・武将配属ができます。");
            updateUI();
            return;
          }
          if (selectedTower) {
            // 塔を選択中に草地をタップしたときは、誤建設を防ぐため選択解除だけ行う
            selectedTower = null;
            msg("塔の選択を解除した。もう一度草地をタップすると建設します。");
            updateUI();
            return;
          }
          const p = types[selectedType];
          if (gold < p.cost) {
            msg("資金が足りません。");
          } else if (
            x < 38 ||
            x > 825 ||
            y < 45 ||
            y > 555 ||
            roadDistance(x, y, upper) < 58 ||
            roadDistance(x, y, lower) < 58 ||
            towers.some((t) => Math.hypot(t.x - x, t.y - y) < 65)
          ) {
            msg("そこには建設できません。草地の広い場所を選んでね。");
          } else {
            gold -= p.cost;
            towers.push({ id: ++towerSeq, x, y, type: selectedType, level: 1, cd: 0, spent: p.cost });
            msg(p.icon + " 塔を建設した！");
          }
          updateUI();
        });
        document.querySelectorAll("[data-t]").forEach(
          (b) =>
            (b.onclick = () => {
              selectedType = b.dataset.t;
              selectedTower = null;
              msg(types[selectedType].icon + " を選択。草地をタップして建設しよう。");
              updateUI();
            }),
        );
        $("start").onclick = () => {
          if (playing || over) return;
          wave++;
          spawned = 0;
          spawnTotal = 8 + wave * 3;
          spawnClock = 0.5;
          playing = true;
          paused = false;
          msg("ウェーブ " + wave + " 開始！ 敵が分岐ルートを進んできます。");
          updateUI();
        };
        $("pause").onclick = () => {
          paused = !paused;
          $("pause").textContent = paused ? "▶ 再開" : "⏸ 停止";
          updateUI();
        };
        $("speed").onclick = () => {
          speed = speed === 1 ? 2 : 1;
          $("speed").textContent = "⏩ x" + speed;
        };
        $("upgrade").onclick = () => {
          if (!selectedTower || selectedTower.level >= 5) return;
          const price = Math.round(types[selectedTower.type].cost * (0.7 + selectedTower.level * 0.55));
          if (gold < price) return;
          gold -= price;
          selectedTower.spent += price;
          selectedTower.level++;
          msg("塔をレベル" + selectedTower.level + "に強化！");
          updateUI();
        };
        $("sell").onclick = () => {
          if (!selectedTower) return;
          gold += Math.floor(selectedTower.spent * 0.7);
          const h = heroOn(selectedTower);
          if (h) {
            endSkill(h);
            h.tower = null;
          }
          towers = towers.filter((t) => t !== selectedTower);
          selectedTower = null;
          msg("塔を売却した。" + (h ? HERO_CONFIG[h.id].name + " は未配属に戻りました。" : ""));
          updateUI();
        };
        $("reset").onclick = () => {
          if (!confirm("最初からやり直しますか？")) return;
          gold = 500;
          hp = 20;
          wave = 0;
          selectedTower = null;
          towers = [];
          enemies = [];
          shots = [];
          effects.length = 0;
          towerSeq = 0;
          resetHeroes();
          cutin = null;
          closeSheet();
          playing = false;
          paused = false;
          over = false;
          $("pause").textContent = "⏸ 停止";
          msg("新しいゲームを開始。塔を建てよう！");
          updateUI();
        };
        // ===== 塔パネル・武将配属画面 =====
        const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1);
        const esc = (s) =>
          String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        function avatarHtml(id, big) {
          const c = HERO_CONFIG[id],
            src = heroImageSrc(id, big ? "portrait" : "icon", big ? "icon" : "portrait");
          return src
            ? '<span class="avatar' +
                (big ? " big" : "") +
                '" style="background-image:url(' +
                src +
                ')"></span>'
            : '<span class="avatar' +
                (big ? " big" : "") +
                '" style="background:' +
                c.color +
                '">' +
                c.short +
                "</span>";
        }
        function setHtml(el, html) {
          if (el.dataset.html !== html) {
            el.innerHTML = html;
            el.dataset.html = html;
          }
        }
        function renderTowerPanel() {
          const t = selectedTower,
            panel = $("towerPanel");
          if (!t || !towers.includes(t)) {
            panel.hidden = true;
            return;
          }
          panel.hidden = false;
          const p = types[t.type],
            st = towerStats(t),
            h = heroOn(t);
          $("tpTitle").textContent = towerLabel(t);
          const base = p.damage * (1 + 0.55 * (t.level - 1));
          const mark = (v, b) => (Math.abs(v - b) > 0.01 ? ' class="buff"' : "");
          setHtml(
            $("tpStats"),
            "<span>攻撃 <b" +
              mark(st.damage, base) +
              ">" +
              Math.round(st.damage) +
              "</b></span>" +
              "<span>射程 <b" +
              mark(st.range, p.range) +
              ">" +
              Math.round(st.range) +
              "</b></span>" +
              "<span>間隔 <b" +
              mark(st.rate, p.rate) +
              ">" +
              fmt(st.rate) +
              "秒</b></span>" +
              (t.type === "cannon"
                ? "<span>爆発 <b" +
                  mark(st.splash, CANNON_SPLASH) +
                  ">" +
                  Math.round(st.splash) +
                  "</b></span>"
                : "") +
              (st.aura > 0 ? '<span class="buff">軍師の支援 +' + Math.round(st.aura * 100) + "%</span>" : ""),
          );
          setHtml(
            $("tpHero"),
            h
              ? avatarHtml(h.id) +
                  "<p><b>" +
                  HERO_CONFIG[h.id].name +
                  "</b> 配属中<br><small>" +
                  HERO_CONFIG[h.id].passiveText +
                  "</small></p>"
              : "<p><small>武将なし（「武将配属」から配属できます）</small></p>",
          );
          const maxed = t.level >= 5;
          $("upgrade").textContent = maxed ? "⬆ 最大Lv" : "⬆ 強化 " + upgradePrice(t) + "G";
          $("sell").textContent = "🪙 売却 " + Math.floor(t.spent * 0.7) + "G";
          $("assign").textContent = h ? "👤 武将変更" : "👤 武将配属";
          const btn = $("skill");
          btn.hidden = !h;
          if (!h) return;
          const s = HERO_CONFIG[h.id].skill;
          let label, ratio, state;
          if (h.active > 0) {
            label = "✨ " + s.name + " 発動中 残り" + fmt(h.active) + "秒";
            ratio = h.active / s.duration;
            state = "running";
          } else if (h.cd > 0) {
            label =
              "⌛ " +
              s.name +
              " 再使用まで" +
              Math.ceil(h.cd) +
              "秒" +
              (playing && !paused ? "" : "（戦闘中に進行）");
            ratio = 1 - h.cd / s.cooldown;
            state = "";
          } else {
            label =
              "⚡ 必殺技「" +
              s.name +
              "」" +
              (playing && !over ? (paused ? "（停止中）" : "") : "（ウェーブ中に使用可）");
            ratio = 1;
            state = canUseSkill(h) ? "ready" : "";
          }
          $("skillLabel").textContent = label;
          $("skillBar").style.width = Math.round(ratio * 100) + "%";
          btn.className = "skill " + state;
          btn.disabled = !canUseSkill(h);
          btn.setAttribute("aria-label", label + "。" + HERO_CONFIG[h.id].skillText);
        }
        let sheetTower = null;
        function renderSheet() {
          const t = sheetTower && towers.includes(sheetTower) ? sheetTower : null;
          $("sheetTitle").textContent = t ? "武将配属：" + towerLabel(t) : "武将一覧";
          $("sheetHint").textContent = t
            ? "配属する武将を選んでください。1基に1人、同じ武将は1か所だけです。"
            : "配属先の確認と解除ができます。配属は塔をタップして「武将配属」から。";
          const ids = heroSave.owned.slice();
          if (heroSave.lastHero) ids.sort((a, b) => (b === heroSave.lastHero) - (a === heroSave.lastHero));
          $("heroList").innerHTML = ids
            .map((id) => {
              const h = heroState[id],
                c = HERO_CONFIG[id];
              const where = h.tower ? "配属先：" + esc(towerLabel(h.tower)) : "未配属";
              const timer =
                h.active > 0
                  ? "（必殺技 発動中）"
                  : h.cd > 0
                    ? "（必殺技 再使用まで" + Math.ceil(h.cd) + "秒）"
                    : "";
              let actions = "";
              if (t && h.tower === t) actions += "<button disabled>この塔に配属中</button>";
              else if (t)
                actions +=
                  '<button data-assign="' +
                  id +
                  '">' +
                  (h.tower ? "この塔へ移動" : "この塔に配属") +
                  "</button>";
              if (h.tower) actions += '<button data-unassign="' + id + '">解除</button>';
              return (
                '<div class="hero-card">' +
                avatarHtml(id, true) +
                "<div><h3>" +
                c.name +
                "</h3>" +
                "<p>常時：" +
                c.passiveText +
                "</p><p>必殺技「" +
                c.skill.name +
                "」：" +
                c.skillText +
                "（再使用 " +
                c.skill.cooldown +
                "秒）</p>" +
                '<p class="where">' +
                where +
                timer +
                "</p>" +
                '<div class="card-actions">' +
                actions +
                "</div></div></div>"
              );
            })
            .join("");
        }
        function openSheet(t) {
          sheetTower = t;
          renderSheet();
          $("heroSheet").hidden = false;
          $("sheetClose").focus();
        }
        function closeSheet() {
          sheetTower = null;
          $("heroSheet").hidden = true;
        }
        $("heroList").addEventListener("click", (ev) => {
          const b = ev.target.closest("button");
          if (!b) return;
          if (b.dataset.assign && sheetTower) {
            assignHero(b.dataset.assign, sheetTower);
            closeSheet();
          } else if (b.dataset.unassign) {
            unassignHero(b.dataset.unassign);
            renderSheet();
          }
          updateUI();
        });
        $("heroSheet").addEventListener("click", (ev) => {
          if (ev.target === $("heroSheet")) closeSheet();
        });
        $("sheetClose").onclick = closeSheet;
        $("assign").onclick = () => selectedTower && openSheet(selectedTower);
        $("roster").onclick = () => openSheet(null);
        $("tpClose").onclick = () => {
          selectedTower = null;
          updateUI();
        };
        $("skill").onclick = () => {
          const h = selectedTower && heroOn(selectedTower);
          if (!h) return;
          if (!canUseSkill(h)) {
            msg(playing ? "必殺技はまだ使えません。" : "必殺技はウェーブ中に使えます。");
            return;
          }
          useSkill(h);
          updateUI();
        };
        document.addEventListener("keydown", (ev) => {
          if (ev.key === "Escape" && !$("heroSheet").hidden) closeSheet();
        });
        document.addEventListener("visibilitychange", () => {
          last = 0;
        });
        function frame(now) {
          const dt = last ? (now - last) / 1000 : 0;
          last = now;
          tick(dt);
          animateVisuals(dt);
          draw();
          requestAnimationFrame(frame);
        }
        // 動作確認用（URLに ?debug を付けたときだけ公開。通常プレイには影響しない）
        if (/[?&]debug\b/.test(location.search)) {
          window.WD_DEBUG = {
            state: () => ({
              gold,
              hp,
              wave,
              playing,
              paused,
              over,
              speed,
              towers,
              enemies,
              heroState,
              selectedTower,
            }),
            towerStats,
            setGold: (g) => {
              gold = g;
              updateUI();
            },
            step: (sec) => {
              for (let i = 0; i < Math.round(sec / 0.05); i++) {
                tick(0.05);
                animateVisuals(0.05);
              }
            },
            config: { HERO_CONFIG, HERO_RULES },
          };
        }
        updateUI();
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
